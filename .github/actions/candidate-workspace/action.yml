name: Install the workspace on an engine candidate
description: >-
  Forces an unreleased @afterpack/core onto the whole workspace as a pnpm
  override, fetched from the engine's source registry, checks that every
  package resolved it, and builds every package. The registry token lives
  only in the install step and in an npmrc under RUNNER_TEMP that is deleted
  before any dependency's install script runs.

inputs:
  version:
    description: "The @afterpack/core candidate, e.g. 0.2.2-rc.202610011200"
    required: true
  registry:
    description: "The engine's source registry URL (the ENGINE_REGISTRY secret)"
    required: true
  token:
    description: "A read-only token for that registry (the ENGINE_REGISTRY_TOKEN secret)"
    required: true

runs:
  using: composite
  steps:
    - name: Install the workspace on the candidate engine
      shell: bash
      env:
        CANDIDATE: ${{ inputs.version }}
        ENGINE_REGISTRY: ${{ inputs.registry }}
        ENGINE_REGISTRY_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [ -z "${ENGINE_REGISTRY:-}" ] || [ -z "${ENGINE_REGISTRY_TOKEN:-}" ]; then
          echo "::error::ENGINE_REGISTRY and ENGINE_REGISTRY_TOKEN must be set in this job's environment"
          exit 1
        fi
        host="${ENGINE_REGISTRY#https://}"
        host="${host%/}"
        echo "::add-mask::$host"
        source_registry="https://${host}/"
        npmrc="$RUNNER_TEMP/candidate.npmrc"
        trap 'rm -f "$npmrc"' EXIT
        {
          echo "@afterpack:registry=${source_registry}"
          echo "//${host}/:_authToken=${ENGINE_REGISTRY_TOKEN}"
        } > "$npmrc"
        npm pkg set "pnpm.overrides.@afterpack/core=${CANDIDATE}"
        NPM_CONFIG_USERCONFIG="$npmrc" pnpm install --no-frozen-lockfile --ignore-scripts

    - name: Run the dependencies' install scripts
      shell: bash
      run: pnpm rebuild --recursive --pending

    - name: Check every package resolved the candidate
      shell: bash
      env:
        CANDIDATE: ${{ inputs.version }}
      run: |
        set -euo pipefail
        checked=0
        for manifest in packages/*/node_modules/@afterpack/core/package.json; do
          resolved=$(node -p "require('./${manifest}').version")
          echo "${manifest%%/node_modules/*} resolves @afterpack/core@${resolved}"
          if [ "$resolved" != "$CANDIDATE" ]; then
            echo "::error::${manifest} is @afterpack/core@${resolved}, not the candidate ${CANDIDATE}"
            exit 1
          fi
          checked=$((checked + 1))
        done
        if [ "$checked" -eq 0 ]; then
          echo "::error::no package resolved @afterpack/core"
          exit 1
        fi

    - name: Build every package
      shell: bash
      run: pnpm -r build
