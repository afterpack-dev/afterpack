name: Release

# The one workflow that publishes the CLI and the plugins to npm, so each
# package needs a single trusted publisher. Every package carries one version.
#
#  * Release lane: a push to main publishes a new patch of every package to
#    `latest`, but only when a file that ships in a package's npm tarball
#    changed, and only while the repo variable AUTO_RELEASE is `true`. A
#    manual run with lane=release always publishes one, with the bump it
#    names (patch, minor or major).
#  * RC lane: a manual run with lane=rc publishes the next patch as a
#    timestamp release candidate under the `rc` dist-tag, installable as
#    `npx afterpack@rc`, without moving `latest`.
#  * Promote lane: a manual run with lane=promote and an rc_version
#    republishes that RC's tree as the clean version under `latest`.
#  * `repository_dispatch` type `core-published` reacts to a stable engine
#    release by bumping the `@afterpack/core` pin across every package, then
#    runs the release lane.
#
# Every publish waits for approval on the `npm` environment. The version is
# stamped at publish time and never committed: the root package.json version
# is a floor, and the next version is one bump above the higher of the last
# vX.Y.Z tag and the npm `latest` of `afterpack`.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lane:
        description: "release publishes to latest; rc publishes a release candidate; promote moves rc_version to latest"
        required: true
        default: rc
        type: choice
        options: [release, rc, promote]
      bump:
        description: "Release and rc lanes: the part of the version to raise"
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]
      rc_version:
        description: "Promote lane only: the release candidate to promote, e.g. 0.1.0-rc.20260908T1530"
        required: false
        type: string
  repository_dispatch:
    types: [core-published]

run-name: >-
  ${{ github.event_name == 'repository_dispatch' && format('Bump engine to {0}', github.event.client_payload.version)
  || github.event_name == 'push' && 'Release on a shipped change'
  || inputs.lane == 'promote' && format('Promote {0}', inputs.rc_version)
  || inputs.lane == 'release' && format('Release ({0})', inputs.bump)
  || 'Release candidate' }}

# Releases to `latest` run one at a time. A push while AUTO_RELEASE is off
# gets a group of its own, so it never displaces a queued release.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'repository_dispatch' && 'bump'
    || github.event_name == 'push' && (vars.AUTO_RELEASE == 'true' && 'latest' || github.run_id)
    || inputs.lane == 'promote' && 'promote'
    || inputs.lane == 'release' && 'latest'
    || 'rc' }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  plan:
    name: Decide what to release
    if: >-
      (github.event_name == 'push' && vars.AUTO_RELEASE == 'true')
      || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'release' || inputs.lane == 'rc'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      bump: ${{ steps.lane.outputs.bump }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: github.event_name == 'push'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: github.event_name == 'push'
        with:
          node-version: 22

      - name: Install dependencies
        if: github.event_name == 'push'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: github.event_name == 'push'
        run: pnpm build

      # Packs every package from this commit and compares each tarball with
      # the one npm serves as `latest`, ignoring the version. Only what a user
      # would install counts: tests, fixtures and CI never reach a tarball.
      - name: Compare every package with its npm latest
        id: shipped
        if: github.event_name == 'push'
        run: node scripts/release-plan.mjs changed

      - name: Choose the lane
        id: lane
        env:
          EVENT: ${{ github.event_name }}
          SHIPPED: ${{ steps.shipped.outputs.changed }}
          PACKAGES: ${{ steps.shipped.outputs.packages }}
          INPUT_LANE: ${{ inputs.lane }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          if [ "$EVENT" = "push" ]; then
            if [ "$SHIPPED" = "true" ]; then LANE="release"; else LANE="none"; fi
            BUMP="patch"
          else
            LANE="$INPUT_LANE"
            BUMP="${INPUT_BUMP:-patch}"
          fi
          echo "lane=$LANE" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          {
            if [ "$LANE" = "none" ]; then
              echo "No shipped file changed since the npm \`latest\`; nothing to release."
            elif [ "$EVENT" = "push" ]; then
              echo "Shipped change in: \`$PACKAGES\`. Releasing a new patch of every package."
            else
              echo "Lane \`$LANE\`, bump \`$BUMP\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Hygiene, lint, build, typecheck, test
    needs: plan
    if: needs.plan.outputs.lane == 'release' || needs.plan.outputs.lane == 'rc'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repo hygiene
        run: pnpm hygiene

      - name: Comment ban
        run: pnpm check:comments

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  e2e:
    name: End-to-end (Playwright, full suite)
    needs: plan
    if: needs.plan.outputs.lane == 'release' || needs.plan.outputs.lane == 'rc'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build every package
        run: pnpm -r build

      - name: Install the e2e fixtures
        run: pnpm e2e:install

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end suite
        run: pnpm e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            .afterpack/e2e/playwright-report/**
            .afterpack/e2e/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  pro-path:
    name: Pro cloud path (staging)
    needs: plan
    if: needs.plan.outputs.lane == 'release' || needs.plan.outputs.lane == 'rc'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The key lives in an environment, so it reaches this job and nothing else.
    # A pull request from a fork is never given secrets at all, which is why
    # this check is here and not in the contributor lane.
    environment: staging-pro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # A throwaway project rather than an e2e fixture: this is the paid path,
      # and it should not break because a fixture's layout moved.
      - name: A build with a key runs on the Pro engine
        env:
          AFTERPACK_KEY: ${{ secrets.AFTERPACK_KEY }}
          AFTERPACK_API_URL: ${{ vars.AFTERPACK_API_URL }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pro" && mkdir -p "$RUNNER_TEMP/pro/dist"
          echo '{"name":"pro-path-check","private":true}' > "$RUNNER_TEMP/pro/package.json"
          echo 'export const k="paid";export function f(a){return a*2}' > "$RUNNER_TEMP/pro/dist/app.js"
          node packages/cli/dist/cli.js "$RUNNER_TEMP/pro/dist" \
            --protectionMap.enabled=false --telemetry.enabled=false
          ENGINE=$(node -p "require('$RUNNER_TEMP/pro/dist/.afterpack-protection.json').engine")
          echo "receipt records engine: $ENGINE"
          if [ "$ENGINE" != "cloud" ]; then
            echo "a build with a Pro key did not run on the cloud engine (receipt says '$ENGINE')" >&2
            exit 1
          fi

      # The guarantee that matters: a key that the API refuses must FAIL the
      # build, never quietly produce free-tier output.
      - name: A build with a rejected key fails closed
        env:
          AFTERPACK_KEY: ap_v1_0000000000000000000000000000000000000000
          AFTERPACK_API_URL: ${{ vars.AFTERPACK_API_URL }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/closed" && mkdir -p "$RUNNER_TEMP/closed/dist"
          echo '{"name":"fail-closed-check","private":true}' > "$RUNNER_TEMP/closed/package.json"
          SOURCE='export const k="paid";export function f(a){return a*2}'
          printf '%s' "$SOURCE" > "$RUNNER_TEMP/closed/dist/app.js"
          if node packages/cli/dist/cli.js "$RUNNER_TEMP/closed/dist" \
            --protectionMap.enabled=false --telemetry.enabled=false; then
            echo "a rejected key produced a successful build" >&2
            exit 1
          fi
          if [ "$(cat "$RUNNER_TEMP/closed/dist/app.js")" != "$SOURCE" ]; then
            echo "a rejected key rewrote the input" >&2
            exit 1
          fi
          if [ -f "$RUNNER_TEMP/closed/dist/.afterpack-protection.json" ]; then
            echo "a rejected key still wrote a protection receipt" >&2
            exit 1
          fi

  publish:
    name: Publish ${{ needs.plan.outputs.lane == 'rc' && 'a release candidate' || 'a release' }}
    needs: [plan, checks, e2e, pro-path]
    runs-on: ubuntu-latest
    environment: npm
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: ${{ vars.NPM_TRUSTED_PUBLISHING != 'true' && 'https://registry.npmjs.org' || '' }}

      # Trusted publishing needs npm 11.5.1 or newer; pnpm publish runs this npm.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Computed after the approval, so a release that waited reads the tags
      # and the npm `latest` as they are now.
      - name: Compute the version
        id: version
        env:
          LANE: ${{ needs.plan.outputs.lane }}
          BUMP: ${{ needs.plan.outputs.bump }}
        run: |
          set -euo pipefail
          if [ "$LANE" = "rc" ]; then
            VERSION=$(node scripts/release-plan.mjs version --bump "$BUMP" --rc)
            DIST_TAG=rc
            GIT_TAG="rc-$VERSION"
          else
            VERSION=$(node scripts/release-plan.mjs version --bump "$BUMP")
            DIST_TAG=latest
            GIT_TAG="v$VERSION"
          fi
          {
            echo "VERSION=$VERSION"
            echo "DIST_TAG=$DIST_TAG"
            echo "GIT_TAG=$GIT_TAG"
          } >> "$GITHUB_ENV"
          {
            echo "version=$VERSION"
            echo "dist_tag=$DIST_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set the version across every package
        run: pnpm version:set --version "$VERSION"

      - name: Build
        run: pnpm build

      # `pnpm -r publish` skips every package marked private, so the workspace
      # root is never published.
      - name: Publish to the ${{ steps.version.outputs.dist_tag }} dist-tag
        run: pnpm -r publish --tag "$DIST_TAG" --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ vars.NPM_TRUSTED_PUBLISHING != 'true' && secrets.NPM_TOKEN || '' }}

      # The tag names the SOURCE commit, not the version bump, which is never
      # committed. The promote lane checks an rc- tag out and re-derives a
      # clean version from it.
      - name: Tag the source commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$GIT_TAG"
          git push origin "$GIT_TAG"

      - name: Summary
        run: |
          {
            echo "Published \`$VERSION\` to the \`$DIST_TAG\` dist-tag and tagged \`$GIT_TAG\`."
            echo ""
            if [ "$DIST_TAG" = "rc" ]; then
              echo "Try it: \`npx afterpack@rc --version\`"
              echo "Promote it: run the Release workflow with \`lane: promote\` and \`rc_version: $VERSION\`."
            else
              echo "Try it: \`npx afterpack@latest --version\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote a release candidate to latest
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'promote'
    runs-on: ubuntu-latest
    environment: npm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require an rc_version
        env:
          RC: ${{ inputs.rc_version }}
        run: |
          if [ -z "$RC" ]; then
            echo "::error::the promote lane needs rc_version"
            exit 1
          fi

      # Promote-by-republish: the tree that publishes to `latest` is byte for
      # byte the tree that was published as the RC, not a fresh build of main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: rc-${{ inputs.rc_version }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: ${{ vars.NPM_TRUSTED_PUBLISHING != 'true' && 'https://registry.npmjs.org' || '' }}

      # Trusted publishing needs npm 11.5.1 or newer; pnpm publish runs this npm.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Derive the stable version
        id: version
        run: |
          RC="${{ inputs.rc_version }}"
          VERSION="${RC%%-rc.*}"
          if [ -z "$RC" ] || [ "$VERSION" = "$RC" ]; then
            echo "::error::'$RC' is not a release-candidate version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set the version across every package
        run: pnpm version:set --version "$VERSION"

      - name: Build
        run: pnpm build

      - name: Publish to the latest dist-tag
        run: pnpm -r publish --tag latest --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ vars.NPM_TRUSTED_PUBLISHING != 'true' && secrets.NPM_TOKEN || '' }}

      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

  release:
    name: Create the GitHub Release
    needs: [promote, publish]
    if: >-
      !cancelled()
      && (needs.promote.result == 'success'
      || (needs.publish.result == 'success' && needs.publish.outputs.dist_tag == 'latest'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.promote.outputs.version || needs.publish.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "v$VERSION already has a release"
            exit 0
          fi
          gh release create "v$VERSION" --repo "$REPO" --title "v$VERSION" --generate-notes

  verify:
    name: Verify the published release
    needs: [promote, publish]
    if: >-
      !cancelled()
      && (needs.promote.result == 'success'
      || (needs.publish.result == 'success' && needs.publish.outputs.dist_tag == 'latest'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A clean runner with nothing from this repository checked out: the only
      # thing under test is what a user gets from npm.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The registry takes minutes to serve a fresh publish everywhere, and
      # afterpack pins its sibling packages exactly, so retry for up to 10 minutes.
      - name: Install from npm and run it
        env:
          WANT: ${{ needs.promote.outputs.version || needs.publish.outputs.version }}
        run: |
          for attempt in $(seq 1 20); do
            INSTALLED=$(npx --yes --prefer-online afterpack@latest --version 2>/dev/null || true)
            echo "attempt $attempt: afterpack@latest reports '$INSTALLED'"
            if [ "$INSTALLED" = "$WANT" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::expected $WANT, got '$INSTALLED' after 10 minutes"
          exit 1

  bump-engine:
    name: Bump the engine pin
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # A breaking engine bump is a deliberate migration, never an automatic
      # commit: it fails here so a human does it. Under major 0 a minor
      # change is breaking, exactly like a major.
      - name: Repin @afterpack/core across every package
        run: |
          NEXT="${{ github.event.client_payload.version }}"
          NEXT="${NEXT#v}"
          node - "$NEXT" <<'NODE'
          const fs = require("node:fs");
          const next = process.argv[2];
          if (!/^\d+\.\d+\.\d+$/.test(next)) {
            console.error(`::error::'${next}' is not a stable version`);
            process.exit(1);
          }
          const breakingLine = (v) => {
            const [major, minor] = v.split(".");
            return major === "0" ? `0.${minor}` : major;
          };
          const nextLine = breakingLine(next);
          let changed = 0;
          for (const dir of fs.readdirSync("packages")) {
            const file = `packages/${dir}/package.json`;
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            const current = pkg.dependencies?.["@afterpack/core"];
            if (!current) continue;
            const currentLine = breakingLine(current.replace(/^[~^]/, ""));
            if (currentLine !== nextLine) {
              console.error(`::error::${file} pins ${current}; ${next} is a breaking change`);
              process.exit(1);
            }
            pkg.dependencies["@afterpack/core"] = `~${next}`;
            fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
            changed++;
          }
          console.log(`repinned ${changed} package(s) to ~${next}`);
          NODE
          echo "ENGINE_VERSION=$NEXT" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "::notice::already pinned to $ENGINE_VERSION"
            exit 0
          fi
          pnpm install --lockfile-only
          git add packages/*/package.json pnpm-lock.yaml
          git commit -m "chore(deps): bump @afterpack/core to $ENGINE_VERSION"
          git push origin main
          echo "BUMPED=1" >> "$GITHUB_ENV"

      # The new pin ships in every package.json, so it is a shipped change.
      # A push made with GITHUB_TOKEN never triggers another workflow, so the
      # release lane is dispatched explicitly; workflow_dispatch is the
      # documented exception. It follows the same AUTO_RELEASE switch as a
      # push to main.
      - name: Release against the new engine
        if: env.BUMPED == '1' && vars.AUTO_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f lane=release -f bump=patch

      - name: Say how to release by hand
        if: env.BUMPED == '1' && vars.AUTO_RELEASE != 'true'
        run: echo "::notice::AUTO_RELEASE is off, so nothing was released. Run the Release workflow with lane=release."
