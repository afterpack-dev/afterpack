name: Release

# The one workflow that publishes the CLI and the plugins to npm, so each
# package needs a single trusted publisher. Every package carries one version.
#
# One lane, straight to `latest`: decide the version, run every gate on the
# commit, publish, then verify what npm serves on Linux, macOS and Windows.
#
#  * `repository_dispatch` type `core-published`, sent by the Publish engine
#    workflow once npmjs serves a stable engine, first repins
#    @afterpack/core across every package. A new release line (a minor under
#    major 0) also raises every package version and MIN_CORE_VERSION to it.
#    The bump waits until npmjs serves the engine, writes the lockfile
#    against npmjs, runs the gates, pushes to main and releases that commit.
#  * A manual run releases the commit it runs on, with the bump it names.
#
# Nothing is released when no package ships a change against its npm
# `latest`. The version is decided once per run and the publish skips every
# package npmjs already holds at that version with the same files, so
# "Re-run failed jobs" resumes the release. A fresh run is no resume: once
# every package is out it releases nothing, so it never tags or creates the
# GitHub Release, and it refuses to publish beside a different build of the
# same version. The version is stamped at publish time and never
# committed: the root package.json version is a floor, and the next version
# is one bump above the higher of the last vX.Y.Z tag and the npm `latest`
# of `afterpack`. The human approval for a production ship is the Approve
# workflow; the `npm` environment only binds the trusted publishers, so
# rename neither this file nor that environment.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "The part of the version to raise"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
  repository_dispatch:
    types: [core-published]

run-name: >-
  ${{ github.event_name == 'repository_dispatch' && format('Bump engine to {0} and release', github.event.client_payload.version)
  || format('Release ({0})', inputs.bump) }}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

# A job skipped upstream (bump-engine on a manual run) would skip every job
# below it through the implicit success(), so each gate names the results it
# depends on instead.
jobs:
  bump-engine:
    name: Bump the engine pin
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Repin @afterpack/core across every package
        id: bump
        env:
          ENGINE_VERSION: ${{ github.event.client_payload.version }}
        run: node scripts/bump-engine.mjs "$ENGINE_VERSION"

      # A lockfile resolved before npmjs serves the engine fails to install.
      - name: Wait until npmjs serves the engine
        if: steps.bump.outputs.changed == 'true'
        env:
          ENGINE_VERSION: ${{ steps.bump.outputs.version }}
        run: node scripts/npm-release.mjs wait --version "$ENGINE_VERSION"

      - name: Write the lockfile against npmjs and run the gates
        if: steps.bump.outputs.changed == 'true'
        run: |
          pnpm install --no-frozen-lockfile
          pnpm hygiene
          pnpm check:comments
          pnpm lint
          pnpm build
          pnpm typecheck
          pnpm test

      - name: Commit and push
        id: push
        env:
          CHANGED: ${{ steps.bump.outputs.changed }}
          ENGINE_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$CHANGED" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json packages/*/package.json packages/integration-utils/src/compat.ts pnpm-lock.yaml
            git commit -m "chore(deps): bump @afterpack/core to $ENGINE_VERSION"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  version:
    name: Decide the version
    needs: bump-engine
    if: ${{ !cancelled() && (needs.bump-engine.result == 'success' || needs.bump-engine.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-engine.outputs.sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Packs every package from this commit and compares each tarball with
      # the one npm serves as `latest`, ignoring the version. Only what a user
      # would install counts: tests, fixtures and CI never reach a tarball.
      - name: Compare every package with its npm latest
        id: shipped
        run: node scripts/release-plan.mjs changed

      - name: Compute the version
        id: plan
        env:
          SHIPPED: ${{ steps.shipped.outputs.changed }}
          PACKAGES: ${{ steps.shipped.outputs.packages }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$SHIPPED" != "true" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No package ships a change against its npm \`latest\`; nothing to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          VERSION=$(node scripts/release-plan.mjs version --bump "$BUMP")
          {
            echo "release=true"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing \`$VERSION\` of every package (\`$BUMP\`); shipped change in \`$PACKAGES\`." >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Hygiene, lint, build, typecheck, test
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repo hygiene
        run: pnpm hygiene

      - name: Comment ban
        run: pnpm check:comments

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  e2e:
    name: End-to-end (Playwright, full suite)
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build every package
        run: pnpm -r build

      - name: Install the e2e fixtures
        run: pnpm e2e:install

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end suite
        run: pnpm e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            .afterpack/e2e/playwright-report/**
            .afterpack/e2e/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  pro-path:
    name: Pro cloud path (staging)
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    # The key lives in an environment, so it reaches this job and nothing else.
    # A pull request from a fork is never given secrets at all, which is why
    # this check is here and not in the contributor lane.
    environment: staging-pro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # A throwaway project rather than an e2e fixture: this is the paid path,
      # and it should not break because a fixture's layout moved.
      - name: A build with a key runs on the Pro engine
        env:
          AFTERPACK_KEY: ${{ secrets.AFTERPACK_KEY }}
          AFTERPACK_API_URL: ${{ vars.AFTERPACK_API_URL }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pro" && mkdir -p "$RUNNER_TEMP/pro/dist"
          echo '{"name":"pro-path-check","private":true}' > "$RUNNER_TEMP/pro/package.json"
          echo 'export const k="paid";export function f(a){return a*2}' > "$RUNNER_TEMP/pro/dist/app.js"
          node packages/cli/dist/cli.js "$RUNNER_TEMP/pro/dist" \
            --protectionMap.enabled=false --telemetry.enabled=false
          ENGINE=$(node -p "require('$RUNNER_TEMP/pro/dist/.afterpack-protection.json').engine")
          echo "receipt records engine: $ENGINE"
          if [ "$ENGINE" != "cloud" ]; then
            echo "a build with a Pro key did not run on the cloud engine (receipt says '$ENGINE')" >&2
            exit 1
          fi

      # The guarantee that matters: a key that the API refuses must FAIL the
      # build, never quietly produce free-tier output.
      - name: A build with a rejected key fails closed
        env:
          AFTERPACK_KEY: ap_v1_0000000000000000000000000000000000000000
          AFTERPACK_API_URL: ${{ vars.AFTERPACK_API_URL }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/closed" && mkdir -p "$RUNNER_TEMP/closed/dist"
          echo '{"name":"fail-closed-check","private":true}' > "$RUNNER_TEMP/closed/package.json"
          SOURCE='export const k="paid";export function f(a){return a*2}'
          printf '%s' "$SOURCE" > "$RUNNER_TEMP/closed/dist/app.js"
          if node packages/cli/dist/cli.js "$RUNNER_TEMP/closed/dist" \
            --protectionMap.enabled=false --telemetry.enabled=false; then
            echo "a rejected key produced a successful build" >&2
            exit 1
          fi
          if [ "$(cat "$RUNNER_TEMP/closed/dist/app.js")" != "$SOURCE" ]; then
            echo "a rejected key rewrote the input" >&2
            exit 1
          fi
          if [ -f "$RUNNER_TEMP/closed/dist/.afterpack-protection.json" ]; then
            echo "a rejected key still wrote a protection receipt" >&2
            exit 1
          fi

  publish:
    name: Publish ${{ needs.version.outputs.version }} to latest
    needs: [version, checks, e2e, pro-path]
    if: >-
      ${{ !cancelled() && needs.version.outputs.release == 'true'
      && needs.checks.result == 'success' && needs.e2e.result == 'success'
      && needs.pro-path.result == 'success' }}
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 75
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set the version across every package
        run: pnpm version:set --version "$VERSION"

      - name: Build
        run: pnpm build

      - name: Pack every package
        run: node scripts/release-plan.mjs pack --into "$RUNNER_TEMP/release"

      - name: Publish to the latest dist-tag
        run: node scripts/npm-release.mjs publish --dir "$RUNNER_TEMP/release" --tag latest --provenance

      # The tag names the SOURCE commit, not the version bump, which is never
      # committed. A re-run finds its own tag and moves on.
      - name: Tag the source commit
        run: |
          set -euo pipefail
          TAGGED=$(git ls-remote --tags origin "refs/tags/v$VERSION" | cut -f1)
          if [ -z "$TAGGED" ]; then
            git tag "v$VERSION" "$SHA"
            git push origin "v$VERSION"
          elif [ "$TAGGED" != "$SHA" ]; then
            echo "::error::v$VERSION already names $TAGGED, not $SHA"
            exit 1
          fi

      - name: Wait until npmjs serves every tarball
        run: node scripts/npm-release.mjs wait --dir "$RUNNER_TEMP/release" --tag latest

  release:
    name: Create the GitHub Release
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "v$VERSION already has a release"
            exit 0
          fi
          gh release create "v$VERSION" --repo "$REPO" --title "v$VERSION" --generate-notes

  verify:
    name: Verify on ${{ matrix.os }}
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Installs the published CLI from npmjs into an empty project and runs
      # it on the smoke fixtures with this OS's native engine binding.
      - name: Install afterpack from npm and run it
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/smoke.mjs release --version "$VERSION"
