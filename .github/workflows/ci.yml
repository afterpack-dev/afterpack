name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure TypeScript, no native code, nothing OS/Node-version-specific under
  # test -- Node's cross-platform guarantees already cover this, so a
  # 3-OS x 2-Node-version matrix (6 redundant jobs) was paying for signal
  # this package can't actually produce. One combination (current LTS, the
  # cheapest runner) is enough; widen back to a real matrix only if a real
  # platform- or Node-version-specific bug is ever suspected.
  test:
    name: Test - Node ${{ matrix.node }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm test
