name: CI

# A pull request runs on `pull_request`, so a push runs CI only on main;
# otherwise every push to a pull request's branch would run every job twice.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Hygiene, lint, build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Hygiene
        run: pnpm hygiene

      - name: Comment ban
        run: pnpm check:comments

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # A push to main runs the full lane: every test, in Chromium, Firefox and
  # WebKit. Everything else runs the quick lane (`@quick`, Chromium). Four shards
  # split the fixtures by weight; fixtures that share a directory stay in one
  # shard, so each fixture installs and builds once.
  e2e:
    name: End-to-end, shard ${{ matrix.shard }}/4
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      AFTERPACK_E2E_SHARD: ${{ matrix.shard }}/4
      LANE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'full' || 'quick' }}
      AFTERPACK_E2E_BROWSERS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'chromium,firefox,webkit' || 'chromium' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build every package
        run: pnpm -r build

      - uses: ./.github/actions/e2e-fixtures
        with:
          browsers: ${{ env.LANE == 'full' && 'chromium firefox webkit' || 'chromium' }}

      - name: Run the ${{ env.LANE }} lane
        run: |
          if [ "$LANE" = "full" ]; then
            pnpm e2e
          else
            pnpm e2e:quick
          fi

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            .afterpack/e2e/playwright-report/**
            .afterpack/e2e/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  # Path handling differs on Windows and macOS: build and smoke a Vite, a
  # webpack, a CLI and a Next fixture there on every run (free on a public
  # repository). The Windows leg may fail without failing the run until it
  # has passed on main; make it a required check only after that.
  e2e-os:
    name: End-to-end on ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      AFTERPACK_E2E_FIXTURES: vite-react,webpack-react,cli-vanilla-esm,next-app-webpack
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build every package
        run: pnpm -r build

      - uses: ./.github/actions/e2e-fixtures
        with:
          browsers: chromium

      - name: Run the quick lane
        run: pnpm e2e:quick

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            .afterpack/e2e/playwright-report/**
            .afterpack/e2e/test-results/**
          if-no-files-found: ignore
          retention-days: 7
