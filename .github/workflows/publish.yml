name: Publish

on:
  push:
    tags: ["v*"]
  repository_dispatch:
    types: [core-published]

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm test

  publish:
    name: Publish to NPM
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: "https://registry.npmjs.org"

      - name: Remove local dev overrides
        run: |
          rm -f .pnpmfile.cjs
          rm -f pnpm-workspace.yaml

      # Auto-update @afterpack/core (minor/patch only)
      - name: Update @afterpack/core
        if: github.event_name == 'repository_dispatch'
        run: |
          NEW_VERSION="${{ github.event.client_payload.version }}"
          NEW_VERSION="${NEW_VERSION#v}"

          # Get current version
          CURRENT=$(npm pkg get dependencies.@afterpack/core | tr -d '"^~')

          # Extract major versions
          NEW_MAJOR=$(echo $NEW_VERSION | cut -d. -f1)
          CURRENT_MAJOR=$(echo $CURRENT | cut -d. -f1)

          if [ "$NEW_MAJOR" != "$CURRENT_MAJOR" ]; then
            echo "⚠️ Major version change ($CURRENT → $NEW_VERSION). Skipping auto-update."
            exit 1
          fi

          echo "Updating @afterpack/core from $CURRENT to $NEW_VERSION"
          pnpm add @afterpack/core@$NEW_VERSION

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      # For repository_dispatch: bump version, commit, tag - the tag will trigger publish
      - name: Bump version and tag (auto-update only)
        if: github.event_name == 'repository_dispatch'
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: update @afterpack/core to ${{ github.event.client_payload.version }}, release v$VERSION"
          git tag "v$VERSION"
          git push && git push --tags

      # For tag push: publish to npm
      - name: Publish
        if: github.event_name == 'push'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
