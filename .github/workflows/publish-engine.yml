name: Publish engine

# Publishes a stable engine release (@afterpack/core, its platform packages
# and @afterpack/wasm) to npmjs under `latest` with trusted publishing. The
# engine's source is not in this repository, so these packages carry no
# provenance. The release arrives as a repository_dispatch naming each
# tarball's integrity; a manual run retries a version and checks it against
# the integrity the source registry reports instead.
#
# Nothing publishes without the operator's approval: before any download, the
# job checks, with this repository's own token, that approve_run_id (in the
# dispatch payload, or the manual run's input) is a successful main-branch
# Approve run titled for an RC of this exact version, approved in
# `ship-approval` by that environment's required reviewer.
#
# Idempotent and patient: a version npmjs already serves with the same
# files is skipped (different files fail before anything publishes), a
# publish npmjs refuses because it already holds that version (E403 "cannot
# publish over", E409) counts as published, and nothing moves on until
# npmjs serves every tarball, for up to 45 minutes. It then hands the engine
# and the approval on to the CLI and plugins (core-published). The trusted
# publishers are bound to this file name and to the `npm` environment:
# rename neither.
on:
  repository_dispatch:
    types: [engine-release]
  workflow_dispatch:
    inputs:
      version:
        description: "The stable engine version to publish, e.g. 0.1.1"
        required: true
        type: string
      approve_run_id:
        description: "The Approve run in which the operator approved shipping an RC of this version"
        required: true
        type: string

run-name: "Publish engine ${{ github.event.client_payload.version || inputs.version }} (latest)"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish the engine packages
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Trusted publishing needs npm 11.5.1 or newer; npm 12 reshaped `npm pack --json`.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Require the operator's approval of this version
        env:
          EVENT: ${{ github.event_name }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_APPROVE_RUN_ID: ${{ inputs.approve_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/npm-release.mjs verify-approval

      - name: Download and verify the tarballs
        env:
          EVENT: ${{ github.event_name }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          INPUT_VERSION: ${{ inputs.version }}
          ENGINE_REGISTRY: ${{ secrets.ENGINE_REGISTRY }}
          ENGINE_REGISTRY_TOKEN: ${{ secrets.ENGINE_REGISTRY_TOKEN }}
        run: |
          npm --version
          node --version
          node scripts/npm-release.mjs fetch-engine --out "$RUNNER_TEMP/engine"

      - name: Publish to npmjs
        run: node scripts/npm-release.mjs publish --dir "$RUNNER_TEMP/engine" --tag latest

      - name: Wait until npmjs serves every tarball
        run: node scripts/npm-release.mjs wait --dir "$RUNNER_TEMP/engine" --tag latest

      - name: Hand the engine and its approval to the CLI and plugins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=core-published \
            -f "client_payload[version]=v${VERSION}" \
            -f "client_payload[approve_run_id]=${APPROVE_RUN_ID}"
