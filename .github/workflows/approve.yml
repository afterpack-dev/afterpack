name: Approve

# The single human approval for a production ship. The release tooling
# dispatches this workflow and waits for it to succeed; the job waits for a
# required reviewer on the `ship-approval` environment and records what was
# approved. It publishes, deploys and changes nothing: the release tooling
# goes on to production only after it succeeded, and publish-engine.yml
# refuses to publish an engine unless the run it names is this workflow's,
# on main, approved by that reviewer for an RC of the same version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The release candidate to ship, e.g. 0.2.2-rc.202610011200"
        required: true
        type: string
      summary:
        description: "What ships, in up to ten lines"
        required: true
        type: string

run-name: "Approve shipping ${{ inputs.version }}"

permissions: {}

jobs:
  approve:
    name: Approve the ship
    runs-on: ubuntu-latest
    environment: ship-approval
    timeout-minutes: 5
    steps:
      - name: Record the approval
        env:
          VERSION: ${{ inputs.version }}
          SUMMARY: ${{ inputs.summary }}
          REQUESTED_BY: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not an engine release candidate (X.Y.Z-rc.<digits>)"
            exit 1
          fi
          {
            echo "Approved shipping \`$VERSION\` (requested by $REQUESTED_BY)."
            echo ""
            echo "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"
