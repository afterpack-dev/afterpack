* { box-sizing: border-box; }
html, body { height: 100%; }
html { overflow-x: hidden; }
body {
  margin: 0;
  overflow-x: hidden;
  background: var(--ground);
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; font-family: var(--font-mono); font-weight: 600; }
button { font: inherit; color: inherit; }
p { margin: 0 0 0.6em; }
p:last-child { margin-bottom: 0; }
ul { margin: 0; padding: 0; list-style: none; }
a { color: var(--brand); }
a:hover { color: var(--brand-hover); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
  border-radius: 3px;
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.mono { font-family: var(--font-mono); }

.app-shell {
  --rail-left-w: 262px;
  --rail-right-w: 340px;
  display: grid;
  grid-template-columns: var(--rail-left-w) minmax(0, 1fr) var(--rail-right-w);
  grid-template-rows: auto 1fr;
  grid-template-areas:
    "top    top    top"
    "left   center right";
  height: 100vh;
  width: 100%;
}
.app-shell.rail-collapsed {
  grid-template-columns: minmax(0, 1fr) var(--rail-right-w);
  grid-template-areas:
    "top    top"
    "center right";
}
.app-shell.rail-collapsed .rail-left { display: none; }
.app-shell.inspector-collapsed {
  grid-template-columns: var(--rail-left-w) minmax(0, 1fr);
  grid-template-areas:
    "top    top"
    "left   center";
}
.app-shell.inspector-collapsed .rail-right { display: none; }
.app-shell.rail-collapsed.inspector-collapsed {
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas:
    "top"
    "center";
}

.pane-resizer {
  position: relative;
  z-index: 6;
  width: 9px;
  align-self: stretch;
  cursor: col-resize;
  touch-action: none;
  background: transparent;
  border: none;
  padding: 0;
}
.pane-resizer#resize-left { grid-area: left; justify-self: end; margin-right: -4px; }
.pane-resizer#resize-right { grid-area: right; justify-self: start; margin-left: -4px; }
.pane-resizer::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 3px;
  width: 3px;
  border-radius: 2px;
  background: transparent;
  transition: background-color 0.15s ease;
}
.pane-resizer:hover::before,
.pane-resizer.is-dragging::before { background: var(--resizer-hover); }
.pane-resizer:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: -1px;
  border-radius: 4px;
}
.pane-resizer:focus-visible::before { background: var(--brand); }
.app-shell.rail-collapsed .pane-resizer#resize-left,
.app-shell.inspector-collapsed .pane-resizer#resize-right { display: none; }
body.is-resizing { cursor: col-resize; user-select: none; -webkit-user-select: none; }
body.is-resizing .pane-resizer::before { transition: none; }
@media (prefers-reduced-motion: reduce) { .pane-resizer::before { transition: none; } }

@media (max-width: 980px) {
  .pane-resizer { display: none; }
  .app-shell,
  .app-shell.rail-collapsed,
  .app-shell.inspector-collapsed,
  .app-shell.rail-collapsed.inspector-collapsed {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto auto;
    grid-template-areas:
      "top"
      "left"
      "center"
      "right";
    height: auto;
    min-height: 100vh;
  }
  .rail-left, .rail-right { max-height: 46vh; }
  .pane-center { min-height: 60vh; max-height: 60vh; }
}
@media (max-width: 480px) {
  .topbar { padding: 8px 10px; }
  .rail-left, .rail-right { padding: 10px 8px 18px; }

}

.topbar {
  grid-area: top;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  row-gap: 8px;
  padding: 10px 16px;
  background: var(--surface-1);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  min-width: 0;
}
.topbar h1 {
  font-size: 14px;
  letter-spacing: 0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.03em;
  color: var(--text-secondary);
  background: var(--surface-3);
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  padding: 2px 7px;
  white-space: nowrap;
  flex-shrink: 0;
  cursor: help;
  transition: color 0.3s ease, border-color 0.3s ease;
}
.tag:hover, .tag:focus-visible { color: var(--brand); border-color: var(--brand); }
.tag svg { display: block; }

.cx-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: var(--cx-protected-solid); }
.cx-dot[data-band="readable"], .cx-dot[data-band="none"] { background: var(--cx-readable-solid); }
.cx-dot[data-band="names"] { background: var(--cx-names-solid); }
.cx-dot[data-band="low"] { background: var(--cx-low-solid); }
.cx-dot[data-band="mid"] { background: var(--cx-mid-solid); }
.cx-dot[data-band="high"] { background: var(--cx-high-solid); }
.cx-dot[data-band="max"] { background: var(--cx-max-solid); }
.topbar .spacer { flex: 1 1 auto; min-width: 8px; }

.brand-logo {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
  margin-left: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--logo-plate);
  box-shadow: inset 0 0 0 1px var(--border);
  text-decoration: none;
  color: inherit;
  transition: box-shadow 0.3s ease, background-color 0.3s ease;
}
.brand-logo:hover, .brand-logo:focus-visible { box-shadow: inset 0 0 0 1px var(--brand); }
.brand-logo svg { height: 22px; width: auto; display: block; }

.segmented {
  display: inline-flex;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  overflow: hidden;
  flex-shrink: 0;
}
.segmented button {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border: none;
  background: var(--surface-2);
  color: var(--text-secondary);
  padding: 7px 12px;
  cursor: pointer;
  transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
}
.segmented button + button { border-left: 1px solid var(--border-strong); }
.segmented-tight { display: flex; width: 100%; max-width: 100%; }
.segmented-tight button {
  padding: 6px 4px;
  font-size: 10px;
  letter-spacing: 0.01em;
  flex: 1 1 auto;
  min-width: 0;
  white-space: nowrap;
}
.segmented button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); box-shadow: 0 0 20px rgba(234, 174, 61, 0.4); }
.segmented button:hover:not([aria-pressed="true"]) { background: var(--surface-hover); }

.theme-toggle {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 700;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--surface-2);
  color: var(--text-secondary);
  padding: 7px 10px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background-color 0.3s ease, border-color 0.3s ease;
}
.theme-toggle:hover { background: var(--surface-hover); }

.top-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 700;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--surface-2);
  color: var(--text-secondary);
  padding: 7px 10px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
}
.top-btn:hover { background: var(--surface-hover); }
.top-btn[aria-expanded="true"], .top-btn[aria-pressed="true"] { color: var(--brand); border-color: var(--brand); }
.top-btn .top-btn-glyph { font-size: 13px; line-height: 1; }
.top-btn-icon { padding: 6px 8px; }
.top-btn-icon svg { display: block; }

.top-btn-pair { display: inline-flex; flex-shrink: 0; }
.top-btn-pair .top-btn { border-radius: 0; }
.top-btn-pair .top-btn:first-child { border-top-left-radius: var(--radius); border-bottom-left-radius: var(--radius); }
.top-btn-pair .top-btn:last-child { border-top-right-radius: var(--radius); border-bottom-right-radius: var(--radius); }
.top-btn-pair .top-btn + .top-btn { border-left-width: 0; }
.top-btn-pair .top-btn[aria-pressed="true"] + .top-btn { border-left: 1px solid var(--border-strong); }

.tree-search {
  width: 100%;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-primary);
  background: var(--surface-1);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 6px 9px;
  margin: 6px 0;
}
.tree-search::placeholder { color: var(--text-muted); }
.tree-empty { font-size: 11.5px; color: var(--text-muted); font-style: italic; padding: 6px 2px; }
.tree-note {
  font-size: 10.5px;
  line-height: 1.45;
  color: var(--text-muted);
  background: var(--surface-3);
  border-radius: 6px;
  padding: 5px 7px;
  margin: 0 0 6px;
}

.rail-left, .rail-right { overflow-y: auto; min-width: 0; }
.rail-left {
  grid-area: left;
  background: var(--surface-2);
  border-right: 1px solid var(--border);
  padding: 14px 12px 24px;
}
.rail-right {
  grid-area: right;
  background: var(--surface-2);
  border-left: 1px solid var(--border);
  padding: 0;
  display: flex;
  flex-direction: column;
  overflow-y: hidden;
}
.rail-right-pin {
  flex: 0 0 auto;
  max-height: 58%;
  overflow-y: auto;
  padding: 14px 12px 10px;
  border-bottom: 1px solid var(--border);
}
.rail-right-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 12px 12px 24px;
}
.rail-right-pin .rail-section { margin-bottom: 0; }
@media (max-width: 980px) {
  .rail-right { display: block; overflow-y: auto; padding: 0; }
  .rail-right-pin { max-height: none; overflow-y: visible; padding: 12px 10px; }
  .rail-right-scroll { overflow-y: visible; padding: 12px 10px 18px; }
}
.rail-section { margin-bottom: 18px; }
.rail-section:last-child { margin-bottom: 0; }
.rail-section > .eyebrow { display: block; margin-bottom: 8px; }
.rail-right-pin .rail-section + .rail-section { margin-top: 14px; }

.tree-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.tree-head > .eyebrow { flex: 1 1 auto; min-width: 0; }
.workspace-line {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-muted);
  flex: 0 0 auto;
}
.workspace-line:empty { display: none; }

.tree {
  display: flex;
  flex-direction: column;
  margin: 0 -8px;
  --tree-row-h: 28px;
  --tree-pin-off: -14px;
}
.tree-node, .tree-branch { display: flex; flex-direction: column; }
.tree-row {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  height: var(--tree-row-h);
  flex: 0 0 auto;
  background: transparent;
  border: none;
  text-align: left;
  cursor: pointer;
  padding-right: 8px;
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-primary);
  transition: background-color 0.3s ease, box-shadow 0.3s ease;
}
.tree-row-folder { position: sticky; background: var(--surface-2); }
.tree-row:hover { background: var(--surface-hover); }
.tree-row-file.is-active { background: var(--surface-1); box-shadow: 0 0 0 1px var(--brand) inset; font-weight: 700; }
.tree-row.is-ignored { color: var(--text-muted); opacity: 0.62; }
.tree-row.is-ignored:hover, .tree-row.is-ignored.is-active, .tree-row.is-ignored:focus-visible { opacity: 1; }
.tree-file-meter.is-ignored { opacity: 0.45; }
.tree-twisty {
  flex: 0 0 auto;
  width: 1em;
  display: inline-block;
  text-align: center;
  color: var(--text-muted);
  transition: transform 0.12s ease;
}
.tree-row-folder[aria-expanded="false"] .tree-twisty { transform: rotate(-90deg); }
.tree-icon { flex: 0 0 auto; }
.tree-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-count { flex: 0 0 auto; font-size: 10px; color: var(--text-muted); }
.tree-mark {
  flex: 0 0 auto;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  color: var(--brand);
  border: 1px solid var(--brand);
  border-radius: 4px;
  padding: 0 4px;
  line-height: 1.5;
}
.tree-row-folder .tree-mark { opacity: 0.75; }
.tree-file-meter { padding-bottom: 6px; padding-right: 10px; }
.badge-weak {
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--brand-ink);
  background: var(--status-property);
  border-radius: 999px;
  padding: 1px 6px;
  line-height: 1.4;
}
.badge-weak.has-leak { background: var(--status-leak); }
.tree-row-folder .badge-weak { opacity: 0.78; }

.meter { position: relative; height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 3px 0 0 3px; background: var(--cx-protected-solid); }
.meter > i[data-band="readable"], .meter > i[data-band="none"] { background: var(--cx-readable-solid); }
.meter > i[data-band="names"] { background: var(--cx-names-solid); }
.meter > i[data-band="low"] { background: var(--cx-low-solid); }
.meter > i[data-band="mid"] { background: var(--cx-mid-solid); }
.meter > i[data-band="high"] { background: var(--cx-high-solid); }
.meter > i[data-band="max"] { background: var(--cx-max-solid); }
.meter-lg { height: 7px; border-radius: 4px; overflow: visible; }
.meter-lg > i { border-radius: 4px; }
.meter-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--text-primary); }

.class-rows { display: flex; flex-direction: column; gap: 4px; }
.class-row { display: flex; align-items: center; gap: 8px; font-size: 11px; }
.class-row-count { margin-left: auto; font-family: var(--font-mono); font-weight: 700; color: var(--text-secondary); }

.class-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  color: var(--text-secondary);
  background: var(--surface-2);
  flex-shrink: 0;
  white-space: nowrap;
}
.class-chip.is-ghost { opacity: 0.75; background: transparent; border-style: dashed; }

.cx-legend { display: flex; flex-direction: column; gap: 3px; }
.cx-legend-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-secondary); }
.cx-swatch { flex: 0 0 auto; width: 34px; text-align: center; font-family: var(--font-mono); font-size: 10.5px; border-radius: 3px; color: var(--text-primary); padding: 0 2px; }
.cx-legend-note { font-size: 11px; line-height: 1.45; color: var(--text-secondary); margin-top: 8px; }
.cx-legend-note + .cx-legend-note { margin-top: 4px; }

.doc-link { font-family: var(--font-ui); font-size: 10.5px; font-weight: 600; text-decoration: none; white-space: nowrap; letter-spacing: 0; text-transform: none; }
.doc-link:hover { text-decoration: underline; }
.popover-section > .popover-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.popover-section > .popover-head > .eyebrow { flex: 1 1 auto; }

.engine-info {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-muted);
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 3px 8px;
}
.engine-info dt { text-align: left; }
.engine-info dt[data-tip] { cursor: help; text-decoration: underline dotted var(--border-strong); text-underline-offset: 3px; }
.engine-info dd { margin: 0; text-align: right; color: var(--text-secondary); overflow-wrap: anywhere; }

.pane-center { grid-area: center; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--ground); }

.file-summary {
  flex: 0 0 auto;
  position: sticky;
  top: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 0;
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.file-head-row { display: flex; align-items: center; gap: 8px; padding: 9px 14px; min-width: 0; }
.file-head-spacer { flex: 1 1 auto; min-width: 10px; }
.file-summary-path { display: flex; align-items: baseline; gap: 1px; min-width: 0; font-family: var(--font-mono); font-size: 12.5px; }
.file-summary-path .fs-dir {
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  direction: rtl;
  unicode-bidi: plaintext;
  min-width: 0;
}
.file-summary-path .fs-name { color: var(--text-primary); font-weight: 700; flex-shrink: 0; }
#head-note { flex: 0 0 auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); white-space: nowrap; cursor: help; }
#head-note[hidden], #syntax-label[hidden] { display: none; }
.icon-btn {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 20px;
  padding: 0 5px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  border: 1px solid var(--border-strong);
  border-radius: 5px;
  background: var(--surface-2);
  color: var(--text-secondary);
  cursor: pointer;
  transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
}
.icon-btn:hover { background: var(--surface-hover); color: var(--brand); border-color: var(--brand); }
.toggle-inline { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); cursor: pointer; white-space: nowrap; flex: 0 0 auto; }
.toggle-inline input[type="checkbox"] { accent-color: var(--brand); width: 13px; height: 13px; margin: 0; }

.code-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px 0 40px; }
.code-line { display: flex; min-width: max-content; white-space: pre; }
.ln {
  position: sticky;
  left: 0;
  flex: 0 0 auto;
  box-sizing: content-box;
  padding: 0 12px 0 14px;
  text-align: right;
  color: var(--text-muted);
  background: var(--ground);
  border-right: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 12.5px;
  user-select: none;
}
.lc { flex: 1 1 auto; font-family: var(--font-mono); font-size: 12.5px; padding-left: 14px; padding-right: 40px; }
.tok { cursor: default; border-radius: 2px; transition: filter 0.1s ease, box-shadow 0.1s ease; }
.tok.tok-hot, .tok.tok-unlit { cursor: pointer; }
.tok.tok-hot:hover,
.tok.tok-hot:focus-visible,
.tok.tok-unlit:hover,
.tok.tok-unlit:focus-visible {
  background-image: linear-gradient(var(--tok-hover-bg), var(--tok-hover-bg));
  box-shadow: 0 0 0 1px var(--tok-hover-ring);
  filter: brightness(1.06);
}
.tok.tok-peer {
  background-image: linear-gradient(var(--tok-hover-bg), var(--tok-hover-bg));
  filter: brightness(1.06);
}
.tok.is-selected { outline: 2px solid var(--brand); outline-offset: 1px; }
.tok.tok-named { text-decoration: underline dotted; text-decoration-color: var(--text-secondary); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.tok.spot-leak { text-decoration: underline; text-decoration-color: var(--status-leak); text-decoration-thickness: 2px; text-underline-offset: 2px; }
.tok.spot-propertyName { text-decoration: underline; text-decoration-color: var(--status-property); text-decoration-thickness: 2px; text-underline-offset: 2px; }
.tok.spot-weak { text-decoration: underline dashed; text-decoration-color: var(--status-weak); text-decoration-thickness: 2px; text-underline-offset: 2px; }
.tok.tok-preserved {
  background-color: var(--cx-readable);
  color: var(--text-secondary);
}
.tok.cx-none { background-color: var(--cx-readable); }
.tok.cx-names { background-color: var(--cx-names); }
.tok.cx-low { background-color: var(--cx-low); }
.tok.cx-mid { background-color: var(--cx-mid); }
.tok.cx-high { background-color: var(--cx-high); }
.tok.cx-max { background-color: var(--cx-max); }
.tok.cx-protected { background-color: var(--cx-protected); }
.lc .tok.cx-max i { color: inherit; }
.cx-swatch.tok-unlit { background: var(--wash); }
.pin {
  display: inline-block;
  width: 11px;
  height: 11px;
  margin-right: 2px;
  vertical-align: -1px;
  flex: 0 0 auto;
}
.lc .tok.spot-leak > .pin { color: var(--status-leak); }
.lc .tok.spot-propertyName > .pin { color: var(--status-property); }
.lc .tok.spot-weak > .pin { color: var(--status-weak); }
.pin svg { display: block; width: 100%; height: 100%; }

.lc i { font-style: normal; }
.lc i.sy-c, .lc .tok.sy-c { color: var(--syn-comment); font-style: italic; }
.lc .tok-hot i.sy-c { color: inherit; }
.lc i.sy-k, .lc .tok.sy-k { color: var(--syn-key); }
.lc i.sy-s, .lc .tok.sy-s { color: var(--syn-str); }
.lc i.sy-n, .lc .tok.sy-n { color: var(--syn-num); }

.dir-kw {
  background-image: linear-gradient(100deg,
    var(--brand) 0%, var(--brand-hover) 30%, var(--brand-hover) 50%,
    var(--brand-hover) 70%, var(--brand) 100%);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: dir-sweep 9s linear infinite;
  font-weight: 700;
}
.dir-arg { color: var(--brand); font-weight: 600; }
@keyframes dir-sweep { from { background-position: 0% 0; } to { background-position: 300% 0; } }

.code-line.has-directive .ln { color: var(--brand); }
.code-line.has-directive .ln::after {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 1.15em;
  border-radius: 0 2px 2px 0;
  background: linear-gradient(180deg, var(--brand-hover), var(--brand));
}

@media (prefers-reduced-motion: reduce) {
  .dir-kw { animation: none; background-position: 50% 0; }
}

.unlit { background: transparent; }
.lc .tok.tok-unlit { background: var(--wash); }
.lc .tok.tok-unlit.sy-c { background: transparent; }
.lc i.sy-c { background: var(--ground); }

.directive-legend-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 11px; }
.directive-legend-row .swatch { flex: 0 0 auto; font-family: var(--font-mono); font-size: 10px; }
.directive-legend-row code { font-family: var(--font-mono); color: var(--text-secondary); }

.tooltip {
  position: fixed;
  z-index: 60;
  max-width: 300px;
  font-family: var(--font-ui);
  font-size: 11.5px;
  line-height: 1.45;
  color: var(--text-primary);
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 8px 10px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s ease;
}
.tooltip[data-show] { opacity: 1; }
.tooltip.has-link[data-show] { pointer-events: auto; }
.tip-link { display: inline-block; margin-top: 5px; font-weight: 600; text-decoration: none; }
.tip-link:hover { text-decoration: underline; }
.info-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  cursor: help;
  flex-shrink: 0;
  vertical-align: middle;
}
.info-dot:hover, .info-dot:focus-visible { color: var(--brand); border-color: var(--brand); }

.popover {
  position: fixed;
  top: 54px;
  right: 14px;
  z-index: 50;
  width: 320px;
  max-width: calc(100vw - 28px);
  max-height: calc(100vh - 70px);
  overflow-y: auto;
  background: var(--surface-1);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 14px 14px 16px;
}
.popover[hidden] { display: none; }
.popover-section { margin-bottom: 16px; }
.popover-section:last-child { margin-bottom: 0; }
.popover-section > .eyebrow { display: block; margin-bottom: 8px; }


.weakspot { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-1); margin-bottom: 6px; overflow: hidden; transition: border-color 0.3s ease; }
.weakspot:last-child { margin-bottom: 0; }
.weakspot[open] { border-color: var(--border-strong); }
.weakspot-summary { display: flex; align-items: center; gap: 7px; padding: 6px 9px; cursor: pointer; list-style: none; }
.weakspot-summary::-webkit-details-marker { display: none; }
.weakspot-summary:hover { background: var(--surface-hover); }
.weakspot-sev { flex: 0 0 auto; padding: 1px 5px; font-size: 10px; }
.weakspot-sample { flex: 1 1 auto; min-width: 0; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-primary); overflow-wrap: anywhere; white-space: pre-wrap; }
.weakspot-body { padding: 8px 10px 10px; border-top: 1px dashed var(--border); }
.weakspot-reason { font-size: 11px; color: var(--text-secondary); margin: 0 0 6px; }
.empty-note-ok { font-size: 11.5px; color: var(--text-muted); font-style: normal; margin: 0; }
.empty-note-ok .ok-check { color: var(--brand); font-weight: 700; margin-right: 4px; }

.rail-section-headrow { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.rail-collapsible.is-collapsed > .rail-section-headrow { margin-bottom: 0; }
.rail-section-head {
  display: flex; align-items: baseline; gap: 8px;
  flex: 1 1 auto; min-width: 0;
  background: none; border: 0; padding: 0; margin: 0;
  font: inherit; color: inherit; text-align: left; cursor: pointer;
}
.rail-section-head::before {
  content: "\25B8";
  flex: 0 0 auto;
  color: var(--text-muted);
  font-size: 10px;
  line-height: 1;
  transition: transform 0.12s ease;
}
.rail-section-head[aria-expanded="true"]::before { transform: rotate(90deg); }
.rail-section-head > .eyebrow { flex: 0 0 auto; margin-bottom: 0; }
.rail-section-count {
  flex: 1 1 auto;
  min-width: 0;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rail-section-count:empty { display: none; }
.rail-collapsible.is-collapsed > :not(.rail-section-headrow) { display: none; }

.weakspots-section.is-empty { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.weakspots-section.is-empty > .rail-section-headrow { margin-bottom: 0; }
.weakspots-section.is-empty #weakspots-list { margin-top: 0 !important; flex: 1 1 auto; min-width: 0; }
.weakspots-section.is-empty.is-collapsed > #weakspots-list { display: block; }
.rail-right.weakspots-hidden #weakspots-section,
.rail-right.weakspots-hidden .rail-right-scroll { display: none; }
.rail-right.weakspots-quiet .rail-right-pin { max-height: none; flex: 1 1 auto; min-height: 0; }
.rail-right.weakspots-quiet .rail-right-scroll { flex: 0 0 auto; overflow-y: visible; padding-bottom: 12px; }
.rail-right.inspector-section-collapsed .rail-right-pin { flex: 0 0 auto; max-height: none; }
@media (max-width: 980px) {
  .rail-right.weakspots-quiet .rail-right-pin { flex: 0 0 auto; }
}


.mini-btn { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; border: 1px solid var(--border-strong); color: var(--text-secondary); background: var(--surface-2); border-radius: 5px; padding: 4px 8px; cursor: pointer; transition: background-color 0.3s ease, border-color 0.3s ease; }
.mini-btn:hover { background: var(--surface-hover); }

details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.details-summary { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.details-summary::before { content: "\25B8"; color: var(--text-muted); font-size: 10px; display: inline-block; transition: transform 0.12s ease; }
details[open] > .details-summary::before { transform: rotate(90deg); }
.chain-extra { margin-top: 2px; }
.chain-extra > summary { font-size: 10.5px; color: var(--brand); font-style: italic; padding: 3px 0 3px 22px; }
.chain-extra > summary::before { content: "\FF0B "; font-style: normal; }
.chain-extra[open] > summary::before { content: "\FF0D "; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border-radius: 999px;
  padding: 2px 7px;
  flex-shrink: 0;
}
.pill-leak { background: var(--status-leak-soft); color: var(--status-leak); }
.pill-propertyName { background: var(--status-property-soft); color: var(--status-property); }
.pill-weak { background: var(--status-weak-soft); color: var(--status-weak); }

.inspector-empty { font-size: 12px; color: var(--text-muted); }

.insp { display: flex; flex-direction: column; gap: 8px; }
.insp-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 10px 11px; }
.insp-ident { display: flex; align-items: center; gap: 6px; min-height: 24px; min-width: 0; }
.insp-ident .class-chip { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.insp-flags { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.insp-flag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border: 1px solid;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  line-height: 1;
  cursor: help;
}
.insp-flag[data-kind="leak"] { color: var(--status-leak); border-color: var(--status-leak); background: var(--status-leak-soft); }
.insp-flag[data-kind="dir"] { color: var(--brand); border-color: var(--brand); }
.insp-score { margin-left: auto; flex: 0 0 auto; display: inline-flex; align-items: baseline; gap: 5px; font-family: var(--font-mono); cursor: help; }
.insp-score b { font-size: 20px; line-height: 1; font-weight: 700; color: var(--text-primary); }
.insp-score small { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }
.insp-meter { margin: 9px 0 4px; }
.insp-line { font-size: 11.5px; line-height: 1.45; color: var(--text-secondary); margin-top: 8px; }
.insp-facts { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
.insp-fact { display: flex; align-items: center; gap: 10px; min-height: 19px; }
.insp-fact > .k { flex: 0 0 auto; font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; }
.insp-fact[data-tip] > .k { border-bottom: 1px dotted var(--border-strong); cursor: help; }
.insp-fact > .v { flex: 1 1 auto; min-width: 0; text-align: right; font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.insp-fact > .v.is-dim { color: var(--text-muted); font-weight: 400; }
.insp-fact .class-chip { font-size: 9.5px; padding: 1px 6px; vertical-align: middle; }
.insp-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font-size: 11px; }
.insp-chain { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 7px 11px; }
.insp-chain[open] > .details-summary { margin-bottom: 8px; }
.insp-note { font-size: 11px; line-height: 1.45; color: var(--text-secondary); margin: 0; }

.file-band { display: flex; flex-direction: column; gap: 2px; }
.fb-row { display: flex; align-items: center; gap: 10px; height: 19px; }
.fb-row > .k { flex: 0 0 auto; font-size: 11.5px; color: var(--text-secondary); border-bottom: 1px dotted var(--border-strong); cursor: help; }
.fb-row > .v { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; text-align: right; font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fb-row > .v.is-dim { color: var(--text-muted); font-weight: 400; }
.fb-row > .v.is-warn { color: var(--status-leak); }
.file-band-section { margin-bottom: 12px; }
.file-band-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.file-band-head > .eyebrow { flex: 1 1 auto; }

.chain { display: flex; flex-direction: column; }
.chain-step { display: flex; gap: 10px; }
.chain-rail { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; width: 12px; }
.chain-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; background: var(--brand); box-shadow: 0 0 0 3px var(--surface-1); flex: 0 0 auto; }
.chain-line { flex: 1 1 auto; width: 2px; background: var(--border-strong); min-height: 8px; }
.chain-step:last-of-type .chain-line { display: none; }
.chain-body { flex: 1 1 auto; min-width: 0; padding-bottom: 10px; }
.chain-step:last-of-type .chain-body { padding-bottom: 0; }
.chain-head { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.chain-transform { flex: 0 1 auto; min-width: 0; font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--text-primary); overflow-wrap: break-word; }
.chain-count { flex: 0 0 auto; color: var(--brand); font-weight: 700; font-family: var(--font-mono); font-size: 11px; cursor: help; }
.chain-delta { flex: 0 0 auto; margin-left: auto; padding-left: 6px; color: var(--text-muted); font-family: var(--font-mono); font-size: 10px; white-space: nowrap; }
.chain-caption { font-size: 11px; line-height: 1.4; color: var(--text-muted); margin-top: 2px; }
.chain-caption [data-tip] { cursor: help; }
.chain-credit { color: var(--text-secondary); font-weight: 600; white-space: nowrap; }
.chain-more { margin-top: 6px; font-size: 10.5px; color: var(--text-muted); font-style: italic; padding-left: 22px; }
.chip {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  background: var(--surface-3);
  color: var(--text-secondary);
  border-radius: 4px;
  padding: 1px 5px;
  flex: 0 0 auto;
}


@media (max-width: 980px) { .app-shell { overflow: visible; } }

::selection { background: rgba(234, 174, 61, 0.3); color: #0a0a0a; }

.rail-left, .rail-right, .code-body { scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 9999px; }
::-webkit-scrollbar-thumb:hover { background: var(--brand); }
</style>
</head>

function afterpackDecodeDocument(c) {
  const dict = c.dict || {};
  const cols = c.columns || {};
  const regionCols = cols.region || [];
  const spotCols = cols.spotlight || [];
  const lineageCols = cols.lineage || [];
  const legend = c.legend || {};

  const decodeTable = (table, colNames) => {
    const n = table?.n || 0;
    const src = table?.cols || {};
    const rows = new Array(n);
    for (let i = 0; i < n; i++) rows[i] = {};
    for (const col of colNames) {
      const arr = src[col];
      const d = dict[col];
      for (let i = 0; i < n; i++) {
        const v = arr ? arr[i] : undefined;
        rows[i][col] = d ? d[v] : v;
      }
    }
    return { rows, src };
  };

  const files = (c.files || []).map((fc) => {
    const rdec = decodeTable(fc.regions, regionCols);
    const regions = rdec.rows;
    const rsrc = rdec.src;
    for (let i = 0; i < regions.length; i++) {
      const region = regions[i];
      const decodeOps = region.decodeOps;
      region.perf = { costClass: region.costClass, decodeOps, callFrames: region.callFrames };
      delete region.costClass;
      delete region.decodeOps;
      delete region.callFrames;
      region.lineage = rsrc.lineage
        ? (rsrc.lineage[i] || []).map((t) => {
            const step = {};
            for (let k = 0; k < lineageCols.length; k++) {
              const lc = lineageCols[k];
              step[lc] = dict[lc] ? dict[lc][t[k]] : t[k];
            }
            return step;
          })
        : [];
      if (rsrc.lineageCapped && rsrc.lineageCapped[i] != null) {
        region.lineageCapped = rsrc.lineageCapped[i];
      }
      const lg = legend[region.reversalClass] || {};
      region.why = lg.why == null ? undefined : lg.why;
      region.tier = lg.tier == null ? null : lg.tier;
      region.ceiling = lg.ceiling == null ? null : lg.ceiling;
      region.annotations = decodeOps > 0 ? ["materializationSite"] : [];
      region.outputSpan = null;
    }
    const sdec = decodeTable(fc.spotlights, spotCols);
    return {
      file: fc.file,
      regions,
      spotlights: sdec.rows,
      aggregate: fc.aggregate,
      renamedSpans: fc.renamedSpans || [],
      extractedSpans: fc.extractedSpans || [],
      complexitySpans: fc.complexitySpans || [],
    };
  });

  return {
    schemaVersion: c.schemaVersion,
    ...(c.spanUnits !== undefined ? { spanUnits: c.spanUnits } : {}),
    generatedAt: c.generatedAt !== undefined ? c.generatedAt : null,
    engine: c.engine !== undefined ? c.engine : null,
    ...(c.totals !== undefined ? { totals: c.totals } : {}),
    files,
  };
}

async function afterpackInflateBase64Gzip(b64) {
  var binary = atob(b64);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  var buf = await new Response(stream).arrayBuffer();
  return new TextDecoder().decode(buf);
}

      var cls = "tok" + (paint.cls ? " " + paint.cls : "") + (nameMark ? " tok-named" : "") + (attributed ? " tok-hot" : " tok-unlit unlit") + (spotlight ? " spot-" + spotlight.raw.severity : "");

      } else if (run.cx != null && paint.band !== "names") {

  var treeEl = document.getElementById("file-tree");

  function countMarkedUnder(node) {

    });

  }

  function countWeakUnder(node) {

    node.children.forEach(function (c) {
      if (c.type === "file") {
        var f = FILES[c.fileIdx];
        acc.weak += f.weakSpotCount; acc.leaks += f.leakCount;

    var present = {};
