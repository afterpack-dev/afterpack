      (f.directives || []).forEach(function (d) { present[d.kind] = true; });
    });
    var kinds = DIRECTIVE_LEGEND_ORDER.filter(function (k) { return present[k]; });
    var section = document.getElementById("directive-legend-section");
    if (!kinds.length) { section.hidden = true; return; }
    section.hidden = false;
    document.getElementById("directive-legend").innerHTML = kinds.map(function (k) {
      return '<div class="directive-legend-row"><span class="swatch dir-kw" data-directive="' + k +
        '">@afterpack</span>' +
        "<code>" + escapeHtml(DIRECTIVE_LEGEND_META[k]) + "</code></div>";
    }).join("");
  }

  function legendRowHtml(cls, label) {
    return '<div class="cx-legend-row"><span class="cx-swatch tok ' + cls + '">abc</span>' + escapeHtml(label) + "</div>";
  }
  function renderLegend() {
    var rows = [];
    if (BUILD_CX.hasLane) {
      CX_BANDS.forEach(function (b) { rows.push(legendRowHtml("cx-" + b.band, "Complexity " + b.label)); });
      rows.push(legendRowHtml("cx-none", "No complexity added"));
      rows.push(legendRowHtml("cx-none tok-named", "Name hidden, nothing more"));
      rows.push(legendRowHtml("tok-preserved", "Left readable on purpose"));
    } else {
      rows.push(legendRowHtml("tok-preserved", "Left readable on purpose"));
      rows.push(legendRowHtml("cx-names", "Names hidden only"));
      rows.push(legendRowHtml("cx-protected", "Protected"));
    }
    rows.push(legendRowHtml("tok-unlit", "Nothing recorded"));
    document.getElementById("cx-legend").innerHTML = rows.join("");
    var t = buildTarget();
    var note = BUILD_CX.hasLane
      ? "Hotter means more complex, so harder to reverse. Red is strong, not a problem." +
        (BUILD_CX.avg != null ? " This build: average " + fmtCx(BUILD_CX.avg) + (t != null ? ", target " + fmtCx(t) : "") + "." : "")
      : "This map doesn't record complexity per token, so all protected code shares one color." +
        (t != null ? " This build targeted " + fmtCx(t) + "." : "");
    var noteEl = document.getElementById("cx-legend-note");
    noteEl.innerHTML = escapeHtml(note) + " " + docLinkHtml(BUILD_CX.hasLane ? "complexityWhat" : "complexity", "Learn more");
  }

  function renderEngineInfo(file) {
    var e = engineOf(file);
    var rows = [
      { k: "Preset", v: e.preset, tip: "The protection level this build used.", doc: "ladder" },
      { k: "Complexity target", v: typeof e.complexity === "number" ? fmtCx(e.complexity) : null, tip: INSP_COPY.target, doc: "cfgComplexity" }
    ];
    if (BUILD_CX.hasLane) {
      rows.push({ k: "Average complexity", v: BUILD_CX.avg != null ? fmtCx(BUILD_CX.avg) : null,
        tip: "Average complexity of your code across this build.", doc: "complexity" });
    }
    rows.push({ k: "Seed", v: e.seed, tip: "A new seed each build makes the output different every time.", doc: "cfgSeed" });
    rows.push({ k: "Engine version", v: e.version });
    document.getElementById("engine-info").innerHTML = rows.map(function (r) {
      return "<dt" + (r.tip ? tipAttrs(r.tip, r.doc) + ' tabindex="0"' : "") + ">" + escapeHtml(r.k) + "</dt><dd>" +
        escapeHtml(r.v == null || r.v === "" ? "—" : String(r.v)) + "</dd>";
    }).join("");
  }

  function setWeakSpotsEmpty(empty) {
    var section = document.getElementById("weakspots-section");
    if (section) section.classList.toggle("is-empty", empty);
    syncRailFill();
  }

  function syncRailFill() {
    var rail = document.getElementById("rail-right");
    if (!rail) return;
    var ws = document.getElementById("weakspots-section");
    var insp = document.getElementById("inspector-section");
    var wsQuiet = !ws || rail.classList.contains("weakspots-hidden") ||
      ws.classList.contains("is-empty") || ws.classList.contains("is-collapsed");
    rail.classList.toggle("weakspots-quiet", wsQuiet);
    rail.classList.toggle("inspector-section-collapsed", !!(insp && insp.classList.contains("is-collapsed")));
  }

  function renderWeakSpots(file) {
    var titleEl = document.getElementById("weakspots-title");
    var infoEl = document.getElementById("weakspots-info");
    var list = document.getElementById("weakspots-list");
    if (!titleEl || !list) return;
    if (!file.spotlights.length) {
      titleEl.textContent = "Weak spots (0)";
      if (infoEl) infoEl.style.display = "none";
      list.style.marginTop = "0";
      var elsewhere = 0;
      FILES.forEach(function (f) { if (f.fileIdx !== file.fileIdx) elsewhere += f.weakSpotCount; });
      list.innerHTML = '<p class="empty-note-ok"><span class="ok-check">✓</span>None in this file.' +
        (elsewhere > 0 ? " " + escapeHtml(plural(elsewhere, "weak spot", "weak spots")) + " in other files: use the <strong>Weak</strong> filter." : "") +
        "</p>";
      setWeakSpotsEmpty(true);
      return;
    }
    setWeakSpotsEmpty(false);
    titleEl.textContent = "Weak spots (" + file.spotlights.length + ")";
    if (infoEl) infoEl.style.display = "";
    list.style.marginTop = "8px";
    list.innerHTML = file.spotlights.map(function (s) {
      var sev = s.raw.severity;
      var icon = SEVERITY_ICON[sev] || "⚠";
      var why = mechanismText(s.raw.mechanism);
      var help = SEVERITY_HELP[sev];
      var actions = (s.positioned ? '<button type="button" class="mini-btn" data-jump-spotlight="' + s.idx + '">Show in code</button>' : "") +
        (help ? docLinkHtml(help.doc, help.label) : "");
      return '<details class="weakspot" data-spot-idx="' + s.idx + '">' +
        '<summary class="weakspot-summary">' +
          '<span class="weakspot-sev pill pill-' + escapeAttr(sev || "") + '" title="' + escapeAttr(SEVERITY_LABEL[sev] || "Readable text") + '">' + icon + "</span>" +
          '<span class="weakspot-sample">' + escapeHtml(s.raw.sample || "") + "</span>" +
        "</summary>" +
        '<div class="weakspot-body">' +
          '<p class="weakspot-reason">' + escapeHtml(SEVERITY_BODY[sev] || SEVERITY_BODY.weak) + "</p>" +
          (why ? '<p class="weakspot-reason">' + escapeHtml(why) + "</p>" : "") +
          (s.positioned ? "" : '<p class="weakspot-reason">' + escapeHtml(INSP_COPY.noPosition) + "</p>") +
          (actions ? '<div class="insp-actions">' + actions + "</div>" : "") +
        "</div>" +
      "</details>";
    }).join("");
  }

  function groupLineage(lineage) {
    var groups = [], byName = Object.create(null);
    lineage.forEach(function (step) {
      var key = step.transform || "?";
      var g = byName[key];
      if (g) {
        g.count++;
        g.sizeDeltaEst += step.sizeDeltaEst || 0;
        if (g.credit == null && step.credit != null) g.credit = step.credit;
      } else {
        g = byName[key] = { transform: key, category: step.category, phase: step.phase, count: 1, sizeDeltaEst: step.sizeDeltaEst || 0, credit: step.credit };
        groups.push(g);
      }
    });
    return groups;
  }

  function creditPct(permille) {
    if (typeof permille !== "number" || isNaN(permille) || permille <= 0) return null;
    var p = permille / 10;
    return (p >= 10 ? Math.round(p) : Math.round(p * 10) / 10) + "%";
  }
  function breakCamel(name) { return escapeHtml(name).replace(/([a-z0-9])([A-Z])/g, "$1<wbr>$2"); }

  var CHAIN_VISIBLE_CAP = 6;
  function chainStepHtml(g) {
    var cat = categoryMeta(g);
    var credit = creditPct(g.credit);
    var caption = [];
    if (cat) caption.push("<span" + (cat.tip ? tipAttrs(cat.tip, cat.doc) : "") + ">" + escapeHtml(cat.label) + "</span>");
    if (credit) caption.push('<span class="chain-credit"' + tipAttrs(INSP_COPY.credit, "attackers") + ">resists deobfuscators " + credit + "</span>");
    return '<div class="chain-step">' +
      '<div class="chain-rail"><span class="chain-dot"></span><span class="chain-line"></span></div>' +
      '<div class="chain-body">' +
        '<div class="chain-head">' +
          '<span class="chain-transform">' + breakCamel(g.transform) + "</span>" +
          (g.count > 1 ? '<span class="chain-count"' + tipAttrs("Applied " + g.count + " times.") + ">×" + g.count + "</span>" : "") +
          (g.sizeDeltaEst ? '<span class="chain-delta">' + escapeHtml((g.sizeDeltaEst > 0 ? "+" : "") + fmtNum(g.sizeDeltaEst) + " B") + "</span>" : "") +
        "</div>" +
        (caption.length ? '<div class="chain-caption">' + caption.join(" · ") + "</div>" : "") +
      "</div>" +
    "</div>";
  }
  function renderChainBody(region) {
    var lineage = region.raw.lineage || [];
    if (!lineage.length) {
      return '<p class="insp-note">' + escapeHtml(INSP_COPY.detailsOff) + " " + docLinkHtml("cfgDetailed", "Learn more") + "</p>";
    }
    var groups = groupLineage(lineage);
    var visible = groups.slice(0, CHAIN_VISIBLE_CAP).map(chainStepHtml).join("");
    var extra = groups.slice(CHAIN_VISIBLE_CAP);
    var extraHtml = extra.length
      ? '<details class="chain-extra"><summary>' + extra.length + " more</summary>" + extra.map(chainStepHtml).join("") + "</details>"
      : "";
    var note = region.raw.lineageCapped
      ? '<div class="chain-more">' + escapeHtml(region.raw.lineageCapped + " steps in total; this map keeps the first " + lineage.length + ".") + "</div>"
      : "";
    return '<div class="chain">' + visible + "</div>" + extraHtml + note;
  }
  function transformsLabel(region) {
    var lineage = region.raw.lineage || [];
    if (lineage.length) return String(groupLineage(lineage).length) + (region.raw.lineageCapped ? "+" : "");
    return (region.raw.transformCount || 0) > 0 ? "details off" : null;
  }
  function inspChain(region) {
    if (!region) return "";
    var label = transformsLabel(region);
    if (label == null) return "";
    var tip = INSP_COPY.transforms + (SCORES_ARE_RATES ? " " + INSP_COPY.transformsRates : "");
    return '<details class="insp-chain"><summary class="details-summary"' + tipAttrs(tip, "cfgTransforms") +
      '>Transforms <span class="chip">' + escapeHtml(label) + "</span></summary>" + renderChainBody(region) + "</details>";
  }

  function inspFlag(kind, glyph, tip, doc) {
    return '<span class="insp-flag" data-kind="' + kind + '" tabindex="0" role="note"' + tipAttrs(tip, doc) + ">" + escapeHtml(glyph) + "</span>";
  }
  function inspFact(f) {
    var val = f.html != null ? f.html : escapeHtml(f.v == null || f.v === "" ? "—" : String(f.v));
    return '<div class="insp-fact"' + (f.tip ? tipAttrs(f.tip, f.doc) : "") + ">" +
      '<span class="k">' + escapeHtml(f.k) + "</span>" +
      '<span class="v' + (f.dim ? " is-dim" : "") + '"' + (f.full ? ' title="' + escapeAttr(f.full) + '"' : "") + ">" + val + "</span></div>";
  }
  function complexityMeterHtml(cx, target) {
    var top = Math.max(12, (target || 0) * 2, cx * 1.1);
    var w = Math.max(2, Math.min(100, (cx / top) * 100));
    var tick = target != null && target > 0 ? '<span class="meter-tick" style="left:' + ((target / top) * 100).toFixed(1) + '%"></span>' : "";
    return '<div class="meter meter-lg insp-meter"><i data-band="' + complexityBand(cx) + '" style="width:' + w.toFixed(1) + '%"></i>' + tick + "</div>";
  }
  function inspCard(o) {
    var hasCx = typeof o.cx === "number" && !isNaN(o.cx);
    var facts = (o.facts || []).filter(Boolean);
    var lines = (o.lines || []).filter(Boolean);
    return '<div class="insp-card">' +
      '<div class="insp-ident">' + (o.chip || "") +
        '<span class="insp-flags">' + (o.flags || []).join("") + "</span>" +
        (hasCx ? '<span class="insp-score" tabindex="0"' + tipAttrs(o.cxTip || INSP_COPY.complexity, "complexity") + "><b>" +
          escapeHtml(fmtCx(o.cx)) + "</b><small>complexity</small></span>" : "") +
      "</div>" +
      (hasCx ? complexityMeterHtml(o.cx, buildTarget()) : "") +
      lines.map(function (l) { return '<p class="insp-line">' + l + "</p>"; }).join("") +
      (facts.length ? '<div class="insp-facts">' + facts.map(inspFact).join("") + "</div>" : "") +
      (o.actions ? '<div class="insp-actions">' + o.actions + "</div>" : "") +
      "</div>";
  }
  function directiveTip(d) {
    return "Marked with @afterpack " + d.keyword + (typeof d.target === "number" ? " (complexity " + fmtCx(d.target) + ")" : "") +
      ". The map shows where the directive sits, not what it changed.";
  }
  function complexityTip(region) {
    var d = region && region.directive;
    return INSP_COPY.complexity + " " + targetSentence() +
      (d && typeof d.target === "number" ? " A directive here asks for " + fmtCx(d.target) + "." : "");
  }
  function missingComplexityFact() {
    if (BUILD_CX.hasLane) {
      return { k: "Complexity", v: "not recorded", dim: true, tip: "No complexity was recorded for this part of the code.", doc: "complexity" };
    }
    var t = buildTarget();
    return t != null ? { k: "Complexity target", v: fmtCx(t), tip: INSP_COPY.target + " " + INSP_COPY.noComplexity, doc: "complexity" } : null;
  }

  function tokenAt(file, pos) {
    var syn = lexFile(file);
    if (!syn) return { start: pos, end: Math.min(pos + 1, file.sourceLen), type: "?", text: file.source.charAt(pos) };
    var ti = tokenIndexAt(syn, pos);
    var start = syn.starts[ti], end = tokenEnd(syn, ti, file.sourceLen);
    return { start: start, end: end, type: syn.types.charAt(ti), text: file.source.slice(start, end) };
  }
  function neighbourRegions(file, pos) {
    var before = null, after = null;
    file.realRegions.forEach(function (r) {
      if (r.endChar <= pos) { if (!before || r.endChar > before.endChar) before = r; }
      else if (r.startChar >= pos) { if (!after || r.startChar < after.startChar) after = r; }
    });
    return { before: before, after: after };
  }
  function pct(part, total) { return total > 0 ? Math.round((part / total) * 100) + "%" : "—"; }

  var UNLIT_VERDICT = {
    w: "Whitespace. Nothing to protect.",
    p: "Punctuation or an operator. The language needs it as written.",
    k: "A keyword such as if or return. The language needs it as written.",
    v: "A value like true or null. Your output may still rewrite it; this map just has no record of it.",
    y: "A property name. AfterPack doesn't rename these, because code can look them up by their text.",
    i: "A name with no rename recorded. Usually one that must keep its name, like a global or an export, or one your bundler removed.",
    s: "A string with nothing recorded. Your bundler may have removed it (for example a TypeScript type) before AfterPack ran.",
    n: "A number with nothing recorded. Your bundler may have folded it away.",
    c: "A comment. Comments don't ship, so there's nothing to protect.",
    "?": "The viewer can't read this file type, so it can't say what this is."
  };
  var UNLIT_DOC = { y: "preserve" };

  function cardRegion(file, region, sel) {
    var r = region.raw;
    var perf = r.perf || {};
    var cx = sel && typeof sel.cx === "number" ? sel.cx : null;
    var flags = [];
    var leakInside = file.spotlights.some(function (sp) {
      return sp.raw.severity === "leak" && sp.startChar >= region.startChar && sp.endChar <= region.endChar;
    });
    if (leakInside) flags.push(inspFlag("leak", "!", INSP_COPY.leakInside, "secret"));
    if (region.directive) flags.push(inspFlag("dir", "@", directiveTip(region.directive), "directivesCheck"));
    return inspCard({
      chip: classChipHtml(r.reversalClass, false),
      flags: flags,
      cx: cx,
      cxTip: complexityTip(region),
      facts: [
        cx == null ? missingComplexityFact() : null,
        SCORES_ARE_RATES && typeof r.score === "number" && r.score > 0
          ? { k: "Resists deobfuscators", v: scorePct(r.score), tip: INSP_COPY.resists, doc: "attackers" } : null,
        typeof r.sizeDeltaEst === "number" && r.sizeDeltaEst !== 0
          ? { k: "Added size", v: (r.sizeDeltaEst > 0 ? "+" : "") + fmtNum(r.sizeDeltaEst) + " B", tip: INSP_COPY.addedSize, doc: "sizeBudget" } : null,
        perf.decodeOps > 0 ? { k: "Runtime decoders", v: perf.decodeOps, tip: INSP_COPY.decoders, doc: "perf" } : null
      ]
    }) + inspChain(region);
  }

  function cardPreserved(file, region) {
    var r = region.raw;
    var lowered = (r.lineage || []).length > 0 || (r.transformCount || 0) > 0;
    var why = r.preservedReason
      ? preservedReasonText(r.preservedReason) || "Your code needs its text to work."
      : lowered ? INSP_COPY.preservedLowered : INSP_COPY.preservedNone;
    var flags = region.directive ? [inspFlag("dir", "@", directiveTip(region.directive), "directivesCheck")] : [];
    return inspCard({
      chip: classChipHtml("preserved", false),
      flags: flags,
      lines: [escapeHtml(why) + (r.preservedReason ? " " + docLinkHtml("preserve", "Why") : "")]
    }) + inspChain(region);
  }

  function cardRenamed(file, idx, sel) {
    var cx = sel && typeof sel.cx === "number" ? sel.cx : null;
    return inspCard({
      chip: classChipHtml("renamed-encoded", false, "Renamed"),
      cx: cx,
      lines: [escapeHtml(INSP_COPY.renamedLine) + " " + docLinkHtml("cfgRename", "Renaming")],
      facts: [
        !(cx > 0) ? { k: "Strength", v: "light", tip: INSP_COPY.renamedStrength, doc: "cfgRename" } : null,
        { k: "Renamed in this file", v: pct(file.coverage.renamed, file.coverage.total), tip: INSP_COPY.renamedShare, doc: "cfgRename" }
      ]
    });
  }

  function cardExtracted(file, idx, sel) {
    var r = file.extractedRanges[idx];
    var cx = sel && typeof sel.cx === "number" ? sel.cx : null;
    return inspCard({
      chip: classChipHtml("renamed-encoded", false, "Hidden name"),
      cx: cx,
      lines: [escapeHtml(INSP_COPY.extractedLine)],
      facts: [
        { k: "Kind", v: r && r.kind === "global" ? "global name" : "property name" },
        !(cx > 0) ? { k: "Strength", v: "light", tip: INSP_COPY.extractedStrength } : null,
        { k: "Hidden in this file", v: pct(file.coverage.hidden, file.coverage.total), tip: INSP_COPY.extractedShare }
      ]
    });
  }

  function cardComplexityOnly(file, sel) {
    return inspCard({
      chip: classChipHtml("", false, sel.cx > 0 ? "Protected" : "No complexity added"),
      cx: sel.cx,
      cxTip: complexityTip(null)
    });
  }

  function cardUnlit(file, u) {
    var tok = tokenAt(file, u.pos);
    if (tok.type === "?" && u.end != null) tok = { start: u.pos, end: u.end, type: "?", text: file.source.slice(u.pos, u.end) };
    var type = tok.type === "?" && u.type && u.type !== "?" ? u.type : tok.type;
    if (type === "k" && VALUE_LITERAL_TEXT[tok.text] === 1) type = "v";
    var verdict = UNLIT_VERDICT[type] || UNLIT_VERDICT["?"];
    var before = neighbourRegions(file, tok.start).before;
    var gapText = before ? file.source.slice(before.endChar, tok.start) : null;
    var abuts = !!before && gapText.length <= 2 && !/\S/.test(gapText);

    var flags = [];
    var di = -1;
    file.directives.forEach(function (d, i) {
      if (d.startChar <= tok.start && d.endChar >= tok.end &&
        (di < 0 || (d.endChar - d.startChar) < (file.directives[di].endChar - file.directives[di].startChar))) di = i;
    });
    if (di >= 0) flags.push(inspFlag("dir", "@", directiveTip(file.directives[di]), "directivesCheck"));

    return inspCard({
      chip: classChipHtml("", true, "Nothing recorded"),
      flags: flags,
      lines: [
        escapeHtml(verdict) + (UNLIT_DOC[type] ? " " + docLinkHtml(UNLIT_DOC[type], "Why") : ""),
        abuts ? escapeHtml(INSP_COPY.gapAbuts) : null
      ],
      facts: [{ k: "What it is", v: TOKEN_KIND[type] || "text", tip: INSP_COPY.unlitKind }],
      actions: abuts ? '<button type="button" class="mini-btn" data-select-region="' + before.idx + '">Show that region</button>' : ""
    });
  }

  function cardSpotlight(file, spotlight, region) {
    var s = spotlight.raw;
    var sev = s.severity;
    var flags = [];
    if (region && region.directive) flags.push(inspFlag("dir", "@", directiveTip(region.directive), "directivesCheck"));
    var why = mechanismText(s.mechanism);
    var whyDoc = mechanismKey(s.mechanism) === "pinnedLiteral" ? " " + docLinkHtml("cfgPreserveLiterals", "strings.preserveLiterals") : "";
    var help = SEVERITY_HELP[sev];
    return inspCard({
      chip: classChipHtml("", false, (SEVERITY_ICON[sev] ? SEVERITY_ICON[sev] + " " : "") + (SEVERITY_LABEL[sev] || "Readable text")),
      flags: flags,
      lines: [escapeHtml(SEVERITY_BODY[sev] || SEVERITY_BODY.weak), why ? escapeHtml(why) + whyDoc : null],
      facts: [
        { k: "Text", v: s.sample, full: s.sample, tip: INSP_COPY.sample },
        typeof s.bytes === "number" ? { k: "Length", v: plural(s.bytes, "byte", "bytes") } : null,
        region && !isPreservedRegion(region)
          ? { k: "Code around it", html: classChipHtml(region.raw.reversalClass, false, null, true), tip: INSP_COPY.around, doc: "classes" } : null
      ],
      actions: help ? docLinkHtml(help.doc, help.label) : ""
    }) + inspChain(region);
  }

  function inspectorSummary(file, sel) {
    if (!sel) return "no selection";
    if (sel.spotlightIdx != null) {
      var sp = file.spotlights[sel.spotlightIdx];
      var sample = sp && sp.raw.sample ? String(sp.raw.sample) : "";
      if (sample.length > 24) sample = sample.slice(0, 23) + "…";
      return sample ? "weak spot · " + sample : "weak spot";
    }
    if (sel.unlit) return "nothing recorded";
    var cxText = typeof sel.cx === "number" ? "complexity " + fmtCx(sel.cx) : "";
    if (sel.regionIdx != null) {
      var region = regionByIdx(file, sel.regionIdx);
      var cls = region ? region.raw.reversalClass : null;
      var label = (CLASS_META[cls] && CLASS_META[cls].label) || cls || "protected code";
      return cxText ? label + " · " + cxText : label;
    }
    if (sel.extractedIdx != null) return "hidden name";
    if (sel.renamedIdx != null) return "renamed";
    return cxText || "";
  }

  function renderInspector() {
    var el = document.getElementById("inspector");
    var countEl = document.getElementById("inspector-count");
    var file = activeFile();
    var sel = state.selection;
    if (countEl) countEl.textContent = file ? inspectorSummary(file, sel) : "";
    if (!file) { el.innerHTML = ""; return; }
    if (!sel) {
      el.innerHTML = '<p class="inspector-empty">Click any part of the code to see how it was protected.</p>';
      return;
    }
    var region = sel.regionIdx != null ? regionByIdx(file, sel.regionIdx) : null;
    var spotlight = sel.spotlightIdx != null ? file.spotlights[sel.spotlightIdx] : null;
    var html = spotlight ? cardSpotlight(file, spotlight, region)
      : region && isPreservedRegion(region) && !(typeof sel.cx === "number" && sel.cx > 0) ? cardPreserved(file, region)
      : region ? cardRegion(file, region, sel)
      : sel.unlit ? cardUnlit(file, sel.unlit)
      : sel.extractedIdx != null ? cardExtracted(file, sel.extractedIdx, sel)
      : sel.renamedIdx != null ? cardRenamed(file, sel.renamedIdx, sel)
      : typeof sel.cx === "number" ? cardComplexityOnly(file, sel)
      : "";
    el.innerHTML = '<div class="insp">' + html + "</div>";
  }

  function highlightSelectionRing() {
    codeBody.querySelectorAll(".tok.is-selected").forEach(function (t) { t.classList.remove("is-selected"); });
    var sel = state.selection;
    if (!sel) return;
    if (sel.regionIdx != null) {
      codeBody.querySelectorAll('.tok[data-region-idx="' + sel.regionIdx + '"]').forEach(function (t) { t.classList.add("is-selected"); });
    } else if (sel.spotlightIdx != null) {
      codeBody.querySelectorAll('.tok[data-spotlight-idx="' + sel.spotlightIdx + '"]').forEach(function (t) { t.classList.add("is-selected"); });
    } else if (sel.extractedIdx != null) {
      codeBody.querySelectorAll('.tok[data-extracted-idx="' + sel.extractedIdx + '"]').forEach(function (t) { t.classList.add("is-selected"); });
    } else if (sel.renamedIdx != null) {
      codeBody.querySelectorAll('.tok[data-renamed-idx="' + sel.renamedIdx + '"]').forEach(function (t) { t.classList.add("is-selected"); });
    } else if (sel.unlit) {
      codeBody.querySelectorAll('.tok[data-unlit="' + sel.unlit.pos + '"]').forEach(function (t) { t.classList.add("is-selected"); });
    }
  }

  var syntaxToggle = document.getElementById("syntax-toggle");
  var syntaxToggleText = document.getElementById("syntax-toggle-text");
  function updateSyntaxToggle(file) {
    if (!syntaxToggle) return;
    var g = file && file.grammar;
    var label = document.getElementById("syntax-label");
    if (label) label.hidden = !g;
    syntaxToggle.disabled = !g;
    syntaxToggle.checked = !!g && state.syntaxOn;
    if (syntaxToggleText) syntaxToggleText.textContent = g ? "Syntax · " + g.label : "Syntax";
  }

  function selectFromRun(regionIdx, spotlightIdx, renamedIdx, extractedIdx, cx) {
    state.selection = {
      regionIdx: regionIdx == null || isNaN(regionIdx) ? null : regionIdx,
      spotlightIdx: spotlightIdx == null || isNaN(spotlightIdx) ? null : spotlightIdx,
      renamedIdx: renamedIdx == null || isNaN(renamedIdx) ? null : renamedIdx,
      extractedIdx: extractedIdx == null || isNaN(extractedIdx) ? null : extractedIdx,
      cx: typeof cx === "number" && !isNaN(cx) ? cx : null,
      unlit: null
    };
    revealInspectorSection();
    highlightSelectionRing();
    renderInspector();
  }
  function selectUnlit(pos, type, end) {
    state.selection = { regionIdx: null, spotlightIdx: null, renamedIdx: null, extractedIdx: null, cx: null, unlit: { pos: pos, type: type, end: end } };
    revealInspectorSection();
    highlightSelectionRing();
    renderInspector();
  }
  function clearSelection() {
    if (!state.selection) return;
    state.selection = null;
    highlightSelectionRing();
    renderInspector();
  }
  function isAttributedTok(el) { return !!el && el.classList.contains("tok-hot"); }
  function isPickableTok(el) { return !!el && (el.classList.contains("tok-hot") || el.classList.contains("tok-unlit")); }
  function handleTokActivate(tokEl) {
    if (!isAttributedTok(tokEl)) {
      selectUnlit(Number(tokEl.dataset.unlit || 0), tokEl.dataset.ut || "?", tokEl.dataset.ue ? Number(tokEl.dataset.ue) : null);
      return;
    }
    var r = tokEl.dataset.regionIdx === "" ? null : Number(tokEl.dataset.regionIdx);
    var s = tokEl.dataset.spotlightIdx === "" ? null : Number(tokEl.dataset.spotlightIdx);
    var rn = tokEl.dataset.renamedIdx == null || tokEl.dataset.renamedIdx === "" ? null : Number(tokEl.dataset.renamedIdx);
    var ex = tokEl.dataset.extractedIdx == null || tokEl.dataset.extractedIdx === "" ? null : Number(tokEl.dataset.extractedIdx);
    var cx = tokEl.dataset.cx == null || tokEl.dataset.cx === "" ? null : Number(tokEl.dataset.cx);
    selectFromRun(r, s, rn, ex, cx);
  }
  function jumpToSpotlight(idx) {
    var file = activeFile();
    var target = codeBody.querySelector('.tok[data-spotlight-idx="' + idx + '"]');
    var run = file ? file.mergedRuns.filter(function (r) { return r.spotlightIdx === idx; })[0] : null;
    if (target) {
      target.scrollIntoView({ block: "center", inline: "center", behavior: "smooth" });
      target.focus({ preventScroll: true });
    }
    selectFromRun(run ? run.regionIdx : null, idx, null, null, run ? run.cx : null);
  }

  function copyText(text, btn) {
    function ok() {
      var prev = btn.textContent;
      btn.textContent = btn.getAttribute("data-copied-label") || "Copied";
      setTimeout(function () { btn.textContent = prev; }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, function () { fallbackCopy(text); ok(); });
    } else {
      fallbackCopy(text);
      ok();
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  function updateSourceOriginNote(file) {
    var noteEl = document.getElementById("head-note");
    if (!noteEl) return;
    var machinery = sourceOriginOf(file) === "machinery";
    noteEl.hidden = !machinery;
    noteEl.textContent = machinery ? "AfterPack runtime (not your code)" : "";
    if (machinery) {
      noteEl.setAttribute("data-tip", "Not one of your files. It holds protection that can't be tied to one line of your source, such as shared decoders.");
    } else {
      noteEl.removeAttribute("data-tip");
    }
  }

  function onActiveFileChanged() {
    var file = activeFile();
    if (!file) return;
    updateSourceOriginNote(file);
    updateSyntaxToggle(file);
    revealActiveFile();
    renderTree();
    scrollTreeToActive();
    syncHash();
    renderFileSummary(file);
    renderClassDist(file);
    renderEngineInfo(file);
    paintCode(file);
    renderWeakSpots(file);
    highlightSelectionRing();
    renderInspector();
  }

  var appShell = document.getElementById("app");
  var railToggleBtn = document.getElementById("rail-toggle");
  function setRailCollapsed(collapsed, remember) {
    state.railCollapsed = collapsed;
    if (remember) setPref("railCollapsed", collapsed);
    appShell.classList.toggle("rail-collapsed", collapsed);
    railToggleBtn.setAttribute("aria-pressed", String(collapsed));
    railToggleBtn.setAttribute("title", collapsed ? "Show the file tree" : "Hide the file tree");
  }

  var inspectorToggleBtn = document.getElementById("inspector-toggle");
  function setInspectorCollapsed(collapsed, remember) {
    state.inspectorCollapsed = collapsed;
    if (remember) setPref("inspectorCollapsed", collapsed);
    appShell.classList.toggle("inspector-collapsed", collapsed);
    if (!inspectorToggleBtn) return;
    inspectorToggleBtn.setAttribute("aria-pressed", String(collapsed));
    var label = collapsed ? "Show the inspector panel" : "Hide the inspector panel";
    inspectorToggleBtn.setAttribute("title", label);
    inspectorToggleBtn.setAttribute("aria-label", label);
  }

  function isSectionCollapsed(sectionId) {
    var sec = document.getElementById(sectionId);
    return !!(sec && sec.classList.contains("is-collapsed"));
  }
  function setSectionCollapsed(sectionId, headId, collapsed, remember, prefKey) {
    var sec = document.getElementById(sectionId);
    var head = document.getElementById(headId);
    if (sec) sec.classList.toggle("is-collapsed", collapsed);
    if (head) head.setAttribute("aria-expanded", String(!collapsed));
    if (remember && prefKey) setPref(prefKey, collapsed);
    syncRailFill();
  }
  function toggleInspectorSection() {
    setSectionCollapsed("inspector-section", "inspector-head",
      !isSectionCollapsed("inspector-section"), true, "inspectorSectionCollapsed");
  }
  function toggleWeakSpotsSection() {
    setSectionCollapsed("weakspots-section", "weakspots-head",
      !isSectionCollapsed("weakspots-section"), true, "weakspotsCollapsed");
  }
  function revealInspectorSection() {
    if (isSectionCollapsed("inspector-section")) {
      setSectionCollapsed("inspector-section", "inspector-head", false, false);
    }
  }

  var PREFS_KEY = "afterpack-protmap-prefs";
  var THEME_KEY = "afterpack-protmap-theme";
  var prefs = {};
  function loadPrefs() {
    try {
      var raw = localStorage.getItem(PREFS_KEY);
      prefs = raw ? JSON.parse(raw) : {};
    } catch (e) { prefs = {}; }
    if (!prefs || typeof prefs !== "object") prefs = {};
    if (prefs.theme !== "light" && prefs.theme !== "dark") {
      try {
        var legacy = localStorage.getItem(THEME_KEY);
        if (legacy === "light" || legacy === "dark") prefs.theme = legacy;
      } catch (e) {}
    }
  }
  function setPref(k, v) {
    prefs[k] = v;
    try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {}
  }
  loadPrefs();

  var MIN_RAIL = 180;
  var MIN_CODE = 320;
  var RESIZER_EL = {};
  function resizerEl(which) {
    if (!(which in RESIZER_EL)) RESIZER_EL[which] = document.getElementById(which === "left" ? "resize-left" : "resize-right");
    return RESIZER_EL[which];
  }
  function railWidth(which) {
    var v = parseFloat(getComputedStyle(appShell).getPropertyValue(which === "left" ? "--rail-left-w" : "--rail-right-w"));
    return isNaN(v) ? (which === "left" ? 262 : 340) : v;
  }
  function railMax(which) {
    var otherShown = which === "left" ? !state.inspectorCollapsed : !state.railCollapsed;
    var other = otherShown ? railWidth(which === "left" ? "right" : "left") : 0;
    var shellW = appShell.getBoundingClientRect().width || window.innerWidth;
    return Math.max(MIN_RAIL, Math.min(shellW * 0.42, shellW - other - MIN_CODE));
  }
  function syncRailAria(which, w) {
    var handle = resizerEl(which);
    if (!handle) return;
    handle.setAttribute("aria-valuenow", String(Math.round(w == null ? railWidth(which) : w)));
    handle.setAttribute("aria-valuemax", String(Math.round(railMax(which))));
  }
  function restoreRailWidths() {
    if (typeof prefs.railLeftW === "number") setRailWidth("left", prefs.railLeftW, false);
    else syncRailAria("left", null);
    if (typeof prefs.railRightW === "number") setRailWidth("right", prefs.railRightW, false);
    else syncRailAria("right", null);
  }
  function setRailWidth(which, px, persist) {
    var w = Math.round(Math.max(MIN_RAIL, Math.min(px, railMax(which))));
    appShell.style.setProperty(which === "left" ? "--rail-left-w" : "--rail-right-w", w + "px");
    syncRailAria(which, w);
    if (persist !== false) setPref(which === "left" ? "railLeftW" : "railRightW", w);
    return w;
  }
  function wireResizer(el, which) {
    if (!el) return;
    var dragging = false;
    var dragWidth = null;
    function widthFromPointer(clientX) {
      var r = appShell.getBoundingClientRect();
      return which === "left" ? clientX - r.left : r.right - clientX;
    }
    el.addEventListener("pointerdown", function (e) {
      if (e.button != null && e.button !== 0) return;
      dragging = true;
      el.classList.add("is-dragging");
      document.body.classList.add("is-resizing");
      try { el.setPointerCapture(e.pointerId); } catch (err) {  }
      e.preventDefault();
    });
    el.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      dragWidth = setRailWidth(which, widthFromPointer(e.clientX), false);
      e.preventDefault();
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      el.classList.remove("is-dragging");
      document.body.classList.remove("is-resizing");
      try { if (e && e.pointerId != null) el.releasePointerCapture(e.pointerId); } catch (err) {  }
      if (dragWidth != null) setPref(which === "left" ? "railLeftW" : "railRightW", dragWidth);
      dragWidth = null;
    }
    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", endDrag);
    el.addEventListener("lostpointercapture", endDrag);
    el.addEventListener("keydown", function (e) {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      var step = (e.shiftKey ? 48 : 16) * (e.key === "ArrowLeft" ? -1 : 1) * (which === "left" ? 1 : -1);
      setRailWidth(which, railWidth(which) + step);
      e.preventDefault();
    });
  }

  var popoverEl = document.getElementById("build-popover");
  var legendBtn = document.getElementById("legend-toggle");
  function setPopover(open) {
    popoverEl.hidden = !open;
    legendBtn.setAttribute("aria-expanded", String(open));
  }

  var tooltipEl = document.getElementById("tooltip");
  var tipTarget = null;
  var tipHideTimer = null;
  function positionTip(el) {
    var r = el.getBoundingClientRect();
    var tr = tooltipEl.getBoundingClientRect();
    var top = r.top - tr.height - 8;
    if (top < 8) top = r.bottom + 8;
    var left = r.left + r.width / 2 - tr.width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - tr.width - 8));
    tooltipEl.style.top = top + "px";
    tooltipEl.style.left = left + "px";
  }
  function showTip(el) {
    var tip = el.getAttribute("data-tip");
    if (!tip) return;
    clearTimeout(tipHideTimer);
    tipTarget = el;
    tooltipEl.textContent = tip;
    var href = docUrl(el.getAttribute("data-doc"));
    if (href) {
      var a = document.createElement("a");
      a.className = "tip-link";
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "Learn more ↗";
      tooltipEl.appendChild(document.createElement("br"));
      tooltipEl.appendChild(a);
    }
    tooltipEl.classList.toggle("has-link", !!href);
    tooltipEl.hidden = false;
    positionTip(el);
    tooltipEl.setAttribute("data-show", "");
  }
  function hideTip() {
    clearTimeout(tipHideTimer);
    tipTarget = null;
    tooltipEl.removeAttribute("data-show");
    tooltipEl.classList.remove("has-link");
  }
  function hideTipSoon() {
    clearTimeout(tipHideTimer);
    tipHideTimer = setTimeout(hideTip, tooltipEl.classList.contains("has-link") ? 260 : 0);
  }

  var THEME_LABEL = { light: "☀ Light", dark: "🌙 Dark" };
  var themeBtn = document.getElementById("theme-toggle");
  function systemTheme() {
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function labelTheme(mode) {
    themeBtn.dataset.theme = mode;
    themeBtn.textContent = THEME_LABEL[mode] || THEME_LABEL.dark;
    themeBtn.setAttribute("aria-label", "Color theme: " + mode + ". Activate to switch to " + (mode === "dark" ? "light" : "dark") + ".");
  }
  function applyTheme(mode, quiet, forced) {
    if (mode !== "light" && mode !== "dark") mode = systemTheme();
    document.documentElement.setAttribute("data-theme", mode);
    labelTheme(mode);
    if (forced) return;
    setPref("theme", mode);
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) {}
  }

  function wireEvents() {
    railToggleBtn.addEventListener("click", function () {
      state.railManual = true;
      setRailCollapsed(!state.railCollapsed, true);
    });
    if (inspectorToggleBtn) {
      inspectorToggleBtn.addEventListener("click", function () { setInspectorCollapsed(!state.inspectorCollapsed, true); });
    }
    var inspectorHead = document.getElementById("inspector-head");
    if (inspectorHead) inspectorHead.addEventListener("click", toggleInspectorSection);
    var weakspotsHead = document.getElementById("weakspots-head");
    if (weakspotsHead) weakspotsHead.addEventListener("click", toggleWeakSpotsSection);
    wireResizer(document.getElementById("resize-left"), "left");
    wireResizer(document.getElementById("resize-right"), "right");
    legendBtn.addEventListener("click", function () { setPopover(popoverEl.hidden); });
    document.addEventListener("click", function (e) {
      if (popoverEl.hidden) return;
      if (!popoverEl.contains(e.target) && !legendBtn.contains(e.target)) setPopover(false);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { setPopover(false); hideTip(); }
    });
    var searchEl = document.getElementById("tree-search");
    if (searchEl) searchEl.addEventListener("input", function () { applyTreeSearch(searchEl.value); });

    document.addEventListener("mouseover", function (e) {
      var el = e.target.closest ? e.target.closest("[data-tip]") : null;
      if (el && el !== tipTarget) showTip(el);
    });
    document.addEventListener("mouseout", function (e) {
      var el = e.target.closest ? e.target.closest("[data-tip]") : null;
      if (el && el === tipTarget && !el.contains(e.relatedTarget)) hideTipSoon();
    });
    tooltipEl.addEventListener("mouseenter", function () { clearTimeout(tipHideTimer); });
    tooltipEl.addEventListener("mouseleave", hideTipSoon);
    document.addEventListener("focusin", function (e) {
      var el = e.target.closest ? e.target.closest("[data-tip]") : null;
      var keyboard = true;
      try { keyboard = !e.target.matches || e.target.matches(":focus-visible"); } catch (err) { keyboard = true; }
      if (el && keyboard) showTip(el);
    });
    document.addEventListener("focusout", function (e) {
      if (e.relatedTarget && tooltipEl.contains(e.relatedTarget)) return;
      hideTipSoon();
    });

    themeBtn.addEventListener("click", function () {
      applyTheme((themeBtn.dataset.theme || systemTheme()) === "dark" ? "light" : "dark");
    });
    var darkQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    if (darkQuery) {
      var onSystemThemeChange = function () {
        if (document.documentElement.hasAttribute("data-theme")) return;
        labelTheme(systemTheme());
      };
      if (darkQuery.addEventListener) darkQuery.addEventListener("change", onSystemThemeChange);
      else if (darkQuery.addListener) darkQuery.addListener(onSystemThemeChange);
    }
    codeBody.addEventListener("click", function (e) {
      var t = e.target.closest(".tok");
      if (isPickableTok(t)) handleTokActivate(t);
      else clearSelection();
    });
    codeBody.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var t = e.target.closest(".tok");
      if (!isPickableTok(t)) return;
      e.preventDefault();
      handleTokActivate(t);
    });
    var peerRegion = null;
    function setPeers(idx) {
      if (peerRegion === idx) return;
      codeBody.querySelectorAll(".tok.tok-peer").forEach(function (t) { t.classList.remove("tok-peer"); });
      peerRegion = idx;
      if (idx == null) return;
      codeBody.querySelectorAll('.tok[data-region-idx="' + idx + '"]').forEach(function (t) { t.classList.add("tok-peer"); });
    }
    codeBody.addEventListener("mouseover", function (e) {
      var t = e.target.closest ? e.target.closest(".tok-hot") : null;
      var idx = t && t.dataset.regionIdx !== "" ? t.dataset.regionIdx : null;
      setPeers(idx);
    });
    codeBody.addEventListener("mouseleave", function () { setPeers(null); });
    document.addEventListener("click", function (e) {
      if (!state.selection) return;
      var t = e.target;
      if (!t || !t.closest) return;
      if (t.closest(".tok") || t.closest(".rail-left, .rail-right, .topbar, .popover, .tooltip, .pane-resizer, .file-summary")) return;
      clearSelection();
    });
    var headEl = document.getElementById("file-summary");
    if (headEl) {
      headEl.addEventListener("click", function (e) {
        var btn = e.target.closest ? e.target.closest("[data-copy]") : null;
        if (btn && btn.dataset.copy) copyText(decodeURIComponent(btn.dataset.copy), btn);
      });
    }
    document.getElementById("weakspots-list").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-jump-spotlight]");
      if (btn) jumpToSpotlight(Number(btn.dataset.jumpSpotlight));
    });
    document.getElementById("inspector").addEventListener("click", function (e) {
      var jump = e.target.closest("[data-select-region]");
      if (jump) {
        var idx = Number(jump.dataset.selectRegion);
        selectFromRun(idx, null, null);
        var target = codeBody.querySelector('.tok[data-region-idx="' + idx + '"]');
        if (target) target.scrollIntoView({ block: "center", inline: "nearest", behavior: "smooth" });
      }
    });
    if (syntaxToggle) {
      syntaxToggle.addEventListener("change", function () {
        state.syntaxOn = syntaxToggle.checked;
        setPref("syntaxOn", state.syntaxOn);
        var f = activeFile();
        if (f) { paintCode(f); highlightSelectionRing(); }
      });
    }
    treeEl.addEventListener("click", function (e) {
      var row = e.target.closest(".tree-row");
      if (!row) return;
      if (row.dataset.kind === "folder") {
        var key = row.dataset.key;
        state.expandedFolders[key] = !state.expandedFolders[key];
        renderTree();
      } else {
        var fi = Number(row.dataset.fileIdx);
        if (fi === state.activeFileIdx) return;
        state.activeFileIdx = fi;
        state.selection = null;
        onActiveFileChanged();
      }
    });
    var filterEl = document.getElementById("file-filter");
    if (filterEl) {
      filterEl.addEventListener("click", function (e) {
        var b = e.target.closest("button[data-filter]");
        if (b) setFileFilter(b.dataset.filter);
      });
    }
    if (window.addEventListener) {
      window.addEventListener("hashchange", function () { applyDeepLink(readHashParams()); });
    }
  }

  function applyDeepLink(h) {
    var note = "";
    if (typeof h.rail === "boolean") setRailCollapsed(h.rail);
    if (h.theme) applyTheme(h.theme, false, true);
    if (h.unknownFilter) {
      note = "This link asked for an unknown filter (\u201c" + h.unknownFilter + "\u201d).";
    } else if (h.filter) {
      var before = activeFileFilter;
      activeFileFilter = h.filter;
      var ok = h.filter === "all" || filteredFiles().length > 0;
      activeFileFilter = before;
      if (ok) setFileFilter(h.filter);
      else note = "No file in this build matches the \u201c" + h.filter + "\u201d filter.";
    }
    if (h.file) {
      var idx = findFileIdxByPath(h.file);
      if (idx < 0) {
        note = (note ? note + " " : "") + "\u201c" + h.file + "\u201d is not in this Protection Map.";
      } else if (idx !== state.activeFileIdx) {
        if (!filteredFiles().some(function (f) { return f.fileIdx === idx; })) setFileFilter("all");
        state.activeFileIdx = idx;
        state.selection = null;
        onActiveFileChanged();
      }
    }
    setDeeplinkNote(note);
  }

  function init() {
    if (HASH0.theme) applyTheme(HASH0.theme, true, true);
    else if (prefs.theme === "light" || prefs.theme === "dark") applyTheme(prefs.theme, true);
    else labelTheme(systemTheme());

    if (typeof prefs.syntaxOn === "boolean") state.syntaxOn = prefs.syntaxOn;

    var brandLink = document.getElementById("brand-logo");
    if (brandLink) brandLink.setAttribute("href", ["https", "//www.afterpack.dev"].join(":"));

    document.querySelectorAll("a[data-doc-link]").forEach(function (a) {
      var href = docUrl(a.getAttribute("data-doc-link"));
      if (href) a.setAttribute("href", href);
    });
    renderDirectiveLegend();
    renderWorkspaceSummary();
    renderPrivacyTag();
    renderBuildComplexity();
    var markedBtn = document.getElementById("filter-marked");
    if (markedBtn && !FILES.some(isMarkedFile)) markedBtn.remove();
    var weakBtn = document.getElementById("filter-weak");
    if (weakBtn && !FILES.some(isWeakFile)) weakBtn.remove();
    syncFilterButtons();
    setDeeplinkNote(deeplinkNote);
    wireEvents();

    setRailCollapsed(
      typeof HASH0.rail === "boolean" ? HASH0.rail
        : typeof prefs.railCollapsed === "boolean" ? prefs.railCollapsed
        : FILES.length <= 1
    );
    if (prefs.inspectorCollapsed === true) setInspectorCollapsed(true);

    if (HASH0.weakspots === "hidden") {
      var railRight = document.getElementById("rail-right");
      if (railRight) railRight.classList.add("weakspots-hidden");
    }
    setSectionCollapsed("inspector-section", "inspector-head", prefs.inspectorSectionCollapsed !== false);
    setSectionCollapsed("weakspots-section", "weakspots-head",
      HASH0.weakspots ? HASH0.weakspots !== "open" : prefs.weakspotsCollapsed !== false);
    restoreRailWidths();

    var file = activeFile();
    if (!file) {
      document.getElementById("code-body").textContent = "This Protection Map has no files.";
      return;
    }

    updateSourceOriginNote(file);
    updateSyntaxToggle(file);
    reapplyExpansion();
    renderTree();
    renderFileSummary(file);
    renderClassDist(file);
    renderLegend();
    renderEngineInfo(file);
    paintCode(file);
    renderWeakSpots(file);
    renderInspector();
    scrollTreeToActive();
    syncHash();
  }

  init();
})();
</script>
</body>
</html>
