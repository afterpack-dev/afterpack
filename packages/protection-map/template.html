          '" aria-expanded="' + (expanded ? "true" : "false") + '">' +
          '<span class="tree-twisty" aria-hidden="true">▸</span>' +
          '<span class="tree-icon" aria-hidden="true">' + (expanded ? "📂" : "📁") + "</span>" +
          '<span class="tree-name">' + escapeHtml(child.name) + "</span>" +
          (marked > 0 ? '<span class="tree-mark" data-tip="' + escapeAttr(marked + " file" + (marked === 1 ? "" : "s") +
            " under this folder carry an @afterpack marker recorded over a span in this build.") + '">@' + marked + "</span>" : "") +
          weakBadgeHtml(weakUnder.weak, weakUnder.leaks, "under this folder") +
          '<span class="tree-count">' + countFilesUnder(child) + "</span>" +
          "</button>"
        );
        // Children live in their OWN element: a sticky row only sticks within its
        // containing block, so this is what makes a folder UNPIN once its subtree
        // has scrolled past instead of hanging over the next branch.
        if (expanded) {
          html.push('<div class="tree-branch">');
          renderTreeChildren(child, html);
          html.push("</div>");
        }
        html.push("</div>"); // close .tree-node
      } else {
        var file = FILES[child.fileIdx];
        var active = state.activeFileIdx === child.fileIdx;
        var fileIgnored = isIgnoredFileIdx(child.fileIdx);
        var kws = markedKeywords(file);
        html.push(
          '<button type="button" class="tree-row tree-row-file' + (active ? " is-active" : "") + (fileIgnored ? " is-ignored" : "") + '" data-kind="file" data-file-idx="' + child.fileIdx +
          '" style="padding-left:' + indent + 'px" aria-current="' + (active ? "true" : "false") + '">' +
          '<span class="tree-twisty" aria-hidden="true"></span>' +
          '<span class="tree-icon" aria-hidden="true">📄</span>' +
          '<span class="tree-name" title="' + escapeAttr(file.displayPath || file.displayName) + '">' + escapeHtml(file.displayName) + "</span>" +
          (kws.length ? '<span class="tree-mark" data-tip="' + escapeAttr(file.directives.length + " @afterpack marker" +
            (file.directives.length === 1 ? "" : "s") + " recorded in this file (" + kws.join(", ") +
            "). The build records where markers were found; whether they changed the outcome is not recorded.") + '">@</span>' : "") +
          weakBadgeHtml(file.weakSpotCount, file.leakCount, "in this file") +
          "</button>" +
          // The bar is the average score of the spans that HAVE a region -- it says
          // nothing about how much of the file has one, so the tooltip states both.
          // Without that, a file with one hot region and no other coverage reads as
          // a uniformly well-protected file.
          '<div class="tree-file-meter' + (fileIgnored ? " is-ignored" : "") + '" style="padding-left:' + (indent + 18) + 'px"' +
          ' data-tip="' + escapeAttr("Average protection score " + file.avgScore.toFixed(0) + "/100 across the spans that carry a ledger region — which is " +
            (file.coverage.total > 0 ? Math.round((file.coverage.region / file.coverage.total) * 100) : 0) +
            "% of this file. It is not a share of the file that is protected.") + '">' +
          '<div class="meter"><i style="width:' + file.avgScore.toFixed(0) + '%;background:' + heatSolid(file.avgScore) + '"></i></div>' +
          "</div>"
        );
      }
    });
  }
  function renderTree() {
    var html = [];
    renderTreeChildren(TREE, html);
    treeEl.innerHTML = html.length ? html.join("") : '<p class="tree-empty">No files match.</p>';
  }
  /* Bring the active row into the rail's viewport. `nearest`, so it is a no-op
     when the row is already visible and never yanks a tree the reader is
     scrolling. */
  function scrollTreeToActive() {
    if (!treeEl || !treeEl.querySelector) return;
    var row = treeEl.querySelector('.tree-row-file[data-file-idx="' + state.activeFileIdx + '"]');
    if (row && row.scrollIntoView) row.scrollIntoView({ block: "nearest" });
  }

  /* Blank every per-file panel (code view, summary, engine info, weak spots,
   * inspector, class distribution) when a filter hides EVERY file, so none of
   * them keep painting the previously-active file's stale content. */
  function blankPanels() {
    renderTree();
    document.getElementById("code-body").textContent = "No files match this filter.";
    document.getElementById("file-summary-path").innerHTML = "";
    document.getElementById("file-summary-metrics").innerHTML = "";
    document.getElementById("engine-info").innerHTML = "";
    document.getElementById("weakspots-title").textContent = "Weak spots (0)";
    document.getElementById("weakspots-list").innerHTML = "";
    setWeakSpotsEmpty(true);
    document.getElementById("inspector").innerHTML = "";
    // The collapsed/expanded state is the reader's, not the filter's.
    var inspCount = document.getElementById("inspector-count");
    if (inspCount) inspCount.textContent = "no selection";
    document.getElementById("class-dist-bar").innerHTML = "";
    document.getElementById("class-dist-rows").innerHTML = "";
    document.getElementById("class-reached").innerHTML = "";
    var footnote = document.getElementById("class-dist-footnote");
    if (footnote) footnote.hidden = true;
  }

  /* Reflect the live facet on the segmented control. Shared, because a deep link
     can set the facet before any button was ever clicked. */
  function syncFilterButtons() {
    FILE_FILTERS.forEach(function (k) {
      var b = document.getElementById("filter-" + k);
      if (b) b.setAttribute("aria-pressed", String(k === activeFileFilter));
    });
  }

  /* Rebuild the tree for a new facet: recompute TREE + folder keys, keep folders
   * as the reader left them (only the open file's ancestry is force-opened), keep
   * the active file selected when it is still visible, else fall back to the
   * first visible file (or blank the panels when the filter matches nothing). */
  function setFileFilter(filter) {
    if (filter === activeFileFilter) return;
    var wasExpanded = facetExpandsAll();
    activeFileFilter = filter;
    syncFilterButtons();
    // leaving a findings facet hands the tree back to its collapsed default
    // rather than leaving the whole build hanging open behind you
    if (wasExpanded && !facetExpandsAll()) state.expandedFolders = ancestorExpansion(state.activeFileIdx);
    var visible = filteredFiles();
    TREE = buildTree(visible);
    allFolderKeys = [];
    collectFolderKeys(TREE, allFolderKeys);
    var stillVisible = visible.some(function (f) { return f.fileIdx === state.activeFileIdx; });
    if (stillVisible) {
      // Active file survives the filter: just repaint the re-filtered tree.
      reapplyExpansion();
      renderTree();
      scrollTreeToActive();
      syncHash();
      return;
    }
    state.selection = null;
    state.activeFileIdx = visible.length ? visible[0].fileIdx : -1;
    reapplyExpansion();
    if (state.activeFileIdx >= 0) {
      // onActiveFileChanged already repaints the tree AND every panel -- no
      // separate renderTree() (that was the redundant double call).
      onActiveFileChanged();
    } else {
      // The filter hid EVERY file -- clear the stale panels.
      blankPanels();
      syncHash();
    }
  }

  /* Live path-substring search: rebuild the tree over the newly-filtered files,
   * keeping the active file loaded even when the query hides it (so the code
   * pane doesn't flip away as you type); an empty result shows the tree note. */
  function applyTreeSearch(raw) {
    var had = !!state.treeQuery;
    state.treeQuery = (raw || "").trim().toLowerCase();
    var visible = filteredFiles();
    TREE = buildTree(visible);
    allFolderKeys = [];
    collectFolderKeys(TREE, allFolderKeys);
    // A live query opens every folder (a match you cannot see is not a match);
    // clearing the query hands the tree back to its collapsed default rather than
    // leaving the whole build hanging open behind you.
    if (had && !state.treeQuery) state.expandedFolders = ancestorExpansion(state.activeFileIdx);
    // A query that hid EVERY file blanked the panels and left no active file; the
    // next query that matches something has to adopt one, or the code pane stays
    // stuck on "No files match" with a populated tree next to it.
    if (state.activeFileIdx < 0 && visible.length) {
      state.activeFileIdx = visible[0].fileIdx;
      state.selection = null;
      onActiveFileChanged();
      return;
    }
    reapplyExpansion();
    renderTree();
  }

  /* One header line: `Files (425)`, with the build-wide WEAK SPOT total (when
   * there is one) riding on the same row. It used to print the LEAK total under
   * the word "leaks" while the inspector printed the open file's weak-spot count
   * under the words "Weak spots" -- two different quantities at two different
   * scopes, sharing neither name nor number. The header now counts the same thing
   * the dashboard's "Weak spots" tile sums (build-wide `spotlights[]`), the
   * inspector counts it for the open file, and the leak subset rides in both
   * tooltips. */
  function renderWorkspaceSummary() {
    var titleEl = document.getElementById("files-title");
    if (titleEl) titleEl.textContent = "Files (" + FILES.length + ")";
    var el = document.getElementById("workspace-summary");
    if (!el) return;
    var weak = 0, leaks = 0, filesWith = 0;
    FILES.forEach(function (f) {
      weak += f.weakSpotCount; leaks += f.leakCount;
      if (f.weakSpotCount > 0) filesWith++;
    });
    el.textContent = weak > 0 ? weak + " weak spot" + (weak === 1 ? "" : "s") : "";
    if (weak > 0) {
      el.setAttribute("data-tip", weak + " weak spot" + (weak === 1 ? "" : "s") + " across this whole build, in " +
        filesWith + " file" + (filesWith === 1 ? "" : "s") + " \u2014 " + leaks + " leaked literal" + (leaks === 1 ? "" : "s") +
        " and " + (weak - leaks) + " residual property name" + (weak - leaks === 1 ? "" : "s") +
        ". This is the number the dashboard's \u201cWeak spots\u201d tile shows; the Weak filter lists exactly these files.");
    } else {
      el.removeAttribute("data-tip");
    }
  }

  /* The code pane's header is now just the path (+ a copy button + where this
   * source came from). The six headline metrics moved to the inspector rail as a
   * fixed six-row band -- they are per-FILE facts, they never react to the
   * selection, and in the header they were eating the vertical space the code
   * itself needed. Their tooltips came with them, verbatim. */
  function renderFileSummary(file) {
    var f = file.doc.file || {};
    var a = file.doc.aggregate || {};
    var cs = a.classSummary || {};

    var full = file.displayPath || file.displayName || "";
    var name = file.displayName || full;
    var dir = full.length > name.length ? full.slice(0, full.length - name.length) : "";
    document.getElementById("file-summary-path").innerHTML =
      (dir ? '<span class="fs-dir">' + escapeHtml(dir) + "</span>" : "") +
      '<span class="fs-name">' + escapeHtml(name) + "</span>";
    // The copy button reuses the inspector's `data-copy` + copyText() plumbing.
    var copyBtn = document.getElementById("copy-path");
    if (copyBtn) {
      copyBtn.setAttribute("data-copy", encodeURIComponent(full));
      copyBtn.setAttribute("data-tip", "Copy the full path: " + full);
    }

    var maxCls = cs.maxClassReached;
    var maxClsHtml = maxCls ? classChipHtml(maxCls, false) : "—";

    // The "(est.)" marker stays on the ROW: `outputSize` is now this file's
    // share of the chunk's MEASURED output, but the split WITHIN a chunk still
    // assumes uniform inflation, so the ratio is a measured total divided by an
    // assumed split — worth flagging wherever the number is.
    var est = f.outputSizeEstimated ? " (est.)" : "";
    // Bundled input, not whole-file input: the ratio is over what the bundler
    // actually kept of this file (tree-shaking bundles only part of a source),
    // so it is comparable to the build's headline ratio. Falls back to whole
    // inputSize for a legacy map that carried no bundled figure.
    var bundledIn = f.bundledInputSize != null ? f.bundledInputSize : f.inputSize;
    var sizeTip = "Bundled " + fmtBytes(bundledIn) + " → output " + fmtBytes(f.outputSize) + est +
      (f.outputSizeEstimated
        ? ". Output is this file's share of the chunk's MEASURED size, apportioned by how many of " +
          "the chunk's bundled bytes came from this source — so the ratio is output ÷ bundled input, " +
          "comparable to the build's headline ratio. The estimate is the one assumption left: " +
          "inflation is taken as uniform within a chunk. Machinery the build ships once for the " +
          "whole bundle — string pool, helpers, bootstrap — is carried as its own separate entry, " +
          "not folded into any source file."
        : "");
    var sizeVal = f.inflationRatio != null ? f.inflationRatio.toFixed(2) + "×" : "—";

    var leaks = file.leakCount;
    var weak = file.weakSpotCount;
    var weakTip = weak + " weak spot" + (weak === 1 ? "" : "s") + " in THIS file (" + leaks + " leaked literal" +
      (leaks === 1 ? "" : "s") + ", " + (weak - leaks) + " residual property name" + (weak - leaks === 1 ? "" : "s") +
      "), listed in full below. The file-tree header counts them across the whole build, which is why the two numbers differ.";
    var renamed = file.renamedCount || 0;

    // Share of the file the map can speak for at all. Without it, the pane's
    // large unpainted stretches read as a failure of the build rather than as
    // syntax the ledger has (and can have) nothing to say about.
    var cov = file.coverage;
    var covPct = cov.total > 0 ? Math.round((cov.region / cov.total) * 100) : 0;
    var covShare = function (n) { return cov.total > 0 ? Math.round((n / cov.total) * 100) : 0; };
    var covTip = "Share of this file's characters carrying a ledger region: " + covPct +
      "%. Extracted-only: " + covShare(cov.extracted || 0) + "%. Renamed-only: " + covShare(cov.renamed) +
      "%. The rest is syntax, preserved names, comments, or code your bundler removed — a region is recorded only where a transform cleared the entropy funnel, so a large plain share is normal.";

    var rows = [
      { k: "Max class", html: maxClsHtml, tip: "The strongest reversal class any region in this file reached." },
      { k: "Attributed", v: covPct + "%", tip: covTip },
      { k: "Extracted", v: fmtNum(file.extractedCount || 0), tip: "Property names and free globals hoisted into the constant pool and reached through a computed lookup — the name is gone from every access site. One tier above renaming, still injective (the pool holds each name literally)." },
      { k: "Renamed", v: fmtNum(renamed), tip: "Identifiers renamed under this build's seed — the low-value baseline layer. Real protection is the hardened regions (materialization / control-flow / MBA)." },
      { k: "Transforms", v: fmtNum(a.totalTransforms), tip: "Total transform passes applied across this file." },
      { k: "Weak spots", v: fmtNum(weak) + (leaks > 0 ? " ⚠" : ""), warn: leaks > 0, tip: weakTip },
      { k: "Size cost" + est, v: sizeVal, tip: sizeTip }
    ];
    document.getElementById("file-summary-metrics").innerHTML = rows.map(function (r) {
      return '<div class="fb-row" data-tip="' + escapeAttr(r.tip) + '">' +
        '<span class="k">' + escapeHtml(r.k) + "</span>" +
        '<span class="v' + (r.warn ? " is-warn" : "") + '">' +
        (r.html != null ? r.html : escapeHtml(String(r.v))) + "</span></div>";
    }).join("");
  }

  /* #8: the artifact's own weight, where the "DEV ONLY" badge used to be. */
  function renderMapSize() {
    var el = document.getElementById("map-size");
    if (!el) return;
    if (MAP_BYTES == null) { el.textContent = "—"; return; }
    el.textContent = "Map " + fmtBytes(MAP_BYTES);
    el.setAttribute("data-tip",
      "The Protection Map data embedded in this page: " + fmtNum(MAP_BYTES) + " bytes of " + MAP_ENCODING +
      ", covering " + fmtNum(FILES.length) + " file" + (FILES.length === 1 ? "" : "s") +
      ". The viewer itself is not counted. This artifact is a DEV-ONLY build output — it carries your original source, so keep it out of anything you publish.");
  }

  function renderClassDist(file) {
    var raw = (file.doc.aggregate && file.doc.aggregate.classSummary) || {};
    var adjustedPreserved = Math.max(0, (raw.preserved || 0) - (file.machinery ? 1 : 0));
    var counts = {
      "preserved": adjustedPreserved,
      "renamed-encoded": raw["renamed-encoded"] || 0,
      "flattened-fused": raw["flattened-fused"] || 0,
      "destroyed-fused": raw["destroyed-fused"] || 0
    };
    var total = counts["preserved"] + counts["renamed-encoded"] + counts["flattened-fused"] + counts["destroyed-fused"];

    document.getElementById("class-dist-bar").innerHTML = CLASS_ORDER.map(function (cls) {
      var n = counts[cls];
      if (!n) return "";
      var pct = total > 0 ? (n / total * 100) : 0;
      return '<i data-class="' + cls + '" style="width:' + pct.toFixed(2) + '%" title="' + escapeAttr(CLASS_META[cls].label + ": " + n) + '"></i>';
    }).join("");

    document.getElementById("class-dist-rows").innerHTML = CLASS_ORDER.map(function (cls) {
      return '<li class="class-dist-row">' + classChipHtml(cls, counts[cls] === 0) + '<span class="class-dist-count">' + counts[cls] + "</span></li>";
    }).join("");

    var maxCls = raw.maxClassReached;
    document.getElementById("class-reached").innerHTML = maxCls ? "Reached this build: " + classChipHtml(maxCls, false) : "";

    var footnote = document.getElementById("class-dist-footnote");
    if (file.machinery && (raw.preserved || 0) > 0 && adjustedPreserved === 0) {
      footnote.hidden = false;
      footnote.textContent = "No user code was left preserved in this build — the \"" + (raw.preserved) + " preserved\" the engine reports is entirely the whole-file scaffolding bucket, excluded from this count.";
    } else {
      footnote.hidden = true;
    }
  }

  function renderClassLegendStatic() {
    var totals = { "preserved": 0, "renamed-encoded": 0, "flattened-fused": 0, "destroyed-fused": 0 };
    FILES.forEach(function (f) {
      var cs = (f.doc.aggregate && f.doc.aggregate.classSummary) || {};
      CLASS_ORDER.forEach(function (cls) { totals[cls] += cs[cls] || 0; });
    });
    // Terse rows: chip + reached/ceiling flag. The full CLASS_META note rides in
    // a hover/focus tooltip instead of always-on prose.
    document.getElementById("class-legend").innerHTML = CLASS_ORDER.map(function (cls) {
      var reached = totals[cls] > 0;
      return '<li class="class-legend-row" tabindex="0" data-tip="' + escapeAttr(CLASS_META[cls].note) + '">' +
        classChipHtml(cls, !reached) +
        '<span class="class-legend-flag">' + (reached ? "reached" : "ceiling") + "</span>" +
        "</li>";
    }).join("");
  }

  // Directive-marker legend: one row per kind actually present in the build, each
  // swatch drawn with the SAME ring the code pane paints. Shown only when a
  // `/* @afterpack ... */` marker was recorded somewhere (Pro); hidden on Free / a
  // build with no markers, so the common case carries no dead legend.
  var DIRECTIVE_LEGEND_META = {
    skip: "skip — asks for the span to stay readable",
    hardened: "hardened — asks for the flattened-fused class",
    destroy: "destroy — asks for the strongest, destroyed-fused class",
    custom: "custom target/floor/deny — an explicit per-region override written on the marker"
  };
  var DIRECTIVE_LEGEND_ORDER = ["skip", "hardened", "destroy", "custom"];
  function renderDirectiveLegend() {
    var present = {};
    FILES.forEach(function (f) {
      (f.directives || []).forEach(function (d) { present[d.kind] = true; });
    });
    var kinds = DIRECTIVE_LEGEND_ORDER.filter(function (k) { return present[k]; });
    var section = document.getElementById("directive-legend-section");
    if (!kinds.length) { section.hidden = true; return; }
    section.hidden = false;
    document.getElementById("directive-legend").innerHTML = kinds.map(function (k) {
      /* The swatch shows what the CODE PANE shows: the marker treatment, not a
         per-kind background tint. It used to be filled with `directiveTint(k)`,
         one hue per kind — a four-colour key to a pane that now renders every
         kind in the same brand gradient. */
      return '<div class="directive-legend-row"><span class="swatch dir-kw" data-directive="' + k +
        '">@afterpack</span>' +
        "<code>" + escapeHtml(DIRECTIVE_LEGEND_META[k]) + "</code></div>";
    }).join("");
  }

  function renderLegend() {
    var bar = document.getElementById("legend-bar");
    var labels = document.getElementById("legend-labels");
    var ramp = currentRamp("heat");
    var stops = ramp.map(function (c, i) { return c + " " + ((i / (ramp.length - 1)) * 100).toFixed(1) + "%"; });
    bar.style.background = "linear-gradient(to right, " + stops.join(", ") + ")";
    labels.innerHTML = "<span>low in file</span><span>high in file</span>";
  }

  function renderEngineInfo(file) {
    // v3: `engine` + `schemaVersion` live at the top-level document envelope
    // (build-wide, emitted once), not per file entry. Fall back to a per-doc copy
    // for a legacy single-doc that still carried them.
    var e = DATA.engine || file.doc.engine || {};
    var schema = DATA.schemaVersion != null ? DATA.schemaVersion : file.doc.schemaVersion;
    var origin = sourceOriginOf(file);
    var rows = [
      ["backend", e.backend], ["preset", e.preset], ["seed", e.seed],
      ["materialize", e.materialize === true ? "on" : e.materialize === false ? "off" : "—"],
      ["complexity", e.complexity], ["engine version", e.version],
      ["source origin", origin],
      ["schema", schema != null ? "v" + schema : "—"]
    ];
    document.getElementById("engine-info").innerHTML = rows.map(function (r) {
      return "<dt>" + escapeHtml(r[0]) + "</dt><dd>" + escapeHtml(r[1] == null ? "—" : String(r[1])) + "</dd>";
    }).join("");
  }

  /* ============================================================
   * 10. Right rail: persistent "weak spots" list.
   * ============================================================ */
  /* Empty <-> populated is a LAYOUT switch, not just different copy: `.is-empty`
   * folds the section into a single row (title + "none" on one line) and
   * `syncRailFill` hands the reserved height back to the pinned inspector above,
   * so an all-clear file doesn't burn half the pane. */
  function setWeakSpotsEmpty(empty) {
    var section = document.getElementById("weakspots-section");
    if (section) section.classList.toggle("is-empty", empty);
    syncRailFill();
  }

  /* Who gets the rail's spare height. The weak-spots half is QUIET when it is
   * empty, collapsed or hidden -- three different reasons for the same layout
   * answer, so one class carries all three rather than a set per reason. */
  function syncRailFill() {
    var rail = document.getElementById("rail-right");
    if (!rail) return;
    var ws = document.getElementById("weakspots-section");
    var insp = document.getElementById("inspector-section");
    var wsQuiet = !ws || rail.classList.contains("weakspots-hidden") ||
      ws.classList.contains("is-empty") || ws.classList.contains("is-collapsed");
    rail.classList.toggle("weakspots-quiet", wsQuiet);
    rail.classList.toggle("inspector-section-collapsed", !!(insp && insp.classList.contains("is-collapsed")));
  }

  function renderWeakSpots(file) {
    var titleEl = document.getElementById("weakspots-title");
    var infoEl = document.getElementById("weakspots-info");
    var list = document.getElementById("weakspots-list");
    if (!titleEl || !list) return;
    // Empty state collapses to ONE quiet line: the count reads "(0)" -- the
    // header is always visible now, so the number has to be there whatever it
    // is -- the size caveat goes (nothing shows sizes), and the vertical space
    // comes back so an all-clear file doesn't reserve a big "nothing leaked"
    // panel. Nothing to expand here, so the all-clear line sits BESIDE the
    // header rather than inside the collapsed body (see `.is-empty` in the CSS).
    if (!file.spotlights.length) {
      titleEl.textContent = "Weak spots (0)";
      if (infoEl) infoEl.style.display = "none";
      list.style.marginTop = "0";
      // "None HERE" and "none in this build" are different answers, and reading
      // the first as the second is exactly how the build's weak spots went
      // missing: say where the others are and how to list them.
      var elsewhere = 0;
      FILES.forEach(function (f) { if (f.fileIdx !== file.fileIdx) elsewhere += f.weakSpotCount; });
      list.innerHTML = '<p class="empty-note-ok"><span class="ok-check">✓</span>None recorded in this file.' +
        (elsewhere > 0 ? " " + elsewhere + " elsewhere in this build — use the <strong>Weak</strong> file filter." : "") +
        "</p>";
      setWeakSpotsEmpty(true);
      return;
    }
    setWeakSpotsEmpty(false);
    titleEl.textContent = "Weak spots (" + file.spotlights.length + ")";
    if (infoEl) infoEl.style.display = "";
    list.style.marginTop = "8px";
    list.innerHTML = file.spotlights.map(function (s) {
      var sev = s.raw.severity;
      var icon = SEVERITY_ICON[sev] || "⚠";
      var mech = s.raw.mechanism || "";
      var mechHuman = mech ? humanize(mech) : "";
      var tail = s.raw.bytes != null ? s.raw.bytes + " B" : "";
      // Compact summary; native <details> expands the full detail on demand. The
      // "Jump to code" button keeps the existing data-jump-spotlight wiring, so the
      // row still selects + scrolls to the leak when expanded. The sample wraps
      // fully (no ellipsis) and the mechanism reads as a plain-English label.
      return '<details class="weakspot" data-spot-idx="' + s.idx + '">' +
        '<summary class="weakspot-summary">' +
          '<span class="weakspot-sev pill pill-' + sev + '" title="' + escapeAttr(SEVERITY_LABEL[sev] || sev) + '">' + icon + "</span>" +
          '<span class="weakspot-sample">' + escapeHtml(s.raw.sample || "") + "</span>" +
          (tail ? '<span class="weakspot-tail">' + escapeHtml(tail) + "</span>" : "") +
        "</summary>" +
        '<div class="weakspot-body">' +
          '<p class="weakspot-reason">' + escapeHtml(s.raw.reason || "") + "</p>" +
          (mech ? '<p class="weakspot-reason">' + escapeHtml(mechHuman) + "</p>" : "") +
          '<p class="weakspot-kv">disposition: <strong>' + escapeHtml(s.raw.disposition || "—") + "</strong>" +
            (mech ? ' · mechanism: <strong data-tip="' + escapeAttr(mech) + '">' + escapeHtml(mech) + "</strong>" : "") +
            (s.raw.bytes != null ? " · " + s.raw.bytes + " bytes" : "") + "</p>" +
          '<div class="cta"><button type="button" class="mini-btn" data-jump-spotlight="' + s.idx + '">Jump to code &amp; inspect</button></div>' +
        "</div>" +
      "</details>";
    }).join("");
  }

  /* ============================================================
   * 11. Right rail: the Inspector. Leads with the reversal-class
   *     region card (chip + tier + score + why); lineage, cost, and
   *     the Pro-ceiling CTA are secondary sections below it.
   *     Consecutive identical lineage steps collapse into one row
   *     ("ScopeDeepen x19") with combined entropy/size deltas.
   * ============================================================ */
  function collapseLineage(lineage) {
    var groups = [];
    lineage.forEach(function (step) {
      var last = groups[groups.length - 1];
      if (last && last.transform === step.transform) {
        last.count++;
        last.entropyGain += step.entropyGain || 0;
        last.sizeDeltaEst += step.sizeDeltaEst || 0;
      } else {
        groups.push({ transform: step.transform, category: step.category, phase: step.phase, count: 1, entropyGain: step.entropyGain || 0, sizeDeltaEst: step.sizeDeltaEst || 0 });
      }
    });
    return groups;
  }

  // One node of the transform-chain stepper: transform name (+ ×N when the step
  // repeated), a category/phase caption, and the entropy/size delta.
  var CHAIN_VISIBLE_CAP = 5;
  function chainStepHtml(g) {
    var cat = CATEGORY_LABEL[g.category] || (g.category || "").toLowerCase();
    var caption = [cat, g.phase].filter(Boolean).join(" · ");
    var delta = [];
    if (g.sizeDeltaEst) delta.push((g.sizeDeltaEst >= 0 ? "+" : "") + g.sizeDeltaEst + "B");
    return '<div class="chain-step">' +
      '<div class="chain-rail"><span class="chain-dot"></span><span class="chain-line"></span></div>' +
      '<div class="chain-body">' +
        '<div class="chain-head">' +
          '<span class="chain-transform">' + escapeHtml(g.transform || "?") + "</span>" +
          (g.count > 1 ? '<span class="chain-count">×' + g.count + "</span>" : "") +
          (delta.length ? '<span class="chain-delta">' + escapeHtml(delta.join(" ")) + "</span>" : "") +
        "</div>" +
        (caption ? '<div class="chain-caption">' + escapeHtml(caption) + "</div>" : "") +
      "</div>" +
    "</div>";
  }
  // The transform chain is the PRIMARY inspector content: an oldest->newest
  // vertical stepper so a token that went renamed -> flattened -> entangled reads
  // as a chain. Long chains fold their tail into a native "show N more".
  function renderChainStepper(region) {
    var lineage = region.raw.lineage || [];
    if (!lineage.length) {
      // An empty `lineage` does NOT mean "untransformed". A map encoded WITHOUT
      // the per-step column carries a real `transformCount` on every region and
      // an empty chain -- so read the COUNT before making any claim. (The old
      // copy asserted "never touched by the transform pipeline" on regions the
      // ledger says ran several transforms.)
      //
      // Cloud maps CARRY lineage as of Aug 2026: measured on the real 331-file
      // map it is +87 KB gzipped, 3.1% of the stored-blob budget, so the size
      // trade-off the column was dropped for was not worth what it cost. An
      // empty chain now means one of two things, and this says which: a map
      // stored BEFORE that change (the artifact is fixed; only a new build
      // gains the chain), or a region the ledger genuinely never touched.
      var n = region.raw.transformCount || 0;
      return '<div class="inspector-section"><h3>Transform chain</h3>' +
        '<p class="inspector-empty">' + (n > 0
          ? escapeHtml("This map stores per-region TOTALS only, not the individual steps — the ledger counts " +
              n + " transform" + (n === 1 ? "" : "s") + " on this span, all of them real. Maps stored before " +
              "August 2026 were captured without the step column to keep the artifact small; re-run your " +
              "build to get the full chain.")
          : "No transform ran on this span.") +
        "</p></div>";
    }
    var groups = collapseLineage(lineage);
    var visible = groups.slice(0, CHAIN_VISIBLE_CAP).map(chainStepHtml).join("");
    var extra = groups.slice(CHAIN_VISIBLE_CAP);
    var extraHtml = extra.length
      ? '<details class="chain-extra"><summary>show ' + extra.length + " more step" + (extra.length === 1 ? "" : "s") + "</summary>" +
        extra.map(chainStepHtml).join("") + "</details>"
      : "";
    var note = region.raw.lineageCapped
      ? '<div class="chain-more">' + escapeHtml("ledger recorded " + region.raw.lineageCapped + " raw steps total; " + lineage.length + " embedded in this map") + "</div>"
      : "";
    return '<div class="inspector-section"><h3>Transform chain <span class="chip">' + groups.length + " step" + (groups.length === 1 ? "" : "s") +
      (region.raw.lineageCapped ? "+" : "") + '</span></h3><div class="chain">' + visible + "</div>" + extraHtml + note + "</div>";
  }

  /* ---- the stable inspector shell (#13) ---------------------------------
   * ONE card draws every selection. Whatever is selected it gets the same five
   * things -- an identity line, a score, a context line, exactly SIX fact rows
   * and an action line -- so the panel's height is a constant: clicking from a
   * leak to a comment to a renamed identifier does not move a pixel. Two rules
   * make that hold: the grid always has six rows (a kind with less to say pads
   * with an invisible one) and nothing inside it wraps.
   *
   * No sentence is printed here. Every explanation, caveat and warning the old
   * cards spelled out lives in INSP_COPY (or in the engine's own `why` /
   * UNLIT_VERDICT strings) and is rendered as a `data-tip` on the row, chip or
   * flag it belongs to -- the same "(?)" rule the rest of the product follows.
   * A row that carries one advertises it with a dotted key. */
  var INSP_FACTS = 6;
  function inspFlag(kind, glyph, tip) {
    return '<span class="insp-flag" data-kind="' + kind + '" tabindex="0" role="note" data-tip="' +
      escapeAttr(tip) + '">' + escapeHtml(glyph) + "</span>";
  }
  function inspFact(f) {
    if (!f) return '<div class="insp-fact is-pad" aria-hidden="true"><span class="k">-</span><span class="v">-</span></div>';
    var val = f.html != null ? f.html : escapeHtml(f.v == null || f.v === "" ? "—" : String(f.v));
    return '<div class="insp-fact"' + (f.tip ? ' data-tip="' + escapeAttr(f.tip) + '"' : "") + ">" +
      '<span class="k">' + escapeHtml(f.k) + "</span>" +
      '<span class="v' + (f.dim ? " is-dim" : "") + (f.warn ? " is-warn" : "") + '"' +
      (f.full ? ' title="' + escapeAttr(f.full) + '"' : "") + ">" + val + "</span></div>";
  }
  function inspCard(o) {
    var facts = (o.facts || []).slice(0, INSP_FACTS);
    while (facts.length < INSP_FACTS) facts.push(null);
    var hasScore = o.score != null && !isNaN(o.score);
    var s = hasScore ? Math.max(0, Math.min(100, Math.round(o.score))) : 0;
    return '<div class="insp-card">' +
      '<div class="insp-ident">' + (o.chip || "") + (o.tier || "") +
        '<span class="insp-flags">' + (o.flags || []).join("") + "</span>" +
        '<span class="insp-score"' + (o.scoreTip ? ' data-tip="' + escapeAttr(o.scoreTip) + '"' : "") + ">" +
          (hasScore ? s + "<small>/100</small>" : "<small>—</small>") + "</span>" +
      "</div>" +
      '<div class="meter meter-lg insp-meter' + (hasScore ? "" : " is-blank") + '">' +
        '<i style="width:' + s + "%;background:" + heatSolid(s) + '"></i></div>' +
      '<div class="insp-where">' + escapeHtml(o.where || "") + "</div>" +
      '<div class="insp-facts">' + facts.map(inspFact).join("") + "</div>" +
      '<div class="insp-actions">' + (o.actions || "") + "</div>" +
      "</div>";
  }
  /* The transform chain keeps its full stepper -- it is VALUE, not prose -- but
     it is the one block whose height genuinely tracks the data, so it rides in a
     collapsed <details>. Closed (the default) it is exactly one line for every
     selection; opening it is a user action, not a selection change.
     renderChainStepper() stays the single source of the chain's own copy. */
  function inspChain(region) {
    if (!region) {
      return '<details class="insp-chain"><summary class="details-summary" data-tip="' +
        escapeAttr(INSP_COPY.noRegion) + '">Transform chain <span class="chip">no region</span></summary>' +
        '<p class="insp-note">' + escapeHtml(INSP_COPY.noRegion) + "</p></details>";
    }
    var groups = collapseLineage(region.raw.lineage || []);
    var n = region.raw.transformCount || 0;
    var label = groups.length
      ? groups.length + " step" + (groups.length === 1 ? "" : "s") + (region.raw.lineageCapped ? "+" : "")
      : n > 0 ? "totals only" : "none";
    return '<details class="insp-chain"><summary class="details-summary">Transform chain <span class="chip">' +
      escapeHtml(label) + "</span></summary>" + renderChainStepper(region) + "</details>";
  }
  function chainTopStep(region) {
    var g = collapseLineage((region && region.raw.lineage) || [])[0];
    return g ? (g.transform || "?") + (g.count > 1 ? " ×" + g.count : "") : null;
  }
  /* The recorded directive, as tooltip text: which keyword was found over this
     span and the posture written on it. */
  function directiveTip(d) {
    var posture = [];
    if (d.target != null) posture.push("target " + d.target);
    if (d.floor != null) posture.push("floor " + (d.floor ? "on" : "off"));
    return "An @afterpack " + d.keyword + " marker recorded over this span" +
      (posture.length ? " — " + posture.join(" · ") : "") +
      ". The build records the marker and its coordinates; whether it changed this span's target class is not recorded.";
  }
  function sizeDeltaText(n) { return n == null ? null : (n >= 0 ? "+" : "") + fmtNum(n) + " B"; }
  /* The whole-file "machinery" bucket, as tooltip text: the engine reports these
     per FILE, not per span, so they never sit in a per-token fact row. */
  function machineryTip(file) {
    var m = file.machinery ? file.machinery.raw : null;
    if (!m) return MACHINERY_BLURB;
    var num = function (v) { return v == null ? "—" : String(v); };
    return "Whole-file bucket (not per-token) — entropyRaw " + num(m.entropyRaw) +
      ", transformCount " + num(m.transformCount) + ", sizeDeltaEst " + num(m.sizeDeltaEst) +
      " (est.). " + MACHINERY_BLURB;
  }

  /* ---- "not attributed" -------------------------------------------------
   * The map is ENTROPY-FUNNEL based: only a transform that clears the funnel
   * records a ledger region, and every span is back-mapped from the BUNDLED
   * output through source maps. So a token with no paint is one of three very
   * different things, and a viewer that just makes it un-clickable teaches the
   * reader nothing:
   *
   *   1. genuinely nothing to do -- punctuation, a keyword, a comment (comments
   *      never even reach the shipped output), a property key the engine
   *      preserves on purpose;
   *   2. renamed-only -- but that has its own baseline lane, so it never lands
   *      here;
   *   3. an ATTRIBUTION GAP -- a real region exists, but its back-mapped span
   *      stopped a token short of the code it actually transformed.
   *
   * These helpers gather the evidence that separates (1) from (3) and the card
   * below states which one it is, in those words. */

  /** The lexical token containing `pos`, as `{start, end, type, text}`. */
  function tokenAt(file, pos) {
    var syn = lexFile(file);
    if (!syn) return { start: pos, end: Math.min(pos + 1, file.sourceLen), type: "?", text: file.source.charAt(pos) };
    var ti = tokenIndexAt(syn, pos);
    var start = syn.starts[ti], end = tokenEnd(syn, ti, file.sourceLen);
    return { start: start, end: end, type: syn.types.charAt(ti), text: file.source.slice(start, end) };
  }
  /** Closest region ending before / starting after `pos` (never one covering it). */
  function neighbourRegions(file, pos) {
    var before = null, after = null;
    file.realRegions.forEach(function (r) {
      if (r.endChar <= pos) { if (!before || r.endChar > before.endChar) before = r; }
      else if (r.startChar >= pos) { if (!after || r.startChar < after.startChar) after = r; }
    });
    return { before: before, after: after };
  }
  /** Does any literal token (string / number) fall inside this region's span? */
  function regionCoversLiteral(file, region) {
    var syn = lexFile(file);
    if (!syn) return true; // unknown grammar: never accuse the region of anything
    var ti = tokenIndexAt(syn, region.startChar);
    while (ti < syn.starts.length && syn.starts[ti] < region.endChar) {
      var t = syn.types.charAt(ti);
      if (t === "s" || t === "n") return true;
      ti++;
    }
    return false;
  }
  /** A region the engine recorded as encoding exactly ONE literal. */
  function isMaterializationRegion(region) {
    return !!region && (region.raw.annotations || []).indexOf("materializationSite") >= 0;
  }
  function pct(part, total) { return total > 0 ? Math.round((part / total) * 100) + "%" : "—"; }

  // What the grammar says this token IS. Each line is a statement the data
  // actually supports -- none of them claim the token is "protected".
  var UNLIT_VERDICT = {
    w: "Whitespace. Nothing here for any transform to act on.",
    p: "An operator or punctuation — required syntax. It has to survive verbatim for the program to parse, so no transform can touch it.",
    k: "A syntactic keyword — `if`, `return`, `function`, `const`. Required syntax: it has to survive verbatim for the program to parse, so no transform can touch it. (`null`, `true`, `false` and `undefined` are lexically keywords too, but they are VALUES, and this viewer reports them separately — they are not untouchable.)",
    v: "A value literal, not syntax. `null` / `true` / `false` / `undefined` are ordinary expressions, so unlike `if` or `return` an obfuscator may legitimately replace them — and AfterPack does: `true`/`false` are lowered to `!0`/`!1` and then fused into opaque arithmetic, while `null` and `undefined` are replaced by a reference to a shared sink, so the keyword itself never reaches your output. Unlit here means THIS MAP carries no region for the span, not that the token shipped verbatim. Maps captured before value-literal lowering was ledgered show every one of them unlit.",
    y: "A property key. AfterPack never RENAMES one — that would break every dynamic access, JSON round-trip and external contract that reaches it by name — but it does not leave it alone either: property extraction rewrites `state.items.map(…)` to `a[l](…)` and hoists `\"map\"` into the string pool, where string encoding treats it like any other literal. So a property key CAN carry a region, and usually does once encoding is on. Unlit means no region landed on THIS key: either the key was not extracted, or its span did not survive back-mapping. Keys that reach your output still readable are listed separately as `Property name` spotlights.",
    i: "An identifier with no rename recorded on it. Either your bundler resolved or removed it before AfterPack ran (an import binding, a type, dead code), or it is a name AfterPack must not touch — a global, an export your consumers call, a reserved word.",
    s: "A string literal with no ledger region on it.",
    n: "A number literal with no ledger region on it.",
    c: "A comment. Comments never reach your shipped output — your bundler strips them long before AfterPack sees the code — so there is nothing here to protect and nothing to leak.",
    "?": "This viewer has no grammar for this file type, so it cannot say what this token is. It carries no ledger region and no rename."
  };
  var LITERAL_FUNNEL_NOTE = "The map records a region only where a transform cleared the entropy funnel. A literal can also be gone before the engine ever sees it — a TypeScript type-position string is erased at compile time, and a constant your bundler folded away leaves nothing to encode.";

  /* ---- one builder per selection kind ------------------------------------
   * Each returns exactly TWO blocks: the fixed card, then the collapsed chain.
   * That is what makes "the inspector does not jump" a structural property
   * rather than something to eyeball. */
  function cardRegion(file, region, opts) {
    var r = region.raw;
    var perf = r.perf || {};
    var flags = [];
    if (r.why) flags.push(inspFlag("info", "?", r.why));
    if (opts && opts.leakInside) flags.push(inspFlag("leak", "!", INSP_COPY.leakCap));
    // Span-honesty check, unchanged in substance -- a materialization site
    // encodes exactly ONE literal, so a recorded span with no literal in it is
    // not describing what it painted. It is a flag now instead of a red banner.
    if (isMaterializationRegion(region) && !regionCoversLiteral(file, region)) {
      flags.push(inspFlag("warn", "▲", INSP_COPY.spanMismatch));
    }
    if (region.directive) flags.push(inspFlag("dir", "@", directiveTip(region.directive)));
    var top = chainTopStep(region);
    return inspCard({
      chip: classChipHtml(r.reversalClass, false),
      tier: r.tier ? '<span class="tier-pill tier-' + escapeAttr(r.tier) + '">' + escapeHtml(r.tier) + "</span>" : "",
      flags: flags,
      score: r.score,
      scoreTip: INSP_COPY.score,
      where: (r.nodeKind || "?") + " · chars " + region.startChar + "–" + region.endChar,
      facts: [
        { k: "Transforms", v: r.transformCount, tip: INSP_COPY.transforms },
        { k: "Chain", v: top || (r.transformCount ? "totals only" : "none"), dim: !top, full: top || "",
          tip: top ? INSP_COPY.chainTop : INSP_COPY.chainNone },
        { k: "Size Δ", v: sizeDeltaText(r.sizeDeltaEst), tip: INSP_COPY.sizeDelta },
        { k: "Decode ops", v: perf.decodeOps, tip: INSP_COPY.decodeOps },
        { k: "Entropy (raw)", v: r.entropyRaw, tip: INSP_COPY.entropy },
        r.ceiling
          ? { k: "Ceiling", html: classChipHtml(r.ceiling.class, true), tip: INSP_COPY.ceiling }
          : { k: "Ceiling", v: "—", dim: true, tip: INSP_COPY.ceilingNone }
      ],
      actions: r.ceiling
        ? '<button type="button" class="mini-btn copy-btn-pro" data-copy="' + encodeURIComponent(r.ceiling.directive) +
          '" data-tip="' + escapeAttr(r.ceiling.directive + " — " + INSP_COPY.ceiling) + '">Copy Pro directive</button>'
        : ""
    }) + inspChain(region);
  }

  function cardPreserved(file, region) {
    var r = region.raw;
    var hasReason = !!r.preservedReason;
    // `lineage` can be absent from the DOCUMENT (the cloud artifact drops the
    // per-step column to stay small), so "no lineage" is not evidence that
    // nothing ran -- `transformCount` is.
    var steps = (r.lineage || []).length;
    var count = r.transformCount || 0;
    var lowered = !hasReason && (steps > 0 || count > 0);
    var reason = hasReason ? humanize(r.preservedReason) : lowered ? INSP_COPY.preservedLowered : INSP_COPY.preservedNone;
    var flags = [inspFlag("info", "?", reason)];
    if (region.directive) flags.push(inspFlag("dir", "@", directiveTip(region.directive)));
    var top = chainTopStep(region);
    return inspCard({
      chip: classChipHtml("preserved", false),
      flags: flags,
      score: null,
      where: (r.nodeKind || "?") + " · chars " + region.startChar + "–" + region.endChar,
      facts: [
        { k: "State", v: hasReason ? "must stay literal" : lowered ? "lowered only" : "no transform ran",
          tip: INSP_COPY.preservedState },
        { k: "Reason", v: hasReason ? humanize(r.preservedReason) : "—", dim: !hasReason,
          full: hasReason ? humanize(r.preservedReason) : "", tip: hasReason ? reason : INSP_COPY.preservedState },
        { k: "Reason code", v: r.preservedReason || "—", dim: !hasReason },
        { k: "Transforms", v: count, tip: INSP_COPY.transforms },
        { k: "Chain", v: top || (count ? "totals only" : "none"), dim: !top,
          tip: top ? INSP_COPY.chainTop : INSP_COPY.chainNone },
        region.directive
          ? { k: "Directive", v: "@afterpack " + region.directive.keyword, tip: directiveTip(region.directive) }
          : { k: "Directive", v: "—", dim: true }
      ],
      actions: ""
    }) + inspChain(region);
  }

  function cardRenamed(file, idx) {
    var r = file.renamedRanges[idx];
    return inspCard({
      chip: classChipHtml("renamed-encoded", false, "Renamed"),
      flags: [inspFlag("info", "?", INSP_COPY.renamedOutput)],
      score: null,
      where: "identifier" + (r ? " · chars " + r.startChar + "–" + r.endChar : ""),
      facts: [
        { k: "Layer", v: "rename baseline", tip: INSP_COPY.renamedLayer },
        { k: "In your output", v: "name replaced", tip: INSP_COPY.renamedOutput },
        { k: "Strength", v: "low", dim: true, tip: INSP_COPY.renamedStrength },
        { k: "Hardened region", v: "none on this span", dim: true, tip: INSP_COPY.renamedLayer },
        { k: "Renamed span", v: (idx + 1) + " of " + fmtNum(file.renamedRanges.length),
          tip: "This span's position in the file's list of renamed identifier occurrences — not the 5th use of this particular name." },
        { k: "Renamed share", v: pct(file.coverage.renamed, file.coverage.total), tip: INSP_COPY.coverage }
      ],
      actions: ""
    }) + inspChain(null);
  }

  /* The `Globals` extraction lane's detail card. Deliberately the same SHAPE as
   * `cardRenamed` — both are compact, class-1 lanes with no per-token lineage to
   * show — with the facts that actually differ: what kind of token was extracted,
   * and that the name left the access site rather than merely changing. */
  function cardExtracted(file, idx) {
    var r = file.extractedRanges[idx];
    var isGlobal = !!r && r.kind === "global";
    return inspCard({
      chip: classChipHtml("renamed-encoded", false, "Extracted"),
      flags: [inspFlag("info", "?", INSP_COPY.extractedOutput)],
      score: null,
      where: (isGlobal ? "global reference" : "property name") +
        (r ? " · chars " + r.startChar + "–" + r.endChar : ""),
      facts: [
        { k: "Layer", v: "constant-pool extraction", tip: INSP_COPY.extractedLayer },
        { k: "Extracted", v: isGlobal ? "global identifier" : "property name", tip: INSP_COPY.extractedKind },
        { k: "In your output", v: "computed pool lookup", tip: INSP_COPY.extractedOutput },
        { k: "Strength", v: "low–moderate", dim: true, tip: INSP_COPY.extractedStrength },
        { k: "Hardened region", v: "none on this span", dim: true, tip: INSP_COPY.extractedLayer },
        { k: "Extracted span", v: (idx + 1) + " of " + fmtNum(file.extractedRanges.length),
          tip: "This span's position in the file's list of extracted tokens — not the Nth use of this particular name." },
        { k: "Extracted share", v: pct(file.coverage.extracted, file.coverage.total), tip: INSP_COPY.coverage }
      ],
      actions: ""
    }) + inspChain(null);
  }

  function cardUnlit(file, u) {
    var tok = tokenAt(file, u.pos);
    // No grammar => no token boundaries; the painted RUN is the honest extent.
    if (tok.type === "?" && u.end != null) tok = { start: u.pos, end: u.end, type: "?", text: file.source.slice(u.pos, u.end) };
    var type = tok.type === "?" && u.type && u.type !== "?" ? u.type : tok.type;
    // Lexically these are keywords; semantically they are values. Reporting
    // them as keywords made the card claim "no transform can touch it" about a
    // token the engine rewrites -- the one thing this viewer must never do.
    if (type === "k" && VALUE_LITERAL_TEXT[tok.text] === 1) type = "v";
    var kind = TOKEN_KIND[type] || "source text";
    var nb = neighbourRegions(file, tok.start);
    var cov = file.coverage;
    var before = nb.before;
    var gapText = before ? file.source.slice(before.endChar, tok.start) : null;
    var abuts = !!before && gapText.length <= 2 && !/\S/.test(gapText);
    var mislaid = abuts && isMaterializationRegion(before) && !regionCoversLiteral(file, before);
    var verdict = UNLIT_VERDICT[type] || UNLIT_VERDICT["?"];

    var flags = [inspFlag("info", "?", verdict)];
    if (type === "s" || type === "n") flags.push(inspFlag("info", "ƒ", LITERAL_FUNNEL_NOTE));
    if (abuts) {
      flags.push(inspFlag("warn", "▲", "A recorded region ends " +
        (gapText.length === 0 ? "immediately" : gapText.length + " character" + (gapText.length === 1 ? "" : "s")) +
        " before this token, with nothing but whitespace in between. " + INSP_COPY.gapAbuts +
        (mislaid ? " " + INSP_COPY.spanMismatch : "")));
    }
    var di = -1;
    file.directives.forEach(function (d, i) {
      if (d.startChar <= tok.start && d.endChar >= tok.end &&
        (di < 0 || (d.endChar - d.startChar) < (file.directives[di].endChar - file.directives[di].startChar))) di = i;
    });
    if (di >= 0) flags.push(inspFlag("dir", "@", directiveTip(file.directives[di])));
    if (file.machinery) flags.push(inspFlag("info", "◫", machineryTip(file)));

    var nearest = abuts
      ? (gapText.length === 0 ? "abuts a region" : gapText.length + " chars after a region")
      : (before || nb.after)
        ? [before ? (tok.start - before.endChar) + " chars after" : null,
           nb.after ? (nb.after.startChar - tok.end) + " chars before" : null].filter(Boolean).join(" · ")
        : "none in this file";
    return inspCard({
      chip: classChipHtml("preserved", true, "Not attributed"),
      flags: flags,
      score: null,
      where: kind + " · chars " + tok.start + "–" + tok.end,
      facts: [
        { k: "Token", v: kind, tip: verdict },
        { k: "Nearest region", v: nearest, warn: abuts,
          tip: abuts ? INSP_COPY.gapAbuts : (before || nb.after) ? INSP_COPY.gapClear : INSP_COPY.gapNone },
        // All FOUR disjoint coverage buckets `prepareFile` computes, so the
        // group sums to 100% and the reader can check it. Printing three of
        // four left the extracted lane's share silently folded into nothing --
        // the rows simply didn't add up. This is also why the old "Grammar" row
        // is gone rather than the card growing a seventh fact: `INSP_FACTS`
        // fixes every card at six rows so the panel doesn't jump between
        // selections, and the toolbar toggle two lines up already reads
        // "Syntax · <grammar label>" -- the row restated a label the reader can
        // see, while a whole coverage bucket was missing.
        { k: "Ledger region", v: pct(cov.region, cov.total), tip: INSP_COPY.coverage },
        { k: "Extracted only", v: pct(cov.extracted || 0, cov.total), tip: INSP_COPY.coverage },
        { k: "Renamed only", v: pct(cov.renamed, cov.total), tip: INSP_COPY.coverage },
        { k: "Plain", v: pct(cov.plain, cov.total), tip: INSP_COPY.coverage }
      ],
      actions: abuts
        ? '<button type="button" class="mini-btn" data-select-region="' + before.idx + '">Inspect that region</button>'
        : ""
    }) + inspChain(null);
  }

  /* A surviving readable literal is the WEAKEST LINK: it leads the card, and the
     score/meter (borrowed from the region around it) carries the explicit "this
     rates the surrounding code, not the leak" caveat on its tooltip. */
  function cardSpotlight(file, spotlight, region) {
    var s = spotlight.raw;
    var sev = s.severity;
    var leakLabel = sev === "leak" ? "Unprotected — leaked"
      : sev === "propertyName" ? "Unprotected — key name" : null;
    var flags = [];
    if (s.reason) flags.push(inspFlag("info", "?", s.reason));
    flags.push(inspFlag("leak", "!", INSP_COPY.leakCap));
    if (region && region.directive) flags.push(inspFlag("dir", "@", directiveTip(region.directive)));
    var mech = s.mechanism || "";
    return inspCard({
      chip: classChipHtml(s.reversalClass || "preserved", false, leakLabel),
      tier: '<span class="pill pill-' + escapeAttr(sev) + '">' + escapeHtml(SEVERITY_LABEL[sev] || sev) + "</span>",
      flags: flags,
      score: region ? region.raw.score : null,
      scoreTip: INSP_COPY.leakCap,
      where: (SEVERITY_ICON[sev] || "⚠") + " " + (SEVERITY_LABEL[sev] || sev) +
        " · chars " + spotlight.startChar + "–" + spotlight.endChar,
      facts: [
        { k: "Sample", v: s.sample, full: s.sample, tip: INSP_COPY.sample },
        { k: "Mechanism", v: mech ? humanize(mech) : "—", full: mech, dim: !mech, tip: INSP_COPY.mechanism },
        { k: "Disposition", v: s.disposition, tip: INSP_COPY.disposition },
        { k: "Added bytes", v: s.bytes == null ? "—" : s.bytes + " B", dim: s.bytes == null, tip: INSP_COPY.bytes },
        { k: "Region class", html: region ? classChipHtml(region.raw.reversalClass, false) : null, v: "none",
          dim: !region, tip: region ? INSP_COPY.leakCap : INSP_COPY.noRegion },
        { k: "Region score", v: region ? region.raw.score + "/100" : "—", dim: !region, tip: INSP_COPY.leakCap }
      ],
      actions: s.proHint
        ? '<button type="button" class="mini-btn copy-btn-pro" data-copy="' + encodeURIComponent(s.proHint) +
          '" data-tip="' + escapeAttr(s.proHint) + '">Force-protect in Pro</button>'
        : ""
    }) + inspChain(region);
  }

  /* Nothing selected: the same shell, filled with the file's own aggregate --
     so the panel that greets you has the identical height as every selection. */
  function cardFile(file) {
    var a = file.doc.aggregate || {};
    var leaks = file.leakCount;
    var maxCls = (a.classSummary || {}).maxClassReached;
    var flags = [inspFlag("info", "?", INSP_COPY.selectHint)];
    if (file.machinery) flags.push(inspFlag("info", "◫", machineryTip(file)));
    return inspCard({
      chip: maxCls ? classChipHtml(maxCls, false) : '<span class="insp-title">File aggregate</span>',
      flags: flags,
      score: Math.round(file.avgScore),
      scoreTip: INSP_COPY.avgScore,
      where: "no selection · whole file",
      facts: [
        { k: "Regions", v: fmtNum(file.realRegions.length), tip: INSP_COPY.fileRegions },
        { k: "Transforms", v: fmtNum(a.totalTransforms), tip: INSP_COPY.transforms },
        { k: "Weak spots", v: fmtNum(file.weakSpotCount), tip: INSP_COPY.weakSpots },
        { k: "of which leaks", v: fmtNum(leaks), warn: leaks > 0, tip: INSP_COPY.leaks },
        { k: "Size Δ total", v: sizeDeltaText(a.sizeDeltaEstTotal), tip: INSP_COPY.sizeDelta },
        { k: "Avg entropy", v: a.avgEntropy, tip: INSP_COPY.entropyAvg }
      ],
      actions: '<span class="insp-hint">Select any token to inspect it.</span>'
    }) + inspChain(null);
  }

  /* What the collapsed Inspector header says it is holding. There is no honest
     COUNT here -- every card is one card, and the fact grid is six rows by
     construction -- so the header carries the selection's identity instead. */
  function inspectorSummary(file, sel) {
    if (!sel) return "no selection";
    if (sel.spotlightIdx != null) {
      var sp = file.spotlights[sel.spotlightIdx];
      var sample = sp && sp.raw.sample ? String(sp.raw.sample) : "";
      if (sample.length > 24) sample = sample.slice(0, 23) + "…";
      return sample ? "weak spot · " + sample : "weak spot";
    }
    if (sel.unlit) return "unattributed token";
    if (sel.renamedIdx != null) return "renamed identifier";
    if (sel.extractedIdx != null) return "extracted name";
    if (sel.regionIdx != null) {
      var region = regionByIdx(file, sel.regionIdx);
      if (!region) return "region";
      var cls = region.raw.reversalClass;
      return (CLASS_META[cls] && CLASS_META[cls].label) || cls || "region";
    }
    return "";
  }

  function renderInspector() {
    var el = document.getElementById("inspector");
    var countEl = document.getElementById("inspector-count");
    var file = activeFile();
    var sel = state.selection;
    if (countEl) countEl.textContent = file ? inspectorSummary(file, sel) : "";
    if (!file) { el.innerHTML = ""; return; }
    if (!sel) {
      // NOT `cardFile` any more. With nothing selected it printed a file-level
      // aggregate that the "This file" band directly above already shows, so the
      // rail opened with the same six numbers twice. One quiet line instead.
      el.innerHTML = '<p class="inspector-empty">Select any token in the code pane to inspect it.</p>';
      return;
    }
    var region = sel.regionIdx != null ? regionByIdx(file, sel.regionIdx) : null;
    var spotlight = sel.spotlightIdx != null ? file.spotlights[sel.spotlightIdx] : null;
    var html = spotlight ? cardSpotlight(file, spotlight, region)
      : region && isPreservedRegion(region) ? cardPreserved(file, region)
      : region ? cardRegion(file, region, null)
      : sel.unlit ? cardUnlit(file, sel.unlit)
      : sel.extractedIdx != null ? cardExtracted(file, sel.extractedIdx)
      : sel.renamedIdx != null ? cardRenamed(file, sel.renamedIdx)
      : cardFile(file);
    el.innerHTML = '<div class="insp">' + html + "</div>";
  }

  /* ============================================================
   * 12. Selection + "highlight same class" mode.
   *     A click always resolves to the deepest/smallest region
   *     covering that exact token (baked into `mergedRuns` by the
   *     sweep-line fill rule above) -- so selection never lights up
   *     more than the one specific region a token belongs to.
   * ============================================================ */
  function highlightSelectionRing() {
    codeBody.querySelectorAll(".tok.is-selected").forEach(function (t) { t.classList.remove("is-selected"); });
    var sel = state.selection;
    if (!sel) return;
    if (sel.regionIdx != null) {
      codeBody.querySelectorAll('.tok[data-region-idx="' + sel.regionIdx + '"]').forEach(function (t) { t.classList.add("is-selected"); });
    } else if (sel.spotlightIdx != null) {
      codeBody.querySelectorAll('.tok[data-spotlight-idx="' + sel.spotlightIdx + '"]').forEach(function (t) { t.classList.add("is-selected"); });
    } else if (sel.extractedIdx != null) {
      codeBody.querySelectorAll('.tok[data-extracted-idx="' + sel.extractedIdx + '"]').forEach(function (t) { t.classList.add("is-selected"); });
    } else if (sel.renamedIdx != null) {
      codeBody.querySelectorAll('.tok[data-renamed-idx="' + sel.renamedIdx + '"]').forEach(function (t) { t.classList.add("is-selected"); });
    } else if (sel.unlit) {
      codeBody.querySelectorAll('.tok[data-unlit="' + sel.unlit.pos + '"]').forEach(function (t) { t.classList.add("is-selected"); });
    }
  }

  var highlightToggle = document.getElementById("highlight-class-toggle");
  var highlightStatus = document.getElementById("highlight-class-status");
  var syntaxToggle = document.getElementById("syntax-toggle");
  var syntaxToggleText = document.getElementById("syntax-toggle-text");
  /* The toggle names the grammar that actually claimed this file, and goes dead
   * for a file type no grammar covers -- rather than offering a switch that
   * silently does nothing. */
  function updateSyntaxToggle(file) {
    if (!syntaxToggle) return;
    var g = file && file.grammar;
    syntaxToggle.disabled = !g;
    syntaxToggle.checked = !!g && state.syntaxOn;
    if (syntaxToggleText) syntaxToggleText.textContent = g ? "Syntax · " + g.label : "Syntax · n/a";
  }
  function currentSelectedRegion() {
    var file = activeFile();
    if (!file || !state.selection || state.selection.regionIdx == null) return null;
    return regionByIdx(file, state.selection.regionIdx);
  }
  function applyHighlightClass() {
    var region = currentSelectedRegion();
    var cls = region ? region.raw.reversalClass : null;
    highlightToggle.disabled = !cls;
    var active = state.highlightClassOn && !!cls;
    if (active) {
      codeBody.setAttribute("data-highlight-class", cls);
      var file = activeFile();
      var count = file ? file.realRegions.filter(function (r) { return r.raw.reversalClass === cls; }).length : 0;
      var label = CLASS_META[cls] ? CLASS_META[cls].label : cls;
      // The slot is ALWAYS in the layout (see `#highlight-class-status`), so
      // turning this on only makes it visible -- it can no longer push the
      // toggles sideways. The sentence it used to spell out is the tooltip.
      highlightStatus.textContent = "· " + count + " region" + (count === 1 ? "" : "s");
      highlightStatus.setAttribute("data-tip", "Highlighting " + label + " — " + count + " region" +
        (count === 1 ? "" : "s") + " in this file share the selected token's reversal class.");
      highlightStatus.classList.add("is-on");
    } else {
      codeBody.removeAttribute("data-highlight-class");
      highlightStatus.classList.remove("is-on");
      highlightStatus.removeAttribute("data-tip");
    }
  }

  function selectFromRun(regionIdx, spotlightIdx, renamedIdx, extractedIdx) {
    state.selection = {
      regionIdx: regionIdx == null || isNaN(regionIdx) ? null : regionIdx,
      spotlightIdx: spotlightIdx == null || isNaN(spotlightIdx) ? null : spotlightIdx,
      renamedIdx: renamedIdx == null || isNaN(renamedIdx) ? null : renamedIdx,
      extractedIdx: extractedIdx == null || isNaN(extractedIdx) ? null : extractedIdx,
      unlit: null
    };
    revealInspectorSection();
    highlightSelectionRing();
    applyHighlightClass();
    renderInspector();
  }
  /* An UN-attributed token is a first-class selection now: it has no region, but
   * it does have a lexical identity and a neighbourhood, and that is exactly what
   * the reader needs to tell "nothing to do here" from "the span missed it". */
  function selectUnlit(pos, type, end) {
    state.selection = { regionIdx: null, spotlightIdx: null, renamedIdx: null, extractedIdx: null, unlit: { pos: pos, type: type, end: end } };
    revealInspectorSection();
    highlightSelectionRing();
    applyHighlightClass();
    renderInspector();
  }
  /* Deselect: back to the file-aggregate default (no ring, no class highlight).
   * Cheap no-op when nothing is selected, so it is safe to call from a broad
   * document-level click handler. */
  function clearSelection() {
    if (!state.selection) return;
    state.selection = null;
    highlightSelectionRing();
    applyHighlightClass();
    renderInspector();
  }
  // `.tok-hot` = attributed (a region, a weak spot, or the rename baseline).
  // `.tok-unlit` = a real token with no attribution -- still inspectable, because
  // "why is there nothing here" is an answer worth giving. Only whitespace and
  // the pane's empty area are inert, and clicking those still CLEARS.
  function isAttributedTok(el) { return !!el && el.classList.contains("tok-hot"); }
  function isPickableTok(el) { return !!el && (el.classList.contains("tok-hot") || el.classList.contains("tok-unlit")); }
  function handleTokActivate(tokEl) {
    if (!isAttributedTok(tokEl)) {
      selectUnlit(Number(tokEl.dataset.unlit || 0), tokEl.dataset.ut || "?", tokEl.dataset.ue ? Number(tokEl.dataset.ue) : null);
      return;
    }
    var r = tokEl.dataset.regionIdx === "" ? null : Number(tokEl.dataset.regionIdx);
    var s = tokEl.dataset.spotlightIdx === "" ? null : Number(tokEl.dataset.spotlightIdx);
    var rn = tokEl.dataset.renamedIdx == null || tokEl.dataset.renamedIdx === "" ? null : Number(tokEl.dataset.renamedIdx);
    var ex = tokEl.dataset.extractedIdx == null || tokEl.dataset.extractedIdx === "" ? null : Number(tokEl.dataset.extractedIdx);
    selectFromRun(r, s, rn, ex);
  }
  function jumpToSpotlight(idx) {
    var file = activeFile();
    var target = codeBody.querySelector('.tok[data-spotlight-idx="' + idx + '"]');
    var run = file ? file.mergedRuns.filter(function (r) { return r.spotlightIdx === idx; })[0] : null;
    if (target) {
      target.scrollIntoView({ block: "center", inline: "center", behavior: "smooth" });
      target.focus({ preventScroll: true });
    }
    selectFromRun(run ? run.regionIdx : null, idx);
  }

  /* ============================================================
   * 13. Copy-to-clipboard for Pro CTAs (ceiling directive / proHint).
   * ============================================================ */
  function copyText(text, btn) {
    // An icon-sized button cannot hold the word "Copied" -- it names its own
    // confirmation with `data-copied-label` instead.
    function ok() {
      var prev = btn.textContent;
      btn.textContent = btn.getAttribute("data-copied-label") || "Copied";
      setTimeout(function () { btn.textContent = prev; }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, function () { fallbackCopy(text); ok(); });
    } else {
      fallbackCopy(text);
      ok();
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) { /* best effort */ }
    document.body.removeChild(ta);
  }

  /* ============================================================
   * 14. File switching, theme, rail collapse, popover + tooltips, init.
   * ============================================================ */
  function updateSourceOriginNote(file) {
    var noteEl = document.getElementById("source-origin-note");
    var origin = sourceOriginOf(file);
    // Three origins, not two. The `machinery` entry is the engine's own
    // accounting bucket, and what the pane shows for it is a fixed note the
    // engine wrote -- calling that "your original source" is the one claim this
    // viewer must never make, and it contradicted the `source origin: machinery`
    // row the engine-info block prints for the same file.
    noteEl.textContent = origin === "machinery" ? "engine note (not your source)"
      : origin === "engineInput" ? "source: engine-input"
      : "source: original (via source map)";
    noteEl.setAttribute("data-tip", origin === "machinery"
      ? "Not one of your files. This is the engine's accounting bucket for spans that map to no original source; the text in the pane is a fixed note the engine wrote, and the regions listed against it are measured in BUNDLE positions, so nothing here is painted over your code."
      : origin === "engineInput"
      ? "Colored over engine-input source — if this input was bundled, provide a source map to see pre-bundle original source."
      : "Colored over original source (recovered via input source map).");
  }

  function onActiveFileChanged() {
    var file = activeFile();
    if (!file) return;
    updateSourceOriginNote(file);
    updateSyntaxToggle(file);
    revealActiveFile();
    renderTree();
    scrollTreeToActive();
    syncHash();
    renderFileSummary(file);
    renderClassDist(file);
    renderEngineInfo(file);
    paintCode(file);
    renderWeakSpots(file);
    highlightSelectionRing();
    applyHighlightClass();
    renderInspector();
  }

  /* rail collapse: single-file builds auto-collapse (code pane gets the width);
   * the topbar toggle flips it and marks the choice manual so it sticks. */
  var appShell = document.getElementById("app");
  var railToggleBtn = document.getElementById("rail-toggle");
  function setRailCollapsed(collapsed, remember) {
    state.railCollapsed = collapsed;
    /* Only a DELIBERATE toggle is stored. A single-file build auto-collapses
       the tree, and remembering that would silently hide the tree on the next
       multi-file map the reader opens. */
    if (remember) setPref("railCollapsed", collapsed);
    appShell.classList.toggle("rail-collapsed", collapsed);
    railToggleBtn.setAttribute("aria-pressed", String(collapsed));
    railToggleBtn.setAttribute("title", collapsed ? "Show the file tree" : "Hide the file tree");
  }

  /* inspector (right rail) collapse -- same contract as the tree rail: the grid
   * drops the column and the code pane takes the width back. */
  var inspectorToggleBtn = document.getElementById("inspector-toggle");
  function setInspectorCollapsed(collapsed, remember) {
    state.inspectorCollapsed = collapsed;
    if (remember) setPref("inspectorCollapsed", collapsed);
    appShell.classList.toggle("inspector-collapsed", collapsed);
    if (!inspectorToggleBtn) return;
    inspectorToggleBtn.setAttribute("aria-pressed", String(collapsed));
    var label = collapsed ? "Show the inspector panel" : "Hide the inspector panel";
    inspectorToggleBtn.setAttribute("title", label);
    inspectorToggleBtn.setAttribute("aria-label", label);
  }

  /* IN-RAIL section collapse -- the Inspector block and the weak-spots list.
   * NOTE the name: `setInspectorCollapsed` above hides the WHOLE right rail;
   * this hides one section INSIDE it, and the two are stored under different
   * preference keys for exactly that reason. */
  function isSectionCollapsed(sectionId) {
    var sec = document.getElementById(sectionId);
    return !!(sec && sec.classList.contains("is-collapsed"));
  }
  function setSectionCollapsed(sectionId, headId, collapsed, remember, prefKey) {
    var sec = document.getElementById(sectionId);
    var head = document.getElementById(headId);
    if (sec) sec.classList.toggle("is-collapsed", collapsed);
    if (head) head.setAttribute("aria-expanded", String(!collapsed));
    if (remember && prefKey) setPref(prefKey, collapsed);
    syncRailFill();
  }
  function toggleInspectorSection() {
    setSectionCollapsed("inspector-section", "inspector-head",
      !isSectionCollapsed("inspector-section"), true, "inspectorSectionCollapsed");
  }
  function toggleWeakSpotsSection() {
    setSectionCollapsed("weakspots-section", "weakspots-head",
      !isSectionCollapsed("weakspots-section"), true, "weakspotsCollapsed");
  }
  /* A click on a token is a request to inspect, so it opens the section -- but
   * `remember` stays off: only a deliberate collapse is what gets stored. */
  function revealInspectorSection() {
    if (isSectionCollapsed("inspector-section")) {
      setSectionCollapsed("inspector-section", "inspector-head", false, false);
    }
  }

  /* ---- pane resizing ------------------------------------------------------
   * Both rails are sized by a custom property on the shell, so a drag is just a
   * clamped number written back to `--rail-left-w` / `--rail-right-w`. Clamp
   * rules: never below MIN_RAIL, never past 42% of the viewport, and never so
   * wide that the code pane drops under MIN_CODE. Persisted -- see PREFS. */
  /* ---- reader preferences --------------------------------------------------
   * Everything the reader can adjust about the CHROME -- theme, whether the
   * grammar is coloured, which rails are open, how wide they are -- kept in one
   * key so a map opened tomorrow looks like the one they arranged today.
   *
   * NOT the reading position: the active file, the selection and the facet are
   * per-artifact and belong in the deep link, which already carries them.
   *
   * Storage may be unavailable (a `file://` map in a browser that refuses site
   * data for local files, a private window, a viewer with storage blocked), so
   * every read and write is guarded and the viewer renders identically with
   * nothing stored. That was already true of the theme; it now covers the rest.
   *
   * Note `localStorage` is ORIGIN-scoped: a map opened from disk and the same
   * map served from the API keep separate preferences. Unavoidable, and
   * arguably right -- they are different contexts.
   */
  var PREFS_KEY = "afterpack-protmap-prefs";
  var THEME_KEY = "afterpack-protmap-theme";
  var prefs = {};
  function loadPrefs() {
    try {
      var raw = localStorage.getItem(PREFS_KEY);
      prefs = raw ? JSON.parse(raw) : {};
    } catch (e) { prefs = {}; }
    if (!prefs || typeof prefs !== "object") prefs = {};
    /* Carry over a theme chosen before this key existed. */
    if (prefs.theme !== "light" && prefs.theme !== "dark") {
      try {
        var legacy = localStorage.getItem(THEME_KEY);
        if (legacy === "light" || legacy === "dark") prefs.theme = legacy;
      } catch (e) { /* ignore */ }
    }
  }
  function setPref(k, v) {
    prefs[k] = v;
    try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) { /* unavailable */ }
  }
  loadPrefs();

  var MIN_RAIL = 180;
  var MIN_CODE = 320;
  var RESIZER_EL = {};
  function resizerEl(which) {
    if (!(which in RESIZER_EL)) RESIZER_EL[which] = document.getElementById(which === "left" ? "resize-left" : "resize-right");
    return RESIZER_EL[which];
  }
  function railWidth(which) {
    var v = parseFloat(getComputedStyle(appShell).getPropertyValue(which === "left" ? "--rail-left-w" : "--rail-right-w"));
    return isNaN(v) ? (which === "left" ? 262 : 340) : v;
  }
  /** Widest this rail may get: never past 42% of the shell, never so wide that
   *  the code pane drops under MIN_CODE, never below MIN_RAIL. */
  function railMax(which) {
    // the OTHER rail only competes for space while it is actually shown
    var otherShown = which === "left" ? !state.inspectorCollapsed : !state.railCollapsed;
    var other = otherShown ? railWidth(which === "left" ? "right" : "left") : 0;
    var shellW = appShell.getBoundingClientRect().width || window.innerWidth;
    return Math.max(MIN_RAIL, Math.min(shellW * 0.42, shellW - other - MIN_CODE));
  }
  /* The handle is a focusable `role="separator"`, i.e. a window splitter, so it
   * has to carry the width it controls -- a splitter with a name but no value
   * announces nothing to explain the focus ring sitting on it. */
  function syncRailAria(which, w) {
    var handle = resizerEl(which);
    if (!handle) return;
    handle.setAttribute("aria-valuenow", String(Math.round(w == null ? railWidth(which) : w)));
    handle.setAttribute("aria-valuemax", String(Math.round(railMax(which))));
  }
  /** Re-apply stored rail widths. Runs AFTER the shell exists, and through
   *  `setRailWidth` so a width stored on a wide screen is re-clamped on a
   *  narrow one rather than squeezing the code pane to nothing. */
  function restoreRailWidths() {
    if (typeof prefs.railLeftW === "number") setRailWidth("left", prefs.railLeftW, false);
    else syncRailAria("left", null);
    if (typeof prefs.railRightW === "number") setRailWidth("right", prefs.railRightW, false);
    else syncRailAria("right", null);
  }
  function setRailWidth(which, px, persist) {
    var w = Math.round(Math.max(MIN_RAIL, Math.min(px, railMax(which))));
    appShell.style.setProperty(which === "left" ? "--rail-left-w" : "--rail-right-w", w + "px");
    syncRailAria(which, w);
    if (persist !== false) setPref(which === "left" ? "railLeftW" : "railRightW", w);
    return w;
  }
  function wireResizer(el, which) {
    if (!el) return;
    var dragging = false;
    var dragWidth = null;
    function widthFromPointer(clientX) {
      var r = appShell.getBoundingClientRect();
      return which === "left" ? clientX - r.left : r.right - clientX;
    }
    el.addEventListener("pointerdown", function (e) {
      if (e.button != null && e.button !== 0) return;
      dragging = true;
      el.classList.add("is-dragging");
      document.body.classList.add("is-resizing");
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* capture is best-effort */ }
      e.preventDefault();
    });
    el.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      dragWidth = setRailWidth(which, widthFromPointer(e.clientX), false);
      e.preventDefault();
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      el.classList.remove("is-dragging");
      document.body.classList.remove("is-resizing");
      try { if (e && e.pointerId != null) el.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ }
      if (dragWidth != null) setPref(which === "left" ? "railLeftW" : "railRightW", dragWidth);
      dragWidth = null;
    }
    el.addEventListener("pointerup", endDrag);
    el.addEventListener("pointercancel", endDrag);
    el.addEventListener("lostpointercapture", endDrag);
    // keyboard parity for the role="separator" (16px per press, 48px with shift)
    el.addEventListener("keydown", function (e) {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      var step = (e.shiftKey ? 48 : 16) * (e.key === "ArrowLeft" ? -1 : 1) * (which === "left" ? 1 : -1);
      setRailWidth(which, railWidth(which) + step);
      e.preventDefault();
    });
  }

  /* legend / "about this build" popover */
  var popoverEl = document.getElementById("build-popover");
  var legendBtn = document.getElementById("legend-toggle");
  function setPopover(open) {
    popoverEl.hidden = !open;
    legendBtn.setAttribute("aria-expanded", String(open));
  }
