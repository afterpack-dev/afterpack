<!doctype html>
<!-- no `data-theme` here on purpose: with no explicit choice the page follows the
     OS via `prefers-color-scheme`. The toggle stamps light/dark when the user picks. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>AfterPack · Protection Map</title>
<style>
/* ==========================================================================
   AfterPack Protection Map — self-contained viewer.
   Dev-only artifact. No external requests: no CDN, no webfonts, no images.
   ========================================================================== */

/* ---- design tokens (light default) -------------------------------------- */
:root {
  color-scheme: light dark;

  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-ui: Inter, -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  /* Neutrals are VS Code "Light Modern", verbatim: editor.background #ffffff,
     sideBar/titleBar #f8f8f8, list.hoverBackground #e8e8e8, panel border
     #e5e5e5, input.border #cecece, foreground #3b3b3b, descriptionForeground
     #616161. Only the PROTECTION vocabulary below (heat ramp, reversal-class
     hues, status colors, brand gold) is ours -- the chrome is the editor's. */
  --ground: #ffffff;
  --surface-1: #ffffff;
  --surface-2: #f8f8f8;
  --surface-3: #ececec;
  --surface-hover: #e8e8e8;
  --scrollbar: #c9c9c9;
  --border: #e5e5e5;
  --border-strong: #cecece;
  /* VS Code Light Modern's foreground is #3b3b3b; we sit one step darker,
     between it and Light+'s #000000. #3b3b3b would drop body-over-hottest-
     wash from the previous pass's 6.57:1 to 4.82:1 -- a real regression for
     an imperceptible gain in theme fidelity. */
  --text-primary: #262626;
  --text-secondary: #616161;
  --text-muted: #767676;

  /* accent: metallic gold. On light surfaces we anchor to a deeper gold so the
     accent stays legible as text/borders; the active-control fill uses it too. */
  --brand: #a06a12;
  --brand-hover: #b57317;
  --brand-ink: #ffffff;
  --focus-ring: #a06a12;

  /* the whole-file "machinery bucket" wash -- deliberately near-neutral */
  --wash: #f3f3f3;

  /* protection heatmap: sequential PER-FILE RELATIVE ramp, none(low score in
     this file) -> yellow -> RED (high score in this file). Every stop is
     composited at <= 0.5 alpha over the page ground (see tokenAlpha), and the
     alpha floor is now low on purpose: the file's coolest positive-score
     region should read as barely-there, so only its hottest region(s) read
     unmistakably red. */
  --heat-0: #fff3c2;
  --heat-1: #ffde85;
  --heat-2: #ffc247;
  --heat-3: #fa940f;
  --heat-4: #e6650f;
  --heat-5: #d1381a;
  --heat-6: #b62020;

  /* cost lens: sequential single-hue amber, pale(cheap) -> deep(costly) */
  --cost-0: #f8e3d5;
  --cost-1: #eec9ae;
  --cost-2: #dda780;
  --cost-3: #c48350;
  --cost-4: #a45f24;
  --cost-5: #7f4406;
  --cost-6: #5a2d00;

  /* exclusion bands (orthogonal to heat/cost -- the engine currently only ever
     emits "inflatable", the rest are reserved by the spec) */
  --band-safety: #d4d4d4;
  --band-reflection: #bdbdbd;
  --band-skip: #969696;

  /* status colors -- semantic, kept separate from the gold accent and from
     both ramps; never the only signal (icon + text label always ship too) */
  --status-leak: #dc2626;
  --status-leak-soft: #fee2e2;
  --status-property: #b45309;
  --status-property-soft: #fef3c7;
  --status-weak: #a16207;
  --status-weak-soft: #fef9c3;

  /* reversal-class chips -- categorical, distinct from the sequential gold heat
     ramp above. preserved=neutral, renamed-encoded=teal (achieved today),
     flattened-fused=blue (Free ceiling), destroyed-fused=premium violet with a
     gold edge (Pro ceiling). */
  --class-preserved: #525252;
  --class-preserved-soft: #e5e5e5;
  /* the wash a PRESERVED token gets in the code pane: the bottom rung of the
     same background language the heat ramp uses, one small step further from the
     ground than the flat machinery band so the two are told apart where they
     abut, both far below any chromatic wash. Alpha rather than a hex, so it
     composites over the line wash instead of punching an opaque hole through
     it. See `.tok.tok-preserved`. */
  --class-preserved-wash: rgba(82, 82, 82, 0.09);
  --class-renamed: #0d7d88;
  --class-renamed-soft: #d6eef0;
  --class-flattened: #1d6fa5;
  --class-flattened-soft: #dbeafe;
  --class-destroyed: #7141b8;
  --class-destroyed-soft: #efe3fb;
  --class-destroyed-edge: #b57317;

  /* code-pane affordances: the hover tint/ring painted over an ATTRIBUTED token
     (a token you can click to inspect), and the drag handle between panes. */
  --tok-hover-bg: rgba(181, 115, 23, 0.36);
  --tok-hover-ring: rgba(160, 106, 18, 0.85);
  --resizer-hover: rgba(160, 106, 18, 0.55);

  /* syntax-highlighting ink -- a FOREGROUND-ONLY layer (see the `.lc i` rules).
     Deliberately clear of every hue the protection overlay already owns (gold =
     heat, teal = renamed, blue/violet = reversal classes, red = leak), and dark
     enough to stay legible where a heat wash is composited under it. */
  /* plate behind the wordmark -- see .brand-logo */
  --logo-plate: #141414;
  --syn-comment: #008000;
  --syn-key: #0000ff;
  --syn-str: #a31515;
  --syn-num: #046043;

  --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 4px 16px rgba(0, 0, 0, 0.08);
  --radius: 8px;
  --radius-card: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    /* VS Code "Dark Modern", verbatim: editor.background #1f1f1f,
       editorWidget.background #202020, sideBar/titleBar #181818,
       list.hoverBackground #2a2d2e, panel border #2b2b2b, input.border #3c3c3c,
       editor.foreground #cccccc, descriptionForeground #9d9d9d. */
    --ground: #1f1f1f;
    --surface-1: #202020;
    --surface-2: #181818;
    --surface-3: #2b2b2b;
    --surface-hover: #2a2d2e;
    --scrollbar: #4f4f4f;
    --border: #2b2b2b;
    --border-strong: #3c3c3c;
    --text-primary: #cccccc;
    --text-secondary: #9d9d9d;
    --text-muted: #8c8c8c;

    --brand: #eaae3d;
    --brand-hover: #fcea85;
    --brand-ink: #0a0a0a;
    --focus-ring: #eaae3d;

    --wash: #252526;

    /* dark ramp: dim bronze -> SATURATED red. It deliberately does NOT climb to
       a pale top stop. The ground is VS Code's #1f1f1f, and at the wash's 0.5
       alpha cap a pale top stop composites into the mid-tones, where NOTHING
       contrasts. Capping the ramp's luminance (not its chroma) keeps "hot"
       unmistakable while staying legible. The low->high separation is carried
       by alpha (0.10 -> 0.5) + hue (amber -> red) + saturation. */
    --heat-0: #543912; --heat-1: #714514; --heat-2: #8e4e15; --heat-3: #b15416;
    --heat-4: #d14b1a; --heat-5: #df3c2a; --heat-6: #df4949;

    --cost-0: #2a1c11; --cost-1: #482b14; --cost-2: #6d411c; --cost-3: #955823;
    --cost-4: #bf6f29; --cost-5: #e78b3c; --cost-6: #fca765;

    --band-safety: #2a2a2a; --band-reflection: #333333; --band-skip: #474747;

    --status-leak: #f87171; --status-leak-soft: rgba(248, 113, 113, 0.16);
    --status-property: #fbbf24; --status-property-soft: rgba(251, 191, 36, 0.16);
    --status-weak: #d0bb5a; --status-weak-soft: rgba(208, 187, 90, 0.15);

    --class-preserved: #b3b3b3; --class-preserved-soft: rgba(179, 179, 179, 0.20);
    --class-preserved-wash: rgba(179, 179, 179, 0.06);
    --class-renamed: #5ed0d0; --class-renamed-soft: rgba(94, 208, 208, 0.20);
    --class-flattened: #6db8ea; --class-flattened-soft: rgba(109, 184, 234, 0.20);
    --class-destroyed: #c9a3ff; --class-destroyed-soft: rgba(201, 163, 255, 0.20); --class-destroyed-edge: #eaae3d;

    --tok-hover-bg: rgba(234, 174, 61, 0.26);
    --tok-hover-ring: rgba(234, 174, 61, 0.95);
    --resizer-hover: rgba(234, 174, 61, 0.65);

    /* syntax ink, dark twin: VS Code Dark+ HUES, luminance-lifted. VS Code's own
       #569cd6 / #ce9178 / #b5cea8 are tuned for a FLAT #1f1f1f and measure
       1.3-2.9:1 once a heat wash is composited under them; lifting L (hue and
       chroma unchanged) buys back >=4:1. Comments keep VS Code's #6a9955 exactly
       -- over a wash they yield to the body colour instead (see `.tok-ink-yield`). */
    --logo-plate: rgba(255, 255, 255, 0.04);
    --syn-comment: #6a9955;
    --syn-key: #8fc8ff;
    --syn-str: #e8b598;
    --syn-num: #c3dbb4;

    --shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 8px 24px rgba(0, 0, 0, 0.55);
  }
}

/* ---- reset / base --------------------------------------------------------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
html { overflow-x: hidden; }
body {
  margin: 0;
  overflow-x: hidden;
  background: var(--ground);
  color: var(--text-primary);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; font-family: var(--font-mono); font-weight: 600; }
button { font: inherit; color: inherit; }
p { margin: 0 0 0.6em; }
p:last-child { margin-bottom: 0; }
ul { margin: 0; padding: 0; list-style: none; }
a { color: var(--brand); }
a:hover { color: var(--brand-hover); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
  border-radius: 3px;
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.mono { font-family: var(--font-mono); }

/* ---- app shell -------------------------------------------------------------- */
.app-shell {
  /* both rail widths are live custom properties -- the drag handles below write
     them back onto this element, so nothing else in the layout needs to know. */
  --rail-left-w: 262px;
  --rail-right-w: 340px;
  display: grid;
  grid-template-columns: var(--rail-left-w) minmax(0, 1fr) var(--rail-right-w);
  grid-template-rows: auto 1fr;
  grid-template-areas:
    "top    top    top"
    "left   center right";
  height: 100vh;
  width: 100%;
}
/* collapsed rail: drop the tree column, hand its width to the code pane. Set
   automatically for single-file builds, toggled manually from the topbar. */
.app-shell.rail-collapsed {
  grid-template-columns: minmax(0, 1fr) var(--rail-right-w);
  grid-template-areas:
    "top    top"
    "center right";
}
.app-shell.rail-collapsed .rail-left { display: none; }
/* same idea for the inspector rail (panel-right toggle in the topbar) */
.app-shell.inspector-collapsed {
  grid-template-columns: var(--rail-left-w) minmax(0, 1fr);
  grid-template-areas:
    "top    top"
    "left   center";
}
.app-shell.inspector-collapsed .rail-right { display: none; }
.app-shell.rail-collapsed.inspector-collapsed {
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas:
    "top"
    "center";
}

/* ---- pane drag handles ------------------------------------------------------- */
/* Each handle is a grid item sharing its rail's area, pinned to the rail's inner
   edge and nudged half its width over the border so it straddles it. Hit area is
   wider than the visible hairline (a 2px line is a miserable drag target). */
.pane-resizer {
  position: relative;
  z-index: 6;
  width: 9px;
  align-self: stretch;
  cursor: col-resize;
  touch-action: none;
  background: transparent;
  border: none;
  padding: 0;
}
.pane-resizer#resize-left { grid-area: left; justify-self: end; margin-right: -4px; }
.pane-resizer#resize-right { grid-area: right; justify-self: start; margin-left: -4px; }
.pane-resizer::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 3px;
  width: 3px;
  border-radius: 2px;
  background: transparent;
  transition: background-color 0.15s ease;
}
.pane-resizer:hover::before,
.pane-resizer.is-dragging::before { background: var(--resizer-hover); }
/* The handle IS keyboard-operable (ArrowLeft/ArrowRight resize it, Shift for a
   bigger step), so it stays a tab stop. It used to suppress the outline and tint
   its 3px hairline instead, which made it a PHANTOM: Tab lit up a sliver on a
   transparent 9px strip with nothing to say what had focus. It now takes the
   document's focus ring, drawn inside its own hit area so it reads as "the pane
   divider", not as a stray mark on the code pane. */
.pane-resizer:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: -1px;
  border-radius: 4px;
}
.pane-resizer:focus-visible::before { background: var(--brand); }
/* a rail that is hidden has no grid area -- hide its handle too, or it would be
   auto-placed into a phantom track */
.app-shell.rail-collapsed .pane-resizer#resize-left,
.app-shell.inspector-collapsed .pane-resizer#resize-right { display: none; }
/* during a drag: no text selection, no transition fighting the pointer */
body.is-resizing { cursor: col-resize; user-select: none; -webkit-user-select: none; }
body.is-resizing .pane-resizer::before { transition: none; }
@media (prefers-reduced-motion: reduce) { .pane-resizer::before { transition: none; } }

@media (max-width: 980px) {
  /* stacked single-column layout: the rails are full-width bands, nothing to drag */
  .pane-resizer { display: none; }
  /* the collapsed-variant rules above are more specific than a bare `.app-shell`,
     so they have to be named here or they'd keep forcing a 2-column track set */
  .app-shell,
  .app-shell.rail-collapsed,
  .app-shell.inspector-collapsed,
  .app-shell.rail-collapsed.inspector-collapsed {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto auto;
    grid-template-areas:
      "top"
      "left"
      "center"
      "right";
    height: auto;
    min-height: 100vh;
  }
  .rail-left, .rail-right { max-height: 46vh; }
  /* BOUNDED, like the rails either side of it. Without the cap the code pane
     grows to the file's full height -- a long file pushed the inspector two
     thousand pixels down the page, so tapping a token on a phone appeared to do
     nothing at all. `.code-body` already scrolls; capping the pane is what lets
     it. */
  .pane-center { min-height: 60vh; max-height: 60vh; }
}
@media (max-width: 480px) {
  .topbar { padding: 8px 10px; }
  .rail-left, .rail-right { padding: 10px 8px 18px; }
  .code-toolbar { padding: 6px 10px; }
}

/* ---- top bar ---------------------------------------------------------------- */
.topbar {
  grid-area: top;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  row-gap: 8px;
  padding: 10px 16px;
  background: var(--surface-1);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  min-width: 0;
}
.topbar h1 {
  font-size: 14px;
  letter-spacing: 0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar h1 .dot { color: var(--brand); }
/* The artifact's OWN size, where the "DEV ONLY" badge used to shout. The badge
   said nothing a reader could act on and never changed; the size does both --
   and the dev-only warning it replaced now rides in this chip's tooltip, which
   is where every other caveat in this viewer lives. */
.tag-size {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-secondary);
  background: var(--surface-3);
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  padding: 2px 7px;
  white-space: nowrap;
  flex-shrink: 0;
  cursor: help;
  transition: color 0.3s ease, border-color 0.3s ease;
}
.tag-size:hover, .tag-size:focus-visible { color: var(--brand); border-color: var(--brand); }
.topbar .spacer { flex: 1 1 auto; min-width: 8px; }

/* inline AfterPack wordmark, right-aligned -- gold+silver gradients read on the
   void-black bar (native), and the SVG carries no external refs. */
.brand-logo {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
  margin-left: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  /* The wordmark's "Pack" half is a silver gradient drawn for the void-black
     bar -- on a light ground it vanishes. The chip carries its own dark plate so
     the logo reads identically in both themes. */
  background: var(--logo-plate);
  box-shadow: inset 0 0 0 1px var(--border);
  /* it is a link (to the product site, new tab) -- give it link affordance without
     letting the anchor's text color touch the SVG's own gradients */
  text-decoration: none;
  color: inherit;
  transition: box-shadow 0.3s ease, background-color 0.3s ease;
}
.brand-logo:hover, .brand-logo:focus-visible { box-shadow: inset 0 0 0 1px var(--brand); }
.brand-logo svg { height: 22px; width: auto; display: block; }

.segmented {
  display: inline-flex;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  overflow: hidden;
  flex-shrink: 0;
}
.segmented button {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border: none;
  background: var(--surface-2);
  color: var(--text-secondary);
  padding: 7px 12px;
  cursor: pointer;
  transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
}
.segmented button + button { border-left: 1px solid var(--border-strong); }
/* up to five facets in a 262px rail (and 180px at the resizer's floor): let the
   group take the full width and the buttons share it, trimming padding rather
   than clipping the last facet off the end of a fixed-width row. */
.segmented-tight { display: flex; width: 100%; max-width: 100%; }
.segmented-tight button {
  padding: 6px 4px;
  font-size: 10px;
  letter-spacing: 0.01em;
  flex: 1 1 auto;
  min-width: 0;
  white-space: nowrap;
}
.segmented button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); box-shadow: 0 0 20px rgba(234, 174, 61, 0.4); }
.segmented button:hover:not([aria-pressed="true"]) { background: var(--surface-hover); }

.theme-toggle {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 700;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--surface-2);
  color: var(--text-secondary);
  padding: 7px 10px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background-color 0.3s ease, border-color 0.3s ease;
}
.theme-toggle:hover { background: var(--surface-hover); }

/* topbar icon buttons -- rail collapse + the legend/build popover trigger. Same
   glass chrome as the theme toggle, sized for a single glyph or short label. */
.top-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 700;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--surface-2);
  color: var(--text-secondary);
  padding: 7px 10px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
}
.top-btn:hover { background: var(--surface-hover); }
.top-btn[aria-expanded="true"], .top-btn[aria-pressed="true"] { color: var(--brand); border-color: var(--brand); }
.top-btn .top-btn-glyph { font-size: 13px; line-height: 1; }
.top-btn-icon { padding: 6px 8px; }
.top-btn-icon svg { display: block; }

/* The two PANE toggles are one control, not two unrelated buttons: same
   panel glyph mirrored left/right, joined into a single segment at the head of
   the bar so "which rail does this hide" is answered by the icon itself. */
.top-btn-pair { display: inline-flex; flex-shrink: 0; }
.top-btn-pair .top-btn { border-radius: 0; }
.top-btn-pair .top-btn:first-child { border-top-left-radius: var(--radius); border-bottom-left-radius: var(--radius); }
.top-btn-pair .top-btn:last-child { border-top-right-radius: var(--radius); border-bottom-right-radius: var(--radius); }
.top-btn-pair .top-btn + .top-btn { border-left-width: 0; }
/* a pressed (= rail hidden) button owns the shared edge, or the neighbour's
   border-left removal would eat half of its highlight */
.top-btn-pair .top-btn[aria-pressed="true"] + .top-btn { border-left: 1px solid var(--border-strong); }

/* left-rail file search -- terse glass input, filters the tree by path substring */
.tree-search {
  width: 100%;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-primary);
  background: var(--surface-1);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 6px 9px;
  margin: 6px 0;
}
.tree-search::placeholder { color: var(--text-muted); }
.tree-empty { font-size: 11.5px; color: var(--text-muted); font-style: italic; padding: 6px 2px; }
/* Deep-link fallback note: shown only when a `#file=` / `#filter=` fragment named
   something this map cannot show, so the link lands on the default view WITH the
   reason rather than silently somewhere else. */
.tree-note {
  font-size: 10.5px;
  line-height: 1.45;
  color: var(--text-muted);
  background: var(--surface-3);
  border-radius: 6px;
  padding: 5px 7px;
  margin: 0 0 6px;
}

/* ---- rails ------------------------------------------------------------------ */
.rail-left, .rail-right { overflow-y: auto; min-width: 0; }
.rail-left {
  grid-area: left;
  background: var(--surface-2);
  border-right: 1px solid var(--border);
  padding: 14px 12px 24px;
}
.rail-right {
  grid-area: right;
  background: var(--surface-2);
  border-left: 1px solid var(--border);
  /* flex column: a fixed-height inspector PIN on top, a scrolling list below.
     Padding lives on the two inner wrappers so each scrolls independently. */
  padding: 0;
  display: flex;
  flex-direction: column;
  overflow-y: hidden;
}
.rail-right-pin {
  flex: 0 0 auto;
  max-height: 58%;
  overflow-y: auto;
  padding: 14px 12px 10px;
  border-bottom: 1px solid var(--border);
}
.rail-right-scroll {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 12px 12px 24px;
}
.rail-right-pin .rail-section { margin-bottom: 0; }
/* On narrow screens the rail is a short capped band: let it flow + scroll as a
   whole instead of splitting a tiny height between pin and list. */
@media (max-width: 980px) {
  .rail-right { display: block; overflow-y: auto; padding: 0; }
  .rail-right-pin { max-height: none; overflow-y: visible; padding: 12px 10px; }
  .rail-right-scroll { overflow-y: visible; padding: 12px 10px 18px; }
}
.rail-section { margin-bottom: 18px; }
.rail-section:last-child { margin-bottom: 0; }
.rail-section > .eyebrow { display: block; margin-bottom: 8px; }
.rail-right-pin .rail-section + .rail-section { margin-top: 14px; }

/* single-line tree header: `Files (425)` + (only when there are any) the total
   leak count, right-aligned. One line, one mention of the word "files". */
.tree-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.tree-head > .eyebrow { flex: 1 1 auto; min-width: 0; }
.workspace-line {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-muted);
  flex: 0 0 auto;
}
.workspace-line:empty { display: none; }

/* file tree -- rows bleed into the rail's own horizontal padding so a top-level
   entry starts flush at the pane edge (nested depth still indents). */
/* Row height is a TOKEN because the sticky-ancestry maths below is expressed in
   it: a folder at depth d pins at `d - 1` rows down, so the visible files' whole
   ancestry stacks above them while you scroll. Rows must therefore be a fixed,
   known height -- hence `height` rather than symmetric padding. */
.tree {
  display: flex;
  flex-direction: column;
  margin: 0 -8px;
  --tree-row-h: 28px;
  /* cancels the rail's own top padding: sticky offsets are measured from the
     scrollport's CONTENT edge, so without this a pinned folder would float 14px
     down and rows would scroll visibly through the gap above it. */
  --tree-pin-off: -14px;
}
/* A folder row and its subtree share ONE wrapper, because `position: sticky` is
   scoped to the containing block: without it a folder would keep hanging at its
   pin offset long after its own subtree had scrolled past, colliding with the
   next branch's folder at the same depth. With it, each folder unpins exactly
   when its last descendant leaves. */
.tree-node, .tree-branch { display: flex; flex-direction: column; }
.tree-row {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  height: var(--tree-row-h);
  flex: 0 0 auto;
  background: transparent;
  border: none;
  text-align: left;
  cursor: pointer;
  padding-right: 8px;
  border-radius: 6px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-primary);
  transition: background-color 0.3s ease, box-shadow 0.3s ease;
}
/* `top` + `z-index` are written inline per row from the node's depth. The rail
   is the scroll container; the row must be OPAQUE (it overlaps the rows beneath
   it) and a shallower ancestor must out-stack a deeper one. */
.tree-row-folder { position: sticky; background: var(--surface-2); }
.tree-row:hover { background: var(--surface-hover); }
.tree-row-file.is-active { background: var(--surface-1); box-shadow: 0 0 0 1px var(--brand) inset; font-weight: 700; }
/* gitignored / third-party (node_modules, or anything the data flags as vendor):
   de-emphasized but fully selectable -- it comes back to full strength on hover
   and while it is the active file. */
.tree-row.is-ignored { color: var(--text-muted); opacity: 0.62; }
.tree-row.is-ignored:hover, .tree-row.is-ignored.is-active, .tree-row.is-ignored:focus-visible { opacity: 1; }
.tree-file-meter.is-ignored { opacity: 0.45; }
.tree-twisty {
  flex: 0 0 auto;
  width: 1em;
  display: inline-block;
  text-align: center;
  color: var(--text-muted);
  transition: transform 0.12s ease;
}
.tree-row-folder[aria-expanded="false"] .tree-twisty { transform: rotate(-90deg); }
.tree-icon { flex: 0 0 auto; }
.tree-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-count { flex: 0 0 auto; font-size: 10px; color: var(--text-muted); }
/* A file with at least one RECORDED "@afterpack" marker. Derived from the same
   `aggregate.directives` the code pane rings -- never guessed from the source
   text, which the viewer does not scan for markers. */
.tree-mark {
  flex: 0 0 auto;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  color: var(--brand);
  border: 1px solid var(--brand);
  border-radius: 4px;
  padding: 0 4px;
  line-height: 1.5;
}
.tree-row-folder .tree-mark { opacity: 0.75; }
.tree-file-meter { padding-bottom: 6px; padding-right: 10px; }
/* WEAK SPOTS on a tree row -- the count of `spotlights[]` entries, which is what
   the engine's `aggregate.weakRegions` counts and what the dashboard's "Weak
   spots" tile sums. `.has-leak` is the subset severity (`leakCount`): a readable
   literal that survived, versus a residual property name. Folders carry the same
   badge for their whole subtree, because the tree now opens COLLAPSED and a
   folder that hides a weak spot has to say so. */
.badge-weak {
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--brand-ink);
  background: var(--status-property);
  border-radius: 999px;
  padding: 1px 6px;
  line-height: 1.4;
}
/* `--brand-ink` (not white) on BOTH severities: dark theme's leak red is a light
   #f87171, and white on it measures 2.8:1 -- the ink has to flip with the theme
   the same way the badge's ground does. */
.badge-weak.has-leak { background: var(--status-leak); }
.tree-row-folder .badge-weak { opacity: 0.78; }

.meter { height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 3px 0 0 3px; }
.meter-lg { height: 7px; border-radius: 4px; }

/* class distribution + legend */
.class-dist-bar { display: flex; height: 10px; border-radius: 4px; overflow: hidden; background: var(--surface-3); margin-bottom: 8px; }
.class-dist-bar i { display: block; height: 100%; }
.class-dist-bar i[data-class="preserved"] { background: var(--class-preserved); }
.class-dist-bar i[data-class="renamed-encoded"] { background: var(--class-renamed); }
.class-dist-bar i[data-class="flattened-fused"] { background: var(--class-flattened); }
.class-dist-bar i[data-class="destroyed-fused"] { background: var(--class-destroyed); }
.class-dist-rows { display: flex; flex-direction: column; gap: 4px; margin-bottom: 2px; }
.class-dist-row { display: flex; align-items: center; gap: 8px; font-size: 11px; }
.class-dist-count { margin-left: auto; font-family: var(--font-mono); font-weight: 700; color: var(--text-secondary); }
.class-reached-line { font-size: 11px; color: var(--text-secondary); margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.class-dist-footnote { font-size: 10px; color: var(--text-muted); margin-top: 6px; font-style: italic; }

.class-legend-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 11px; }
.class-legend-flag {
  flex: 0 0 auto;
  font-family: var(--font-mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}

.class-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid transparent;
  flex-shrink: 0;
  white-space: nowrap;
}
.class-chip .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.class-chip[data-class="preserved"] { color: var(--class-preserved); background: var(--class-preserved-soft); }
.class-chip[data-class="preserved"] .dot { background: var(--class-preserved); }
.class-chip[data-class="renamed-encoded"] { color: var(--class-renamed); background: var(--class-renamed-soft); }
.class-chip[data-class="renamed-encoded"] .dot { background: var(--class-renamed); }
.class-chip[data-class="flattened-fused"] { color: var(--class-flattened); background: var(--class-flattened-soft); }
.class-chip[data-class="flattened-fused"] .dot { background: var(--class-flattened); }
.class-chip[data-class="destroyed-fused"] { color: var(--class-destroyed); background: var(--class-destroyed-soft); border-color: var(--class-destroyed-edge); }
.class-chip[data-class="destroyed-fused"] .dot { background: var(--class-destroyed); }
.class-chip.is-ghost { opacity: 0.6; background: transparent; border-style: dashed; border-color: currentColor; }

.tier-pill {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border-radius: 4px;
  padding: 2px 6px;
  border: 1px solid;
  flex-shrink: 0;
}
.tier-pill.tier-free { color: var(--text-secondary); border-color: var(--border-strong); background: var(--surface-2); }
.tier-pill.tier-pro { color: var(--class-destroyed); border-color: var(--class-destroyed); background: var(--class-destroyed-soft); }

/* legend (heat/cost scale) */
.legend-bar { height: 10px; border-radius: 3px; border: 1px solid var(--border); }
.legend-labels { display: flex; justify-content: space-between; margin-top: 5px; font-size: 10.5px; font-family: var(--font-mono); color: var(--text-muted); }

/* engine info */
.engine-info {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-muted);
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 3px 8px;
}
.engine-info dt { text-align: left; }
.engine-info dd { margin: 0; text-align: right; color: var(--text-secondary); overflow-wrap: anywhere; }

/* ---- center code pane -------------------------------------------------------- */
.pane-center { grid-area: center; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--ground); }

/* sticky per-file summary header: the file's path + a few headline metrics, so
   the "what am I looking at / how hard was it hit" answer rides above the code. */
/* TWO rows now, not two stacked bars: the path (+ a copy button, + where the
   source came from) on top, the pane's own switches underneath. The six headline
   metrics that used to eat the right half of this bar moved into the inspector
   rail -- they are per-FILE facts, and the rail is where per-file facts live. */
.file-summary {
  flex: 0 0 auto;
  position: sticky;
  top: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 0;
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.file-head-row { display: flex; align-items: center; gap: 8px; padding: 9px 14px 5px; min-width: 0; }
.file-head-spacer { flex: 1 1 auto; min-width: 10px; }
.file-summary-path { display: flex; align-items: baseline; gap: 1px; min-width: 0; font-family: var(--font-mono); font-size: 12.5px; }
/* Ellipsis on the LEFT: with a 9-segment Next.js route the tail (the folders you
   are actually in, and the file) is the half worth keeping. `unicode-bidi:
   plaintext` takes the paragraph direction from the first strong character, so
   the path still reads left-to-right -- only the overflow side flips. */
.file-summary-path .fs-dir {
  color: var(--text-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  direction: rtl;
  unicode-bidi: plaintext;
  min-width: 0;
}
.file-summary-path .fs-name { color: var(--text-primary); font-weight: 700; flex-shrink: 0; }
#source-origin-note { flex: 0 0 auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); white-space: nowrap; cursor: help; }
/* Square icon button -- reuses `.mini-btn`'s chrome, sized for one glyph. */
.icon-btn {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 20px;
  padding: 0 5px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  border: 1px solid var(--border-strong);
  border-radius: 5px;
  background: var(--surface-2);
  color: var(--text-secondary);
  cursor: pointer;
  transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
}
.icon-btn:hover { background: var(--surface-hover); color: var(--brand); border-color: var(--brand); }
.code-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  min-width: 0;
}
.code-toolbar .toolbar-spacer { flex: 1 1 auto; min-width: 8px; }
.toggle-inline { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); cursor: pointer; white-space: nowrap; flex: 0 0 auto; }
.toggle-inline input[type="checkbox"] { accent-color: var(--brand); width: 13px; height: 13px; margin: 0; }
.toggle-inline:has(input:disabled) { opacity: 0.45; cursor: not-allowed; }
/* The count used to appear from nowhere and shove its neighbours sideways. It
   now occupies a permanently-reserved slot and only becomes VISIBLE -- the
   sentence that used to be printed here is the toggle's tooltip. */
#highlight-class-status {
  flex: 0 0 auto;
  display: inline-block;
  min-width: 12ch;
  color: var(--brand);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  visibility: hidden;
}
#highlight-class-status.is-on { visibility: visible; }

.code-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px 0 40px; }
.code-line { display: flex; min-width: max-content; white-space: pre; }
.ln {
  position: sticky;
  left: 0;
  flex: 0 0 auto;
  /* Fixed content-box width (set inline in `ch` from the digit count) so the
     gutter never grows at 9->10 / 99->100 and the code column stays put. */
  box-sizing: content-box;
  padding: 0 12px 0 14px;
  text-align: right;
  color: var(--text-muted);
  background: var(--ground);
  border-right: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 12.5px;
  user-select: none;
}
.lc { flex: 1 1 auto; font-family: var(--font-mono); font-size: 12.5px; padding-left: 14px; padding-right: 40px; }
/* Only an ATTRIBUTED span (a region and/or a weak spot behind it) is clickable --
   `.tok-hot` is stamped by the painter. Everything else (engine scaffolding, gaps)
   is inert: clicking it CLEARS the selection, so it must not advertise a click. */
.tok { cursor: default; border-radius: 2px; transition: filter 0.1s ease, box-shadow 0.1s ease; }
.tok.tok-hot, .tok.tok-unlit { cursor: pointer; }
/* Obvious hover: a gold tint painted as a background-IMAGE (the heat wash lives in
   the token's inline background-color, so an image layers over it instead of
   fighting it) plus a full ring -- readable even over a preserved token's near-
   invisible wash. */
.tok.tok-hot:hover,
.tok.tok-hot:focus-visible,
.tok.tok-unlit:hover,
.tok.tok-unlit:focus-visible {
  background-image: linear-gradient(var(--tok-hover-bg), var(--tok-hover-bg));
  box-shadow: 0 0 0 1px var(--tok-hover-ring);
  filter: brightness(1.06);
}
/* One region is often painted as SEVERAL spans -- the run builder cuts it wherever
   a renamed token, a weak spot or a directive edge falls inside it -- so a ring on
   the hovered span alone outlines a fragment of the region, not the region. On
   hover we tint EVERY span carrying the same region index (a flat colour, so
   adjacent spans read as one continuous band) and keep the ring on the exact span
   under the pointer. */
.tok.tok-peer {
  background-image: linear-gradient(var(--tok-hover-bg), var(--tok-hover-bg));
  filter: brightness(1.06);
}
.tok.is-selected { outline: 2px solid var(--brand); outline-offset: 1px; }
.tok.spot-leak { text-decoration: underline; text-decoration-color: var(--status-leak); text-decoration-thickness: 2px; text-underline-offset: 2px; }
.tok.spot-propertyName { text-decoration: underline; text-decoration-color: var(--status-property); text-decoration-thickness: 2px; text-underline-offset: 2px; }
.tok.spot-weak { text-decoration: underline dashed; text-decoration-color: var(--status-weak); text-decoration-thickness: 2px; text-underline-offset: 2px; }
/* preserved token -- a span the engine left literal ON PURPOSE (module specifier,
   directive, public key...), and, far more often, the JavaScript GRAMMAR inside
   such a span: `return`, `this`, braces, punctuation, indentation. Nothing could
   ever have protected those, so this is the RESTING STATE of the page, not a
   finding, and it is painted as such -- the bottom rung of the same background
   language the heat ramp uses, a neutral one small step off the flat machinery
   band and nowhere near any chromatic wash.

   It used to carry no fill and a hairline dotted underline instead. A preserved
   region is routinely a whole class body, so that drew a dotted rule under every
   brace and every run of indentation in it -- a different mechanism from the rest
   of the overlay, and the loudest treatment on the page for the one thing with
   the least to say. */
.tok.tok-preserved {
  /* background-COLOR only: the hover tint rides on background-image and has to
     survive this. */
  background-color: var(--class-preserved-wash);
  color: var(--text-secondary);
}
/* The weak-spot marker in the code pane.
   Was the literal character "\u26a0", which renders at whatever size and shape the
   reader's emoji font decides -- tiny and off-baseline on most Linux stacks,
   a full-colour emoji on macOS. A drawn triangle is the same 11px mark
   everywhere, takes the severity colour from `currentColor`, and sits on the
   text baseline instead of floating above it. */
.pin {
  display: inline-block;
  width: 11px;
  height: 11px;
  margin-right: 2px;
  vertical-align: -1px;
  /* No colour of its own: the mark inherits from the token it sits in, so a
     `leak` spotlight and a `weak` one get the triangle in the same hue their
     own underline uses. A first version set `color: var(--sev-weak, …)`, a
     variable that exists nowhere in this file — the fallback always won, every
     severity got the same orange, and it ignored the theme. */
  flex: 0 0 auto;
}
.lc .tok.spot-leak > .pin { color: var(--status-leak); }
.lc .tok.spot-propertyName > .pin { color: var(--status-property); }
.lc .tok.spot-weak > .pin { color: var(--status-weak); }
.pin svg { display: block; width: 100%; height: 100%; }

/* ---- syntax highlighting ------------------------------------------------------
   A strictly FOREGROUND layer. The protection overlay owns every background in
   this pane (heat wash, renamed wash, machinery wash, hover tint, directive
   rings), so a grammar may only ever set `color` -- plus italic on comments. That
   is what keeps the two readable at once: colour = what the code SAYS, fill =
   what AfterPack DID to it.

   Four classes is the entire vocabulary (comment / keyword / string / number).
   Identifiers, operators and punctuation deliberately stay at the pane's own text
   colour: a fifth and sixth hue would start competing with the wash for
   attention, and every hue here is already chosen to avoid the ones the overlay
   reserves (gold = heat, teal = renamed, blue/violet = reversal class, red =
   leak). See `--syn-*` for the per-theme contrast notes.

   Attributed runs carry the syntax class on an INNER <i> (so the outer `.tok`
   stays one element per run and hover/selection/directive rings are unaffected);
   un-attributed tokens are their own `.tok`, so the class sits directly on it. */
.lc i { font-style: normal; }
.lc i.sy-c, .lc .tok.sy-c { color: var(--syn-comment); font-style: italic; }
/* A comment under a heat wash keeps the italic but drops the mute: grey on a
   deep-gold fill is the one syntax colour with no contrast left to give. */
.lc .tok-hot i.sy-c { color: inherit; }
/* ...and past a MEASURED point up the heat ramp, so does every other grammar
   colour. The painter stamps this class on runs whose composited wash would take
   any syntax ink below the contrast floor (see `inkYieldScore`): above it the
   protection layer is the signal and colour is the layer with nothing left to
   give, so the grammar yields to the pane's own text colour rather than
   whispering. Foreground-only, as the whole syntax layer must be. */
.lc .tok-ink-yield i { color: inherit; }
.lc i.sy-k, .lc .tok.sy-k { color: var(--syn-key); }
.lc i.sy-s, .lc .tok.sy-s { color: var(--syn-str); }
.lc i.sy-n, .lc .tok.sy-n { color: var(--syn-num); }

/* ---- @afterpack directive: the MARKER, and only the marker ---------------
   A directive is the one thing on this page the reader put there themselves, so
   the marker text is styled in the brand's own language:

     `@afterpack`   animated brand gradient on the GLYPHS
     its parameters brand colour, static
     everything else in that comment  ordinary comment colour

   WHAT THIS REPLACED, AND WHY. The first version painted the whole
   RECORDED REGION -- every token from the marker to `end`. Two
   things were wrong with that. It highlighted hundreds of lines to announce one
   annotation ("entire page is highlighted"), and worse, it collided with the
   comment-wash mask below: `.dir-ink` set `color: transparent` and painted its
   gradient through `background-clip: text`, while `.lc i.sy-c` paints an opaque
   ground to keep washes off comments. The child's ground covered the parent's
   clipped gradient and the comment text rendered INVISIBLE inside an outlined
   box. Styling only the marker removes the overlap, so neither rule can fight
   the other.

   The gutter bar still spans the whole recorded region -- that part was worth
   keeping, and a line number cannot collide with a text gradient. */
.dir-kw {
  background-image: linear-gradient(100deg,
    var(--brand) 0%, var(--brand-hover) 30%, var(--brand-hover) 50%,
    var(--brand-hover) 70%, var(--brand) 100%);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: dir-sweep 9s linear infinite;
  font-weight: 700;
}
/* Parameters name WHICH directive, so they carry the brand colour but hold
   still -- two animated things in one comment is one too many. */
.dir-arg { color: var(--brand); font-weight: 600; }
@keyframes dir-sweep { from { background-position: 0% 0; } to { background-position: 300% 0; } }

/* A directive is worth finding by scrolling, so the gutter admits to it for the
   whole region recorded for the marker. */
.code-line.has-directive .ln { color: var(--brand); }
.code-line.has-directive .ln::after {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 1.15em;
  border-radius: 0 2px 2px 0;
  background: linear-gradient(180deg, var(--brand-hover), var(--brand));
}

@media (prefers-reduced-motion: reduce) {
  .dir-kw { animation: none; background-position: 50% 0; }
}

/* Un-attributed stretch: the flat `--wash` band, painted PER TOKEN rather than
   across the whole stretch.

   It used to sit on the `.unlit` wrapper, which made the band continuous over
   everything between two attributed regions -- including the comments, the
   indentation and the `;`. That is what "comments have a background" was: not
   an attribution error (the engine attributes NO comment, NO whitespace and NO
   bare punctuation -- 0 of 19,882 regions on a real build), but this wrapper
   painting over them.

   On the token instead: whitespace is emitted as bare text with no element at
   all, so it now goes unpainted for free, and a comment token opts out below.
   The wash stays visually continuous across runs of adjacent code tokens
   because they abut. */
.unlit { background: transparent; }
.lc .tok.tok-unlit { background: var(--wash); }
/* A comment is not code and never carries protection -- it gets the grammar's
   colour and no band whatsoever.

   Comments reach the DOM in TWO shapes and both have to be answered:
     * `.tok.sy-c`  -- a comment sitting in an un-attributed stretch, which is
       its own token and simply declines the wash;
     * `i.sy-c`     -- a comment INSIDE an attributed run (the grammar only ever
       contributes an inner `<i>`), whose wash belongs to the enclosing span and
       cannot be switched off from the child. That one is masked instead: it
       paints the pane's own ground, so the wash stops at the comment and
       resumes after it. `--ground` is the same token `.ln` uses, so the mask
       follows a theme flip for free. */
.lc .tok.tok-unlit.sy-c { background: transparent; }
.lc i.sy-c { background: var(--ground); }

/* directive span -- an "@afterpack" marker RECORDED over this range
   (Pro only). NOTHING IS PAINTED OVER THE REGION any more.

   It used to be a continuous region tint. A `skip` block can be a thousand
   lines, so tinting all of it to announce one annotation buried the protection
   overlay underneath and read as "the entire file is highlighted". The marker
   text carries the treatment instead (`.dir-kw` / `.dir-arg` above), and the
   gutter bar carries the region's extent.

   `data-directive` survives on the token as DATA -- the inspector and the
   `marked` facet read it -- but no stylesheet rule paints from it.

   The legend below shows the same marker treatment in its swatch rather than a
   per-kind hue, so the legend and the code pane cannot drift apart. */
.directive-legend-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 11px; }
/* The swatch IS the marker treatment (`.dir-kw`), so the legend and the code
   pane cannot drift apart. Sized by its text rather than by a fixed box. */
.directive-legend-row .swatch { flex: 0 0 auto; font-family: var(--font-mono); font-size: 10px; }
.directive-legend-row code { font-family: var(--font-mono); color: var(--text-secondary); }

/* "highlight same class" mode -- a deliberate, labeled overlay (toggled via
   #highlight-class-toggle), orthogonal to the heat wash. Dims every painted
   token whose region is a DIFFERENT reversal class than the current
   selection, and rings the ones that match. Tokens with no data-class
   (engine scaffolding / gaps) are untouched either way. */
.code-body[data-highlight-class] .tok[data-class]:not([data-class="preserved"]):not([data-class="renamed-encoded"]):not([data-class="flattened-fused"]):not([data-class="destroyed-fused"]) { opacity: 1; }
.code-body[data-highlight-class="preserved"] .tok[data-class]:not([data-class="preserved"]),
.code-body[data-highlight-class="renamed-encoded"] .tok[data-class]:not([data-class="renamed-encoded"]),
.code-body[data-highlight-class="flattened-fused"] .tok[data-class]:not([data-class="flattened-fused"]),
.code-body[data-highlight-class="destroyed-fused"] .tok[data-class]:not([data-class="destroyed-fused"]) {
  opacity: 0.28;
}
.code-body[data-highlight-class="preserved"] .tok[data-class="preserved"] { box-shadow: 0 0 0 1px var(--class-preserved) inset; }
.code-body[data-highlight-class="renamed-encoded"] .tok[data-class="renamed-encoded"] { box-shadow: 0 0 0 1px var(--class-renamed) inset; }
.code-body[data-highlight-class="flattened-fused"] .tok[data-class="flattened-fused"] { box-shadow: 0 0 0 1px var(--class-flattened) inset; }
.code-body[data-highlight-class="destroyed-fused"] .tok[data-class="destroyed-fused"] { box-shadow: 0 0 0 1px var(--class-destroyed) inset; }

/* ---- tooltips + info affordance ---------------------------------------------- */
/* one shared, JS-positioned tooltip node (id="tooltip"). Any element with a
   `data-tip` opens it on hover/focus -- the default UI stays terse and the long
   prose (blurbs, caveats, class notes) lives here instead of on the page. */
.tooltip {
  position: fixed;
  z-index: 60;
  max-width: 300px;
  font-family: var(--font-ui);
  font-size: 11.5px;
  line-height: 1.45;
  color: var(--text-primary);
  /* OPAQUE surface: the tooltip floats over busy code and other cards. The glass
     `--surface-1` is ~transparent in dark (rgba .03) and, unlike the popover, the
     tooltip has no backdrop-blur, so it would bleed the content behind it. */
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 8px 10px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s ease;
}
.tooltip[data-show] { opacity: 1; }
.info-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  cursor: help;
  flex-shrink: 0;
  vertical-align: middle;
}
.info-dot:hover, .info-dot:focus-visible { color: var(--brand); border-color: var(--brand); }

/* legend / "about this build" popover: everything moved off the left rail --
   class distribution, the reversal-class legend, the heat scale, engine info. */
.popover {
  position: fixed;
  top: 54px;
  right: 14px;
  z-index: 50;
  width: 320px;
  max-width: calc(100vw - 28px);
  max-height: calc(100vh - 70px);
  overflow-y: auto;
  background: var(--surface-1);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 14px 14px 16px;
}
.popover[hidden] { display: none; }
.popover-section { margin-bottom: 16px; }
.popover-section:last-child { margin-bottom: 0; }
.popover-section > .eyebrow { display: block; margin-bottom: 8px; }

/* ---- right panel -------------------------------------------------------------- */

/* compact weak-spot rows -- a native <details> per leak: a one-line summary
   (severity + sample + bytes/mechanism) that expands to full detail on demand,
   so a file with 30+ leaks stays a scannable list instead of a wall of cards. */
.weakspot { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-1); margin-bottom: 6px; overflow: hidden; transition: border-color 0.3s ease; }
.weakspot:last-child { margin-bottom: 0; }
.weakspot[open] { border-color: var(--border-strong); }
.weakspot-summary { display: flex; align-items: center; gap: 7px; padding: 6px 9px; cursor: pointer; list-style: none; }
.weakspot-summary::-webkit-details-marker { display: none; }
.weakspot-summary:hover { background: var(--surface-hover); }
.weakspot-sev { flex: 0 0 auto; padding: 1px 5px; font-size: 10px; }
.weakspot-sample { flex: 1 1 auto; min-width: 0; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-primary); overflow-wrap: anywhere; white-space: pre-wrap; }
.weakspot-tail { flex: 0 0 auto; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); white-space: nowrap; }
.weakspot-body { padding: 8px 10px 10px; border-top: 1px dashed var(--border); }
.weakspot-reason { font-size: 11px; color: var(--text-secondary); margin: 0 0 6px; }
.weakspot-kv { font-size: 10.5px; color: var(--text-muted); font-family: var(--font-mono); margin: 0 0 8px; overflow-wrap: anywhere; }
.empty-note { font-size: 11.5px; color: var(--text-muted); font-style: italic; }
/* clean "all good" state: one quiet line, no reserved space, no alarm color */
.empty-note-ok { font-size: 11.5px; color: var(--text-muted); font-style: normal; margin: 0; }
.empty-note-ok .ok-check { color: var(--brand); font-weight: 700; margin-right: 4px; }

/* COLLAPSIBLE rail sections. Both right-rail sections open as a single header
   row that already states what they hold -- the Inspector's selection summary,
   the weak-spot count -- so nothing in the rail reserves height for content the
   reader has not asked for. The chevron is the same glyph the inspector's own
   <details> blocks use, rotated the same way. */
.rail-section-headrow { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.rail-collapsible.is-collapsed > .rail-section-headrow { margin-bottom: 0; }
.rail-section-head {
  display: flex; align-items: baseline; gap: 8px;
  flex: 1 1 auto; min-width: 0;
  background: none; border: 0; padding: 0; margin: 0;
  font: inherit; color: inherit; text-align: left; cursor: pointer;
}
.rail-section-head::before {
  content: "\25B8";
  flex: 0 0 auto;
  color: var(--text-muted);
  font-size: 10px;
  line-height: 1;
  transition: transform 0.12s ease;
}
.rail-section-head[aria-expanded="true"]::before { transform: rotate(90deg); }
.rail-section-head > .eyebrow { flex: 0 0 auto; margin-bottom: 0; }
.rail-section-count {
  flex: 1 1 auto;
  min-width: 0;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rail-section-count:empty { display: none; }
/* One rule collapses either body. */
.rail-collapsible.is-collapsed > :not(.rail-section-headrow) { display: none; }

/* EMPTY weak-spots section collapses to a single row -- title and the "none"
   line share one line, and the whole band shrinks to its content so the pinned
   inspector above reclaims the rest of the rail's height. Empty and COLLAPSED
   are different states and compose: an empty section has nothing to expand, so
   its one-line all-clear stays beside the header either way. */
.weakspots-section.is-empty { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.weakspots-section.is-empty > .rail-section-headrow { margin-bottom: 0; }
.weakspots-section.is-empty #weakspots-list { margin-top: 0 !important; flex: 1 1 auto; min-width: 0; }
.weakspots-section.is-empty.is-collapsed > #weakspots-list { display: block; }
/* `#weakspots=hidden`: the section is not rendered at all, and the scrolling
   half of the rail goes with it so the pin owns the whole height. */
.rail-right.weakspots-hidden #weakspots-section,
.rail-right.weakspots-hidden .rail-right-scroll { display: none; }
/* Height handoff: whenever the weak-spots half is quiet -- empty, collapsed or
   hidden -- the pin stops being capped and takes the slack, so a collapsed
   header never sits inside a 58%-tall reserved band. */
.rail-right.weakspots-quiet .rail-right-pin { max-height: none; flex: 1 1 auto; min-height: 0; }
.rail-right.weakspots-quiet .rail-right-scroll { flex: 0 0 auto; overflow-y: visible; padding-bottom: 12px; }
/* ...unless the Inspector is collapsed too, in which case both sections are one
   header row each and neither should stretch. */
.rail-right.inspector-section-collapsed .rail-right-pin { flex: 0 0 auto; max-height: none; }
@media (max-width: 980px) {
  .rail-right.weakspots-quiet .rail-right-pin { flex: 0 0 auto; }
}


/* neutral mini button (weak-spot "jump to code") -- distinct from the red copy CTA */
.mini-btn { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; border: 1px solid var(--border-strong); color: var(--text-secondary); background: var(--surface-2); border-radius: 5px; padding: 4px 8px; cursor: pointer; transition: background-color 0.3s ease, border-color 0.3s ease; }
.mini-btn:hover { background: var(--surface-hover); }

/* native <details> expanders inside the inspector (lineage "show more",
   collapsible complexity block). Default disclosure triangle is hidden; a
   rotating chevron is drawn via ::before so both themes match the dark UI. */
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.details-summary { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.details-summary::before { content: "\25B8"; color: var(--text-muted); font-size: 10px; display: inline-block; transition: transform 0.12s ease; }
details[open] > .details-summary::before { transform: rotate(90deg); }
.chain-extra { margin-top: 2px; }
.chain-extra > summary { font-size: 10.5px; color: var(--brand); font-style: italic; padding: 3px 0 3px 22px; }
.chain-extra > summary::before { content: "\FF0B "; font-style: normal; }
.chain-extra[open] > summary::before { content: "\FF0D "; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border-radius: 999px;
  padding: 2px 7px;
  flex-shrink: 0;
}
.pill-leak { background: var(--status-leak-soft); color: var(--status-leak); }
.pill-propertyName { background: var(--status-property-soft); color: var(--status-property); }
.pill-weak { background: var(--status-weak-soft); color: var(--status-weak); }

.inspector-section {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 10px 12px;
  margin-bottom: 12px;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}
.inspector-section:last-child { margin-bottom: 0; }
.inspector-section h3 { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.inspector-empty { font-size: 12px; color: var(--text-muted); }

/* ---- inspector: the STABLE shell (#13) --------------------------------------
   Every selection kind renders the same skeleton -- one identity line, one score
   meter, one context line, a SIX-row fact grid, one action line -- so the panel's
   height is a constant and clicking from a leak to a comment to a renamed
   identifier does not move a pixel. Two rules make that hold:

     1. the fact grid always has exactly six rows (a kind with less to say pads
        with an invisible one), and
     2. NOTHING in here wraps. Every cell is nowrap + ellipsis, so no value can
        add a second line however long it is.

   The prose those cards used to print -- the class blurb, the "span is wrong
   even though the transform is real" caveat, the weakest-link leak warning, the
   lineage-not-recorded note -- did not get deleted. It moved into the `data-tip`
   of the row, chip or flag it belongs to, which is the same "(?)"-rule the rest
   of the product follows. A row that carries one says so with a dotted key. */
.insp { display: flex; flex-direction: column; gap: 8px; }
.insp-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 9px 11px; }
.insp-ident { display: flex; align-items: center; gap: 6px; height: 22px; min-width: 0; }
.insp-ident .class-chip, .insp-ident .tier-pill { min-width: 0; overflow: hidden; }
.insp-ident .class-chip { flex: 0 1 auto; }
.insp-flags { display: flex; align-items: center; gap: 4px; margin-left: auto; flex: 0 0 auto; }
.insp-flag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border: 1px solid;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  line-height: 1;
  cursor: help;
}
.insp-flag[data-kind="warn"] { color: var(--status-property); border-color: var(--status-property); background: var(--status-property-soft); }
.insp-flag[data-kind="leak"] { color: var(--status-leak); border-color: var(--status-leak); background: var(--status-leak-soft); }
.insp-flag[data-kind="dir"] { color: var(--brand); border-color: var(--brand); }
.insp-flag[data-kind="info"] { color: var(--text-muted); border-color: var(--border-strong); }
.insp-score { flex: 0 0 auto; font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--text-primary); }
.insp-score small { font-size: 10px; font-weight: 700; color: var(--text-muted); }
.insp-meter { margin: 7px 0 7px; }
.insp-meter.is-blank { visibility: hidden; }
.insp-where { height: 16px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.insp-facts { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
.insp-fact { display: flex; align-items: center; gap: 10px; height: 19px; }
.insp-fact > .k { flex: 0 0 auto; font-size: 11.5px; color: var(--text-secondary); white-space: nowrap; }
.insp-fact[data-tip] > .k { border-bottom: 1px dotted var(--border-strong); cursor: help; }
.insp-fact > .v { flex: 1 1 auto; min-width: 0; text-align: right; font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.insp-fact > .v.is-dim { color: var(--text-muted); font-weight: 400; }
.insp-fact > .v.is-warn { color: var(--status-leak); }
.insp-fact .class-chip { font-size: 9.5px; padding: 1px 6px; vertical-align: middle; }
.insp-fact.is-pad { visibility: hidden; }
/* Reserved whether or not this selection has an action -- an appearing button is
   exactly the kind of reflow this panel exists to not do. */
.insp-actions { display: flex; align-items: center; gap: 6px; height: 27px; overflow: hidden; margin-top: 8px; }
.insp-chain { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 7px 11px; }
.insp-chain > summary { height: 18px; }
.insp-chain[open] > .details-summary { margin-bottom: 8px; }
.insp-chain .chain-step:last-of-type .chain-body { padding-bottom: 0; }
.insp-note { font-size: 11px; color: var(--text-secondary); }
.insp-title { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; color: var(--text-secondary); white-space: nowrap; }
.insp-hint { font-size: 11px; color: var(--text-muted); font-style: italic; }
/* the chain stepper is re-homed inside a <details>; drop the card chrome it
   brought with it so it reads as this card's own body, not a nested panel */
.insp-chain .inspector-section { background: transparent; border: 0; border-radius: 0; padding: 0; margin: 0; }
.insp-chain .inspector-section > h3 { display: none; }

/* per-file band, pinned above the inspector: the six headline metrics that used
   to live in the code pane's header (#7). Fixed six rows; never selection-driven. */
.file-band { display: flex; flex-direction: column; gap: 2px; }
.fb-row { display: flex; align-items: center; gap: 10px; height: 19px; }
.fb-row > .k { flex: 0 0 auto; font-size: 11.5px; color: var(--text-secondary); border-bottom: 1px dotted var(--border-strong); cursor: help; }
.fb-row > .v { flex: 1 1 auto; min-width: 0; text-align: right; font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fb-row > .v.is-warn { color: var(--status-leak); }
.fb-row .class-chip { font-size: 9.5px; padding: 1px 6px; }
.file-band-section { margin-bottom: 12px; }


/* transform-chain stepper -- oldest->newest, one node per collapsed step. A
   vertical connector runs through the node dots; the step body carries the
   transform name + a category/phase caption + the entropy/size delta. */
.chain { display: flex; flex-direction: column; }
.chain-step { display: flex; gap: 10px; }
.chain-rail { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; width: 12px; }
.chain-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; background: var(--brand); box-shadow: 0 0 0 3px var(--surface-1); flex: 0 0 auto; }
.chain-line { flex: 1 1 auto; width: 2px; background: var(--border-strong); min-height: 8px; }
.chain-step:last-of-type .chain-line { display: none; }
.chain-body { flex: 1 1 auto; min-width: 0; padding-bottom: 10px; }
.chain-step:last-of-type .chain-body { padding-bottom: 0; }
.chain-head { display: flex; align-items: baseline; gap: 6px; }
.chain-transform { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--text-primary); overflow-wrap: anywhere; }
.chain-count { color: var(--brand); font-weight: 700; font-family: var(--font-mono); font-size: 11px; }
.chain-delta { margin-left: auto; color: var(--text-muted); font-family: var(--font-mono); font-size: 10px; white-space: nowrap; }
.chain-caption { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); letter-spacing: 0.02em; margin-top: 1px; }
.chain-more { margin-top: 6px; font-size: 10.5px; color: var(--text-muted); font-style: italic; padding-left: 22px; }
.chip {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  background: var(--surface-3);
  color: var(--text-secondary);
  border-radius: 4px;
  padding: 1px 5px;
  flex: 0 0 auto;
}


.copy-btn-pro { border-color: var(--brand); color: var(--brand); }
.copy-btn-pro:hover { background: var(--surface-2); }


/* narrow-screen: keep the code pane's own horizontal scroll only */
@media (max-width: 980px) { .app-shell { overflow: visible; } }

/* text selection -- gold highlight, dark ink (robust in both themes) */
::selection { background: rgba(234, 174, 61, 0.3); color: #0a0a0a; }

/* scrollbar aesthetics (progressive; harmless if unsupported) */
.rail-left, .rail-right, .code-body { scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 9999px; }
::-webkit-scrollbar-thumb:hover { background: var(--brand); }
</style>
</head>

    var lineDir = [false];

    file.mergedRuns.forEach(function (run) {
      var text = src.slice(run.start, run.end);
      var region = regionByIdx(file, run.regionIdx);
      var preserved = isPreservedRegion(region);
      var metric = region && !preserved ? metricForRegion(region) : 0;
      // Renamed-only: covered by the rename baseline but by NO region (regionIdx
      // is nulled in the run builder whenever a region wins, so this is mutually
      // exclusive with `region`). Bottom tier -- faint teal, never heat.
      var renamedOnly = !region && run.renamedIdx != null;
      // Extracted-only: the `Globals` lane covers this token and no region does
      // (the run builder already nulls the lane indices whenever a region wins,
      // and nulls `renamedIdx` whenever the extraction lane claims the run, so
      // the three are mutually exclusive by construction).
      var extractedOnly = !region && run.extractedIdx != null;
      var extracted = extractedOnly ? file.extractedRanges[run.extractedIdx] : null;
      var bg = "transparent", dataClass = "", extraCls = "";
      if (region) {
        if (preserved) {
          dataClass = "preserved"; // neutral bottom-rung wash via .tok-preserved
          extraCls = " tok-preserved";
        } else {
          bg = hexToRgba(rampColor(heatRamp, metric / 100), tokenAlpha(metric));
          dataClass = region.raw.reversalClass || "";
          // past the measured floor the wash owns this token; the grammar yields
          if (metric >= inkYield) extraCls += " tok-ink-yield";
        }
      } else if (extractedOnly) {
        bg = hexToRgba(renamedHex, EXTRACTED_WASH_ALPHA); // teal, a step up from the baseline
        extraCls = " tok-extracted";
        dataClass = "renamed-encoded"; // an injective, pool-recoverable re-encoding
      } else if (renamedOnly) {
        bg = hexToRgba(renamedHex, RENAMED_WASH_ALPHA); // faint teal baseline wash
        extraCls = " tok-renamed";
      }
      // else: machinery / gap -- the flat `--wash` band is painted by `.unlit`
      // (a CSS class, not an inline colour, so it also survives a theme flip).
      var spotlight = run.spotlightIdx != null ? file.spotlights[run.spotlightIdx] : null;
      // ATTRIBUTED = there is something to inspect (a region, a weak spot, or a
      // renamed-only token). `.tok-hot` drives the pointer cursor + hover
      // affordance, and it is what the click handler tests to decide "inspect
      // this" vs "clear the selection" -- so a renamed-only token is selectable
      // and truly-unlit space still deselects.
      var attributed = !!region || !!spotlight || extractedOnly || renamedOnly;
      // The `/* @afterpack ... */` marker (if any) recorded over this token.
      var directive = run.directiveIdx != null ? file.directives[run.directiveIdx] : null;
      // A directive ring has to stay on ONE element spanning the whole run, so a
      // directive-covered run keeps the single-span shape even with no region
      // under it (it is still clickable -- the marker is worth reading).
      // A directive-covered run used to be kept WHOLE so the region tint could
      // ride across it as one continuous band. The tint is gone, so that
      // grouping now only costs something: it made every `;` and every comment
      // inside a `skip` block one big clickable token. Split it like any other
      // un-attributed stretch, and let `unlitInner` carry the directive onto the
      // tokens that are actually worth inspecting.
      var perToken = !attributed;
      var cls = "tok" + extraCls + (attributed ? " tok-hot" : " tok-unlit unlit") + (spotlight ? " spot-" + spotlight.raw.severity : "");

      var titleParts = [];
      titleParts.push(region
        ? (preserved
            ? (region.raw.preservedReason ? "Preserved — must stay literal · " + humanize(region.raw.preservedReason) : "Preserved — readable, not obscured")
            : (CLASS_META[region.raw.reversalClass] ? CLASS_META[region.raw.reversalClass].label : region.raw.reversalClass) + " · score " + region.raw.score)
        : extractedOnly
          ? (extracted && extracted.kind === "global"
              ? "Global reference extracted into the constant pool — the name is gone from this access site"
              : "Property name extracted into the constant pool — the name is gone from this access site")
        : renamedOnly
          ? "Renamed identifier — original name not in your output (baseline, low-value protection)"
          : "Not attributed — click to see what this token is and what the map can (and cannot) say about it");
      if (spotlight) titleParts.push((SEVERITY_LABEL[spotlight.raw.severity] || spotlight.raw.severity) + ": " + (spotlight.raw.reason || ""));
      if (directive) titleParts.push("Directive: /* @afterpack " + directive.keyword + " */");

      /* NO REGION-WIDE TINT. A `skip` block can be a thousand lines; washing all
         of it to announce one marker buried the protection overlay underneath
         and read as "the entire file is highlighted". The marker itself is
         styled where it is written (`.dir-kw` / `.dir-arg`), and the gutter bar
         carries the region's extent. */
      var bgCss = bg === "transparent" ? "" : bg;

      var attrs = 'class="' + cls + '"' + (attributed ? ' tabindex="0" role="button"' : ' tabindex="-1"') +
        (bgCss ? ' style="background:' + bgCss + '"' : "") +
        ' data-region-idx="' + (run.regionIdx == null ? "" : run.regionIdx) + '"' +
        ' data-spotlight-idx="' + (run.spotlightIdx == null ? "" : run.spotlightIdx) + '"' +
        (run.renamedIdx == null ? "" : ' data-renamed-idx="' + run.renamedIdx + '"') +
        (run.extractedIdx == null ? "" : ' data-extracted-idx="' + run.extractedIdx + '"') +
        (attributed ? "" : ' data-unlit="' + run.start + '" data-ue="' + run.end + '" data-ut="?"') +
        (directive ? ' data-directive="' + directive.kind + '"' : "") +
        (dataClass ? ' data-class="' + dataClass + '"' : "") +
        ' title="' + escapeAttr(titleParts.join(" — ")) + '"';

      var pin = run.isSpotlightStart ? WARN_ICON : "";
      var segments = text.split("\n");
      var off = run.start;
      segments.forEach(function (seg, si) {
        if (seg.length) {
          var a = off, b = off + seg.length;
          lineChunks[lineChunks.length - 1].push(
            perToken
              ? unlitInner(a, b, directive)
              : "<span " + attrs + ">" + pin + synInner(a, b) + "</span>"
          );
          // The gutter bar is a LINE fact, so it is recorded as the segments are
          // laid down rather than re-derived from the emitted HTML.
          if (directive) lineDir[lineDir.length - 1] = true;
          pin = "";
          lineWLen[lineWLen.length - 1] += seg.length;
          lineWSum[lineWSum.length - 1] += seg.length * metric;
        }
        if (si < segments.length - 1) { lineChunks.push([]); lineWSum.push(0); lineWLen.push(0); lineDir.push(false); }
        off += seg.length + 1;
      });
    });

    var totalLines = file.source.split("\n").length;
    // Content-box width in ch for the widest line number, so every gutter is
    // identical and the code never shifts at 9->10 / 99->100 (see `.ln` CSS).
    var gutterWidth = String(totalLines).length + 1;

    var html = lineChunks.map(function (spans, i) {
      var lineNo = i + 1;
      var avgMetric = lineWLen[i] > 0 ? lineWSum[i] / lineWLen[i] : 0;
      var lineBg = avgMetric > 0 ? hexToRgba(rampColor(heatRamp, avgMetric / 100), lineAlpha(avgMetric)) : "transparent";
      return '<div class="code-line' + (lineDir[i] ? " has-directive" : "") + '" data-line="' + lineNo + '">' +
        '<span class="ln" style="width:' + gutterWidth + 'ch">' + lineNo + "</span>" +
        '<span class="lc" style="background:' + lineBg + '">' + (spans.join("") || " ") + "</span>" +
        "</div>";
    }).join("");
    codeBody.innerHTML = html;
  }

  /* ============================================================
   * 9. Left rail: file tree, KPIs, class distribution, legends.
   * ============================================================ */
  var treeEl = document.getElementById("file-tree");

  function countFilesUnder(node) {
    var n = 0;
    node.children.forEach(function (c) { n += c.type === "file" ? 1 : countFilesUnder(c); });
    return n;
  }
  /* Gitignored / third-party paths are DIMMED in the tree (still selectable). The
   * data's own `file.vendor` flag is the preferred signal; a `node_modules` path
   * segment is the fallback for anything it doesn't cover (e.g. folder rows, which
   * carry a path key rather than a file entry). */
  function isIgnoredPath(p) { return !!p && /(^|[\\/])node_modules([\\/]|$)/.test(p); }
  function isIgnoredFileIdx(idx) {
    var f = FILES[idx];
    return !!f && (isVendorFile(f) || isIgnoredPath(f.displayPath || f.displayName || ""));
  }

  /* How many files under this node carry a recorded marker -- so a COLLAPSED
     folder still admits that something inside it is marked. */
  function countMarkedUnder(node) {
    var n = 0;
    node.children.forEach(function (c) {
      n += c.type === "file" ? (isMarkedFile(FILES[c.fileIdx]) ? 1 : 0) : countMarkedUnder(c);
    });
    return n;
  }

  /* Weak spots under a node, with the LEAK subset alongside. The tree opens
     collapsed now, so a folder has to admit what its subtree is hiding. */
  function countWeakUnder(node) {
    var acc = { weak: 0, leaks: 0 };
    node.children.forEach(function (c) {
      if (c.type === "file") {
        var f = FILES[c.fileIdx];
        acc.weak += f.weakSpotCount; acc.leaks += f.leakCount;
      } else {
        var sub = countWeakUnder(c);
        acc.weak += sub.weak; acc.leaks += sub.leaks;
      }
    });
    return acc;
  }
  /* ONE badge for both tree rows and both counts. The number is WEAK SPOTS (what
     the dashboard tile sums); red means at least one of them is a leaked literal,
     amber means they are all residual property names. */
  function weakBadgeHtml(weak, leaks, scope) {
    if (!weak) return "";
    var residual = weak - leaks;
    var tip = weak + " weak spot" + (weak === 1 ? "" : "s") + " " + scope + ": " +
      (leaks > 0 ? leaks + " leaked literal" + (leaks === 1 ? "" : "s") : "no leaked literal") +
      (residual > 0 ? ", " + residual + " residual property name" + (residual === 1 ? "" : "s") : "") +
      ". A weak spot is a readable literal this build left in the output; the right rail lists every one in the open file.";
    // the leak subset is never signalled by colour alone: it carries the glyph too
    return '<span class="badge-weak' + (leaks > 0 ? " has-leak" : "") + '" data-tip="' +
      escapeAttr(tip) + '">' + (leaks > 0 ? "\u26a0 " : "") + weak + "</span>";
  }

  function renderTreeChildren(node, html) {
    node.children.forEach(function (child) {
      // depth 1 == top level, and it starts flush with the pane (no leading gutter);
      // only real nesting indents.
      var indent = (child.depth - 1) * 13;
      if (child.type === "folder") {
        var expanded = !!state.expandedFolders[child.key];
        var folderIgnored = isIgnoredPath(child.key) || child.name === "node_modules";
        var marked = countMarkedUnder(child);
        var weakUnder = countWeakUnder(child);
        // STICKY ANCESTRY (#4): a folder at depth d pins d-1 rows down, so the
        // visible files' whole chain of parents stacks above them while you
        // scroll. A shallower ancestor has to out-stack a deeper one, hence the
        // descending z-index; and the row must be OPAQUE, since it overlaps the
        // rows scrolling underneath it.
        html.push(
          '<div class="tree-node">' +
          '<button type="button" class="tree-row tree-row-folder' + (folderIgnored ? " is-ignored" : "") + '" data-kind="folder" data-key="' + escapeAttr(child.key) +
          '" style="padding-left:' + indent + "px;top:calc(var(--tree-row-h) * " + (child.depth - 1) + " + var(--tree-pin-off));z-index:" + Math.max(1, 24 - child.depth) +
