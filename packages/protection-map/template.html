  /* one shared tooltip node, positioned above (or below, if clipped) its target */
  var tooltipEl = document.getElementById("tooltip");
  var tipTarget = null;
  function positionTip(el) {
    var r = el.getBoundingClientRect();
    var tr = tooltipEl.getBoundingClientRect();
    var top = r.top - tr.height - 8;
    if (top < 8) top = r.bottom + 8;
    var left = r.left + r.width / 2 - tr.width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - tr.width - 8));
    tooltipEl.style.top = top + "px";
    tooltipEl.style.left = left + "px";
  }
  function showTip(el) {
    var tip = el.getAttribute("data-tip");
    if (!tip) return;
    tipTarget = el;
    tooltipEl.textContent = tip;
    tooltipEl.hidden = false;
    positionTip(el);
    tooltipEl.setAttribute("data-show", "");
  }
  function hideTip() {
    tipTarget = null;
    tooltipEl.removeAttribute("data-show");
  }

  /* Theme: two EXPLICIT choices only. There is no "Auto" button because the page
   * already follows the OS whenever no choice has been made -- `data-theme` simply
   * stays off the root and `prefers-color-scheme` decides (and keeps deciding, live:
   * see the media-query listener in wireEvents). The button always shows the theme
   * currently in effect and flips to the other one. */
  var THEME_LABEL = { light: "☀ Light", dark: "🌙 Dark" };
  var themeBtn = document.getElementById("theme-toggle");
  function systemTheme() {
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function repaintForTheme() {
    var file = activeFile();
    // the directive legend's swatch fill is baked from the theme's own vars too
    renderDirectiveLegend();
    if (file) { paintCode(file); renderTree(); renderLegend(); highlightSelectionRing(); }
  }
  function labelTheme(mode) {
    themeBtn.dataset.theme = mode;
    themeBtn.textContent = THEME_LABEL[mode] || THEME_LABEL.dark;
    themeBtn.setAttribute("aria-label", "Color theme: " + mode + ". Activate to switch to " + (mode === "dark" ? "light" : "dark") + ".");
  }
  /* `forced` = a theme the LINK asked for, not one the reader picked: applied to
     the page, never written to storage. Without that split, framing this viewer
     to match a host page would silently re-theme every other map on the origin. */
  function applyTheme(mode, quiet, forced) {
    if (mode !== "light" && mode !== "dark") mode = systemTheme();
    document.documentElement.setAttribute("data-theme", mode);
    labelTheme(mode);
    if (forced) { if (!quiet) repaintForTheme(); return; }
    setPref("theme", mode);
    /* Also under the old key, so a map generated by an earlier AfterPack that
       the reader still has on disk keeps following the same choice. */
    try { localStorage.setItem(THEME_KEY, mode); } catch (e) { /* file:// storage may be unavailable */ }
    if (!quiet) repaintForTheme();
  }

  function wireEvents() {
    railToggleBtn.addEventListener("click", function () {
      state.railManual = true;
      setRailCollapsed(!state.railCollapsed, true);
    });
    if (inspectorToggleBtn) {
      inspectorToggleBtn.addEventListener("click", function () { setInspectorCollapsed(!state.inspectorCollapsed, true); });
    }
    // `<button>` carries keyboard activation on its own -- no key handlers here.
    var inspectorHead = document.getElementById("inspector-head");
    if (inspectorHead) inspectorHead.addEventListener("click", toggleInspectorSection);
    var weakspotsHead = document.getElementById("weakspots-head");
    if (weakspotsHead) weakspotsHead.addEventListener("click", toggleWeakSpotsSection);
    wireResizer(document.getElementById("resize-left"), "left");
    wireResizer(document.getElementById("resize-right"), "right");
    legendBtn.addEventListener("click", function () { setPopover(popoverEl.hidden); });
    document.addEventListener("click", function (e) {
      if (popoverEl.hidden) return;
      if (!popoverEl.contains(e.target) && !legendBtn.contains(e.target)) setPopover(false);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { setPopover(false); hideTip(); }
    });
    var searchEl = document.getElementById("tree-search");
    if (searchEl) searchEl.addEventListener("input", function () { applyTreeSearch(searchEl.value); });

    // shared hover/focus tooltip, delegated so dynamically-rendered [data-tip]
    // elements need no per-element wiring.
    document.addEventListener("mouseover", function (e) {
      var el = e.target.closest ? e.target.closest("[data-tip]") : null;
      if (el && el !== tipTarget) showTip(el);
    });
    document.addEventListener("mouseout", function (e) {
      var el = e.target.closest ? e.target.closest("[data-tip]") : null;
      if (el && el === tipTarget && !el.contains(e.relatedTarget)) hideTip();
    });
    document.addEventListener("focusin", function (e) {
      var el = e.target.closest ? e.target.closest("[data-tip]") : null;
      if (el) showTip(el);
    });
    document.addEventListener("focusout", function () { hideTip(); });

    themeBtn.addEventListener("click", function () {
      applyTheme((themeBtn.dataset.theme || systemTheme()) === "dark" ? "light" : "dark");
    });
    // No explicit choice yet => keep tracking the OS live (the painted heat colors
    // are baked from CSS vars at paint time, so a system flip needs a repaint).
    var darkQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    if (darkQuery) {
      var onSystemThemeChange = function () {
        if (document.documentElement.hasAttribute("data-theme")) return;
        labelTheme(systemTheme());
        repaintForTheme();
      };
      if (darkQuery.addEventListener) darkQuery.addEventListener("change", onSystemThemeChange);
      else if (darkQuery.addListener) darkQuery.addListener(onSystemThemeChange);
    }
    // A click inside the code pane either INSPECTS an attributed span or CLEARS the
    // selection -- the gutter, whitespace, un-attributed scaffolding and the empty
    // area below the last line all count as "clicked nothing".
    codeBody.addEventListener("click", function (e) {
      var t = e.target.closest(".tok");
      if (isPickableTok(t)) handleTokActivate(t);
      else clearSelection();
    });
    codeBody.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var t = e.target.closest(".tok");
      if (!isPickableTok(t)) return;
      e.preventDefault();
      handleTokActivate(t);
    });
    // Whole-region hover: the syntax pass splits a region into several spans, so a
    // ring on the hovered span alone would outline a fragment. Tint every span of
    // the same region (flat colour, so they read as one band) and let CSS keep the
    // ring on the span actually under the pointer.
    var peerRegion = null;
    function setPeers(idx) {
      if (peerRegion === idx) return;
      codeBody.querySelectorAll(".tok.tok-peer").forEach(function (t) { t.classList.remove("tok-peer"); });
      peerRegion = idx;
      if (idx == null) return;
      codeBody.querySelectorAll('.tok[data-region-idx="' + idx + '"]').forEach(function (t) { t.classList.add("tok-peer"); });
    }
    codeBody.addEventListener("mouseover", function (e) {
      var t = e.target.closest ? e.target.closest(".tok-hot") : null;
      var idx = t && t.dataset.regionIdx !== "" ? t.dataset.regionIdx : null;
      setPeers(idx);
    });
    codeBody.addEventListener("mouseleave", function () { setPeers(null); });
    // ...and a click OUTSIDE the code pane clears too, except in the chrome that
    // acts on the current selection (rails, topbar, popover, drag handles) -- those
    // must not yank the panel out from under their own click.
    document.addEventListener("click", function (e) {
      if (!state.selection) return;
      var t = e.target;
      if (!t || !t.closest) return;
      if (t.closest(".tok") || t.closest(".rail-left, .rail-right, .topbar, .popover, .tooltip, .pane-resizer, .file-summary, .code-toolbar")) return;
      clearSelection();
    });
    // #5: the path copy button, on the same `data-copy` contract as the Pro CTAs.
    var headEl = document.getElementById("file-summary");
    if (headEl) {
      headEl.addEventListener("click", function (e) {
        var btn = e.target.closest ? e.target.closest("[data-copy]") : null;
        if (btn && btn.dataset.copy) copyText(decodeURIComponent(btn.dataset.copy), btn);
      });
    }
    document.getElementById("weakspots-list").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-jump-spotlight]");
      if (btn) jumpToSpotlight(Number(btn.dataset.jumpSpotlight));
    });
    document.getElementById("inspector").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-copy]");
      if (btn) { copyText(decodeURIComponent(btn.dataset.copy), btn); return; }
      // "Inspect that region" on the not-attributed card: jump the selection to the
      // neighbouring region the card just cited, and scroll it into view.
      var jump = e.target.closest("[data-select-region]");
      if (jump) {
        var idx = Number(jump.dataset.selectRegion);
        selectFromRun(idx, null, null);
        var target = codeBody.querySelector('.tok[data-region-idx="' + idx + '"]');
        if (target) target.scrollIntoView({ block: "center", inline: "nearest", behavior: "smooth" });
      }
    });
    if (syntaxToggle) {
      syntaxToggle.addEventListener("change", function () {
        state.syntaxOn = syntaxToggle.checked;
        setPref("syntaxOn", state.syntaxOn);
        var f = activeFile();
        if (f) { paintCode(f); highlightSelectionRing(); }
      });
    }
    treeEl.addEventListener("click", function (e) {
      var row = e.target.closest(".tree-row");
      if (!row) return;
      if (row.dataset.kind === "folder") {
        var key = row.dataset.key;
        state.expandedFolders[key] = !state.expandedFolders[key];
        renderTree();
      } else {
        var fi = Number(row.dataset.fileIdx);
        if (fi === state.activeFileIdx) return;
        state.activeFileIdx = fi;
        state.selection = null;
        onActiveFileChanged();
      }
    });
    highlightToggle.addEventListener("change", function () {
      state.highlightClassOn = highlightToggle.checked;
      applyHighlightClass();
    });
    var filterEl = document.getElementById("file-filter");
    if (filterEl) {
      filterEl.addEventListener("click", function (e) {
        var b = e.target.closest("button[data-filter]");
        if (b) setFileFilter(b.dataset.filter);
      });
    }
    // A second deep link into an ALREADY-OPEN artifact (the dashboard reusing its
    // tab). syncHash() uses replaceState, which fires no hashchange, so this only
    // ever runs for a navigation the reader/dashboard actually made.
    if (window.addEventListener) {
      window.addEventListener("hashchange", function () { applyDeepLink(readHashParams()); });
    }
  }

  /* Re-point the view at a fragment. Same fallbacks as the load-time pass: an
     unknown facet, an empty facet, or a path this map does not carry leaves the
     view where it is and prints why. */
  function applyDeepLink(h) {
    var note = "";
    if (typeof h.rail === "boolean") setRailCollapsed(h.rail);
    if (h.theme) applyTheme(h.theme, false, true);
    if (h.unknownFilter) {
      note = "This link asked for an unknown filter (\u201c" + h.unknownFilter + "\u201d).";
    } else if (h.filter) {
      var before = activeFileFilter;
      activeFileFilter = h.filter;
      var ok = h.filter === "all" || filteredFiles().length > 0;
      activeFileFilter = before;
      if (ok) setFileFilter(h.filter);
      else note = "No file in this build matches the \u201c" + h.filter + "\u201d filter.";
    }
    if (h.file) {
      var idx = findFileIdxByPath(h.file);
      if (idx < 0) {
        note = (note ? note + " " : "") + "\u201c" + h.file + "\u201d is not in this Protection Map.";
      } else if (idx !== state.activeFileIdx) {
        if (!filteredFiles().some(function (f) { return f.fileIdx === idx; })) setFileFilter("all");
        state.activeFileIdx = idx;
        state.selection = null;
        onActiveFileChanged();
      }
    }
    setDeeplinkNote(note);
  }

  function init() {
    // No stored choice (or a stale "auto" from an older build) => leave `data-theme`
    // OFF and follow the OS; only a real light/dark preference is stamped on the root.
    // `#theme=` outranks both, for the same reason `#rail=` does (see 6b).
    if (HASH0.theme) applyTheme(HASH0.theme, true, true);
    else if (prefs.theme === "light" || prefs.theme === "dark") applyTheme(prefs.theme, true);
    else labelTheme(systemTheme());

    // Before the first paint, so the grammar is not drawn and then redrawn.
    if (typeof prefs.syntaxOn === "boolean") state.syntaxOn = prefs.syntaxOn;

    // The product link is assembled at runtime on purpose: the render test greps the
    // emitted HTML for an external scheme to prove the page pulls no subresources,
    // and an outbound navigation link is not a subresource.
    var brandLink = document.getElementById("brand-logo");
    if (brandLink) brandLink.setAttribute("href", ["https", "//www.afterpack.dev"].join(":"));

    renderClassLegendStatic();
    renderDirectiveLegend();
    renderWorkspaceSummary();
    renderMapSize();
    // A facet that can only ever return nothing is worse than no facet: on Free
    // (and on any build with no recorded marker) the Marked filter is removed
    // rather than left as a dead button, and a build with no weak spot at all
    // drops the Weak one for the same reason.
    var markedBtn = document.getElementById("filter-marked");
    if (markedBtn && !FILES.some(isMarkedFile)) markedBtn.remove();
    var weakBtn = document.getElementById("filter-weak");
    if (weakBtn && !FILES.some(isWeakFile)) weakBtn.remove();
    syncFilterButtons();
    setDeeplinkNote(deeplinkNote);
    wireEvents();

    // Single-file builds auto-collapse the rail so the code pane gets full
    // width; a REMEMBERED choice outranks that, because it was deliberate.
    // `#rail=` outranks BOTH -- an embedder asking for one layout must get it
    // whatever this origin happens to remember (see 6b). Never remembered.
    setRailCollapsed(
      typeof HASH0.rail === "boolean" ? HASH0.rail
        : typeof prefs.railCollapsed === "boolean" ? prefs.railCollapsed
        : FILES.length <= 1
    );
    if (prefs.inspectorCollapsed === true) setInspectorCollapsed(true);

    // BOTH in-rail sections default to COLLAPSED, so the restore test is
    // `!== false` -- the inverse of the `=== true` one line above, whose default
    // is open. Keep the asymmetry: it is the difference between "the rail is
    // shown unless you hid it" and "these sections are shut until you open one".
    // `#weakspots=` outranks the stored preference and is never written back,
    // same contract as `#rail=` / `#theme=` (see 6b).
    if (HASH0.weakspots === "hidden") {
      var railRight = document.getElementById("rail-right");
      if (railRight) railRight.classList.add("weakspots-hidden");
    }
    setSectionCollapsed("inspector-section", "inspector-head", prefs.inspectorSectionCollapsed !== false);
    setSectionCollapsed("weakspots-section", "weakspots-head",
      HASH0.weakspots ? HASH0.weakspots !== "open" : prefs.weakspotsCollapsed !== false);
    restoreRailWidths();

    var file = activeFile();
    if (!file) {
      document.getElementById("code-body").textContent = "No files in this Protection Map document.";
      return;
    }

    updateSourceOriginNote(file);
    updateSyntaxToggle(file);
    reapplyExpansion();
    renderTree();
    renderFileSummary(file);
    renderClassDist(file);
    renderLegend();
    renderEngineInfo(file);
    paintCode(file);
    renderWeakSpots(file);
    applyHighlightClass();
    renderInspector();
    scrollTreeToActive();
    syncHash();
  }

  init();
})();
</script>
</body>
</html>
